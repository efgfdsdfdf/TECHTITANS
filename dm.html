            // ─── LOAD DM VIEW ───
            async function loadPrivateMessagesView() {
                try {
                    const area = document.getElementById('messagesArea');
                    area.innerHTML = '';

                    const { data: allProfiles, error: profilesError } = await supabase
                        .from('profiles')
                        .select('id, full_name, job_role, avatar_url')
                        .neq('id', currentUser.id);
                    if (profilesError) throw profilesError;

                    const { data: allMessages } = await supabase
                        .from('private_messages')
                        .select('sender_id, recipient_id, created_at, content, audio_url')
                        .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`);

                    const lastInteraction = {};
                    if (allMessages) {
                        for (const msg of allMessages) {
                            const otherId = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
                            const time = new Date(msg.created_at).getTime();
                            if (!lastInteraction[otherId] || time > lastInteraction[otherId].time) {
                                lastInteraction[otherId] = { time, msg };
                            }
                        }
                    }

                    allProfiles.sort((a, b) => {
                        const timeA = lastInteraction[a.id]?.time || 0;
                        const timeB = lastInteraction[b.id]?.time || 0;
                        return timeB - timeA;
                    });

                    const unreadCounts = {};
                    const { data: unreadRows, error: unreadError } = await supabase
                        .from('private_messages')
                        .select('sender_id')
                        .eq('recipient_id', currentUser.id)
                        .is('read_at', null);
                    if (unreadError) console.warn('Unable to load unread counts:', unreadError);
                    for (const row of unreadRows || []) {
                        unreadCounts[row.sender_id] = (unreadCounts[row.sender_id] || 0) + 1;
                    }
                    dmUnreadBySender = unreadCounts;
                    updateDMBadge();

                    const conversationsHtml = allProfiles.map(profile => {
                        const unread = unreadCounts[profile.id] || 0;
                        const unreadBadge = unread > 0 ? `<span class="dm-unread-badge">${unread}</span>` :
                            '';
                        const seenIndicator = unread === 0 ?
                            `<span class="dm-conv-seen"><i class="fas fa-check-double"></i></span>` : '';
                        const onlineClass = onlineUsers.has(profile.id) ? 'online' : '';

                        let avatarHtml = '';
                        if (profile.avatar_url) {
                            avatarHtml =
                                `<img src="${escapeHtml(profile.avatar_url)}" class="dm-conv-avatar">`;
                        } else {
                            avatarHtml =
                                `<div class="dm-conv-avatar-initials" style="background:#2a3455;color:#9aa4bf;font-size:0.85rem;"><i class="fas fa-user"></i></div>`;
                        }

                        const lastMsgData = lastInteraction[profile.id];
                        let previewText = 'No messages yet';
                        let timeText = '';
                        if (lastMsgData) {
                            const m = lastMsgData.msg;
                            if (m.audio_url) previewText = '🎤 Voice Note';
                            else if (m.content) previewText = escapeHtml(m.content);
                            else previewText = 'Message';

                            const msgDate = new Date(m.created_at);
                            const now = new Date();
                            if (msgDate.toDateString() === now.toDateString()) {
                                timeText = formatTimeOnly(m.created_at);
                            } else {
                                timeText = msgDate.toLocaleDateString(undefined, { month: 'short',
                                day: 'numeric' });
                            }
                        }

                        return `
                    <div class="dm-conversation-item" data-user-id="${profile.id}" data-user-name="${escapeHtml(profile.full_name)}" data-user-role="${escapeHtml(profile.job_role)}">
                      <div class="dm-conv-avatar-wrap">
                        ${avatarHtml}
                        <span class="status-dot ${onlineClass}"></span>
                      </div>
                      <div class="dm-conv-content">
                        <div class="dm-conv-top-row">
                          <div class="dm-conv-name">${escapeHtml(profile.full_name)}</div>
                          ${timeText ? `<div class="dm-conv-time">${timeText}</div>` : ''}
                        </div>
                        <div class="dm-conv-preview">${previewText}</div>
                      </div>
                      ${unreadBadge}
                      ${seenIndicator}
                    </div>
                  `;
                    }).join('');

                    area.innerHTML = `
                  <div class="dm-layout">
                    <div class="dm-conversations-list" id="dmConversationsList">
                      <div class="dm-list-header">
                        <button class="dm-icon-btn dm-list-hamburger" id="mobileNavToggleList" title="Menu">☰</button>
                        <span>All Members</span>
                      </div>
                      ${conversationsHtml}
                    </div>
                    <div class="dm-chat-area" id="dmChatArea" style="display:none;">
                      <div class="dm-chat-header">
                        <div class="dm-chat-peer">
                          <button class="dm-back-btn dm-icon-btn" id="dmBackBtn" title="Back">&lt;</button>
                          <div id="dmPeerAvatar" class="avatar" style="display:none;"></div>
                          <div class="dm-peer-copy">
                            <span class="dm-chat-title">Select a conversation</span>
                            <span class="dm-chat-subtitle">Messages and calls stay private here</span>
                          </div>
                        </div>
                        <div class="dm-chat-actions">
                          <button class="dm-icon-btn" id="dmHeaderVoiceCallBtn" title="Voice call" disabled>Call</button>
                          <button class="dm-icon-btn" id="dmHeaderVideoCallBtn" title="Video call" disabled>Video</button>
                        </div>
                      </div>
                      <div id="dmReplyBar" class="dm-reply-bar">
                        <button class="reply-close" id="replyCloseBtn" title="Cancel reply"><i class="fas fa-times"></i></button>
                        <div class="reply-line">
                          <span class="reply-sender" id="replySender">Replying to Someone</span>
                          <span class="reply-preview" id="replyPreview"><i class="fas fa-quote-left"></i> Message preview</span>
                        </div>
                      </div>
                      <div id="dmChatMessages" class="dm-chat-messages"><div class="dm-empty-state">Pick a member to start a direct conversation.</div></div>
                      <div id="dmTypingContainer" class="typing-container" style="display:none;">
                        <div class="typing-indicator">
                          <span></span><span></span><span></span>
                          <span class="typing-text" id="dmTypingText">Someone is typing...</span>
                        </div>
                      </div>
                      <div class="dm-chat-input">
                        <div class="dm-composer-tools" id="dmComposerTools">
                          <button class="voice-btn" id="dmVoiceNoteBtn" title="Record voice note">🎤</button>
                        </div>
                        <div class="dm-input-wrap" id="dmChatInputWrap">
                          <input type="text" id="dmChatInput" placeholder="Message">
                        </div>
                        <button id="dmChatSendBtn">➤</button>
                        <div id="dmRecordingUi" class="recording-ui" style="display: none;">
                          <button id="dmCancelRecordBtn" class="cancel-record-btn" title="Cancel">🗑️</button>
                          <span id="dmRecordingTimer" class="recording-timer">🔴 0:00</span>
                          <button id="dmSendRecordBtn" class="send-record-btn" title="Send">➤</button>
                        </div>
                      </div>
                    </div>
                  </div>
                `;

                    // ── conversation clicks ──
                    document.querySelectorAll('.dm-conversation-item').forEach(item => {
                        item.addEventListener('click', async () => {
                            clearReplyTo();
                            const userId = item.dataset.userId;
                            const userName = item.dataset.userName;
                            const userRole = item.dataset.userRole;
                            await openPrivateChat(userId, { full_name: userName, job_role: userRole });
                            document.querySelectorAll('.dm-conversation-item').forEach(i => i.classList.remove(
                                'active'));
                            item.classList.add('active');
                            const badge = item.querySelector('.dm-unread-badge');
                            if (badge) {
                                badge.remove();
                                delete dmUnreadBySender[userId];
                                updateDMBadge();
                                if (!item.querySelector('.dm-conv-seen')) {
                                    item.insertAdjacentHTML('beforeend',
                                        '<span class="dm-conv-seen"><i class="fas fa-check-double"></i></span>');
                                }
                                try {
                                    await supabase
                                        .from('private_messages')
                                        .update({ read_at: new Date().toISOString() })
                                        .eq('sender_id', userId)
                                        .eq('recipient_id', currentUser.id)
                                        .is('read_at', null);
                                } catch (err) { console.error('Error marking as read on click', err); }
                            }
                            if (window.innerWidth <= 768) {
                                setDmMobileChatOpen(true);
                            }
                        });
                    });

                    document.getElementById('dmBackBtn').addEventListener('click', () => {
                        setDmMobileChatOpen(false);
                        currentRecipientId = null;
                        clearReplyTo();
                    });

                    // ── reply bar close ──
                    document.getElementById('replyCloseBtn').addEventListener('click', clearReplyTo);

                    // ── mobile nav ──
                    const mobileNavToggle = document.getElementById('mobileNavToggle');
                    const mobileNavOverlay = document.getElementById('mobileNavOverlay');
                    const mobileNavClose = document.getElementById('mobileNavClose');
                    const mobileLogout = document.getElementById('mobileLogout');
                    if (mobileNavToggle && mobileNavOverlay) {
                        mobileNavToggle.addEventListener('click', () => {
                            mobileNavOverlay.style.display = 'flex';
                            mobileNavOverlay.setAttribute('aria-hidden', 'false');
                        });
                    }
                    const mobileNavToggleList = document.getElementById('mobileNavToggleList');
                    if (mobileNavToggleList && mobileNavOverlay) {
                        mobileNavToggleList.addEventListener('click', () => {
                            mobileNavOverlay.style.display = 'flex';
                            mobileNavOverlay.setAttribute('aria-hidden', 'false');
                        });
                    }
                    if (mobileNavClose && mobileNavOverlay) {
                        mobileNavClose.addEventListener('click', () => {
                            mobileNavOverlay.style.display = 'none';
                            mobileNavOverlay.setAttribute('aria-hidden', 'true');
                        });
                    }
                    if (mobileNavOverlay) {
                        mobileNavOverlay.addEventListener('click', event => {
                            if (event.target === mobileNavOverlay) {
                                mobileNavOverlay.style.display = 'none';
                                mobileNavOverlay.setAttribute('aria-hidden', 'true');
                            }
                        });
                    }
                    if (mobileLogout) {
                        mobileLogout.addEventListener('click', () => {
                            document.getElementById('logout').click();
                        });
                    }

                    // ── call buttons ──
                    document.getElementById('dmHeaderVoiceCallBtn').addEventListener('click', () => {
                        if (!currentRecipientId) return;
                        const activeItem = document.querySelector('.dm-conversation-item.active');
                        const userName = activeItem ? activeItem.dataset.userName : 'User';
                        startDMCall(currentRecipientId, userName, 'voice');
                    });
                    document.getElementById('dmHeaderVideoCallBtn').addEventListener('click', () => {
                        if (!currentRecipientId) return;
                        const activeItem = document.querySelector('.dm-conversation-item.active');
                        const userName = activeItem ? activeItem.dataset.userName : 'User';
                        startDMCall(currentRecipientId, userName, 'video');
                    });

                    // ── voice recording ──
                    const dmVoiceBtn = document.getElementById('dmVoiceNoteBtn');
                    const dmRecordingTimer = document.getElementById('dmRecordingTimer');
                    const dmRecordingUi = document.getElementById('dmRecordingUi');
                    const dmChatInputWrap = document.getElementById('dmChatInputWrap');
                    const dmChatSendBtn = document.getElementById('dmChatSendBtn');
                    const dmCancelRecordBtn = document.getElementById('dmCancelRecordBtn');
                    const dmSendRecordBtn = document.getElementById('dmSendRecordBtn');
                    const dmComposerTools = document.getElementById('dmComposerTools');

                    let dmCancelVoiceNote = false;

                    dmVoiceBtn.addEventListener('click', dmStartRecording);
                    dmCancelRecordBtn.addEventListener('click', dmCancelRecording);
                    dmSendRecordBtn.addEventListener('click', dmStopRecording);

                    async function dmStartRecording() {
                        if (dmIsRecording) return;
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            dmMediaRecorder = new MediaRecorder(stream);
                            dmAudioChunks = [];
                            dmCancelVoiceNote = false;

                            dmMediaRecorder.ondataavailable = event => { dmAudioChunks.push(event.data); };
                            dmMediaRecorder.onstop = async () => {
                                stream.getTracks().forEach(track => track.stop());
                                if (dmCancelVoiceNote) return;
                                if (!currentRecipientId) {
                                    alert('No chat selected. Please open a conversation first.');
                                    return;
                                }
                                const audioBlob = new Blob(dmAudioChunks, { type: 'audio/webm' });
                                await sendPrivateVoiceNote(audioBlob, currentRecipientId);
                            };

                            dmMediaRecorder.start();
                            dmIsRecording = true;
                            dmRecordingStartTime = Date.now();

                            // Show recording UI, hide input
                            dmComposerTools.style.display = 'none';
                            dmChatInputWrap.style.display = 'none';
                            dmChatSendBtn.style.display = 'none';
                            dmRecordingUi.style.display = 'flex';

                            dmRecordingTimerInterval = setInterval(() => {
                                if (!dmIsRecording) return;
                                const elapsed = Math.floor((Date.now() - dmRecordingStartTime) / 1000);
                                const minutes = Math.floor(elapsed / 60);
                                const seconds = elapsed % 60;
                                dmRecordingTimer.textContent = `🔴 ${minutes}:${seconds.toString().padStart(2, '0')}`;
                            }, 1000);
                        } catch (err) {
                            console.error('DM mic error:', err);
                            alert('Could not access microphone.');
                        }
                    }

                    function dmCancelRecording() {
                        if (dmMediaRecorder && dmIsRecording) {
                            dmCancelVoiceNote = true;
                            dmStopRecording();
                        }
                    }

                    function dmStopRecording() {
                        if (dmMediaRecorder && dmIsRecording) {
                            dmMediaRecorder.stop();
                            dmIsRecording = false;

                            // Hide recording UI, restore input
                            dmComposerTools.style.display = 'flex';
                            dmChatInputWrap.style.display = 'block';
                            dmChatSendBtn.style.display = 'inline-flex';
                            dmRecordingUi.style.display = 'none';

                            if (dmRecordingTimerInterval) {
                                clearInterval(dmRecordingTimerInterval);
                                dmRecordingTimerInterval = null;
                            }
                        }
                    }

                    // ── auto-open from URL ──
                    const urlParams = new URLSearchParams(window.location.search);
                    const targetUserId = urlParams.get('user');
                    if (targetUserId) {
                        const targetItem = document.querySelector(
                            `.dm-conversation-item[data-user-id="${targetUserId}"]`);
                        if (targetItem) targetItem.click();
                    }
                } catch (err) {
                    console.error('Load DM view error:', err);
                    document.getElementById('messagesArea').innerHTML =
                        '<div style="color:#ff628c;text-align:center;padding:2rem;">Failed to load direct messages.</div>';
                }
            }

            // ─── TYPING INDICATOR ───
            function updateDmTypingIndicator() {
                const container = document.getElementById('dmTypingContainer');
                const textEl = document.getElementById('dmTypingText');
                if (!container || !textEl) return;
                if (dmActiveTypers.size === 0) { container.style.display = 'none'; return; }
                const names = Array.from(dmActiveTypers);
                let text = '';
                if (names.length === 1) text = `${names[0]} is typing...`;
                else if (names.length === 2) text = `${names[0]} and ${names[1]} are typing...`;
                else text = `${names.length} people are typing...`;
                textEl.textContent = text;
                container.style.display = 'block';
            }

            // ─── OPEN PRIVATE CHAT ───
            async function openPrivateChat(otherUserId, otherProfile) {
                currentRecipientId = otherUserId;
                if (dmTypingSubscription) dmTypingSubscription.unsubscribe();
                dmActiveTypers.clear();
                clearReplyTo();

                const chatArea = document.getElementById('dmChatArea');
                const headerTitle = document.querySelector('.dm-chat-title');
                const headerSubtitle = document.querySelector('.dm-chat-subtitle');
                const peerAvatar = document.getElementById('dmPeerAvatar');
                const messagesDiv = document.getElementById('dmChatMessages');
                const input = document.getElementById('dmChatInput');
                const sendBtn = document.getElementById('dmChatSendBtn');
                const voiceCallBtn = document.getElementById('dmHeaderVoiceCallBtn');
                const videoCallBtn = document.getElementById('dmHeaderVideoCallBtn');

                if (!chatArea || !headerTitle || !headerSubtitle || !peerAvatar || !messagesDiv || !input || !sendBtn) {
                    console.error('DM chat DOM elements missing');
                    return;
                }

                const safeName = otherProfile.full_name || 'Unknown';
                const safeRole = otherProfile.job_role || 'Member';
                headerTitle.textContent = safeName;
                headerSubtitle.textContent = `${safeRole} • ${onlineUsers.has(otherUserId) ? 'online' : 'offline'}`;

                if (otherProfile.avatar_url) {
                    peerAvatar.innerHTML =
                        `<img src="${escapeHtml(otherProfile.avatar_url)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                    peerAvatar.style.display = 'flex';
                    peerAvatar.style.backgroundColor = 'transparent';
                } else {
                    peerAvatar.style.display = 'none';
                }

                voiceCallBtn.disabled = false;
                videoCallBtn.disabled = false;
                chatArea.style.display = 'flex';
                if (window.innerWidth > 768) {
                    input.focus();
                }
                messagesDiv.innerHTML = '<div class="dm-empty-state">Loading conversation...</div>';

                try {
                    let { data, error } = await supabase
                        .from('private_messages')
                        .select(`*, sender:profiles!sender_id (id, full_name, job_role, avatar_url)`)
                        .or(
                            `and(sender_id.eq.${currentUser.id},recipient_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},recipient_id.eq.${currentUser.id})`
                        )
                        .order('created_at', { ascending: true });

                    if (error && error.message && error.message.includes('Could not find a relationship')) {
                        console.warn('Join failed, falling back to selected profile data:', error.message);
                        const { data: msgs, error: msgsError } = await supabase
                            .from('private_messages')
                            .select('*')
                            .or(
                                `and(sender_id.eq.${currentUser.id},recipient_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},recipient_id.eq.${currentUser.id})`
                            )
                            .order('created_at', { ascending: true });
                        if (msgsError) throw msgsError;
                        data = (msgs || []).map((msg) => ({
                            ...msg,
                            sender: msg.sender_id === currentUser.id ?
                                { id: currentUser.id, full_name: currentUserFullName, job_role: currentRole,
                                    avatar_url: null } :
                                {
                                    id: otherUserId,
                                    full_name: safeName,
                                    job_role: safeRole,
                                    avatar_url: otherProfile
                                    .avatar_url || null
                                }
                        }));
                    } else if (error) { throw error; }

                    let html = '';
                    let lastDate = null;
                    for (const msg of data || []) {
                        const dateHeader = maybeAppendDateSeparator(lastDate, msg.created_at);
                        if (dateHeader) html += dateHeader;
                        lastDate = msg.created_at;
                        html += renderMessageBubble(msg, {
                            isSent: msg.sender_id === currentUser.id,
                            sender: msg.sender || {
                                id: otherUserId,
                                full_name: safeName,
                                job_role: safeRole,
                                avatar_url: otherProfile.avatar_url || null
                            }
                        });
                    }
                    messagesDiv.innerHTML = html ||
                        '<div class="dm-empty-state">No messages yet. Send the first one.</div>';
                    attachMessageInteractions(messagesDiv);
                    setupDmObserver();

                    sendBtn.onclick = () => sendPrivateMessage(otherUserId);
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            sendPrivateMessage(otherUserId);
                        }
                    };

                    const typingChannel =
                        `typing-dm-${Math.min(currentUser.id, otherUserId)}-${Math.max(currentUser.id, otherUserId)}`;
                    dmTypingSubscription = supabase
                        .channel(typingChannel)
                        .on('broadcast', { event: 'typing' }, (payload) => {
                            const { userId, userName } = payload.payload;
                            if (userId === currentUser.id) return;
                            if (dmTypingTimeouts[userId]) clearTimeout(dmTypingTimeouts[userId]);
                            dmActiveTypers.add(userName);
                            updateDmTypingIndicator();
                            dmTypingTimeouts[userId] = setTimeout(() => {
                                dmActiveTypers.delete(userName);
                                updateDmTypingIndicator();
                                delete dmTypingTimeouts[userId];
                            }, 3000);
                        })
                        .subscribe();

                    let dmTypingTimeout;
                    input.oninput = () => {
                        if (dmTypingTimeout) clearTimeout(dmTypingTimeout);
                        supabase.channel(typingChannel).send({
                            type: 'broadcast',
                            event: 'typing',
                            payload: {
                                userId: currentUser.id,
                                userName: currentUserFullName,
                                timestamp: Date.now()
                            }
                        });
                        dmTypingTimeout = setTimeout(() => {}, 2000);
                    };

                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    input.value = '';
                } catch (err) {
                    console.error('Load private chat error:', err);
                    messagesDiv.innerHTML = '<div style="color:#ff628c;padding:1rem;">Failed to load messages.</div>';
                }
            }

            // ─── SEND PRIVATE MESSAGE ───
            async function sendPrivateMessage(otherUserId) {
                const input = document.getElementById('dmChatInput');
                let content = input.value.trim();
                if (!content) return;
                input.value = '';

                // If replying, prepend a quote in WhatsApp style
                if (replyToMessage) {
                    // Format: > Replying to [sender]: [preview]\n\n[reply]
                    const quoted = `> Replying to ${replyToMessage.senderName}: ${replyToMessage.preview}\n\n`;
                    content = quoted + content;
                }

                try {
                    const payload = { sender_id: currentUser.id, recipient_id: otherUserId, content: content };
                    const { data, error } = await supabase
                        .from('private_messages')
                        .insert(payload)
                        .select()
                        .single();
                    if (error) throw error;
                    const messagesDiv = document.getElementById('dmChatMessages');
                    data.sender = { id: currentUser.id, full_name: currentUserFullName, job_role: currentRole,
                        avatar_url: null };
                    appendRenderedMessage(messagesDiv, data, { isSent: true });
                    clearReplyTo();
                } catch (err) {
                    console.error('Send private message error:', err);
                    alert('Failed to send: ' + err.message);
                }
            }

            // ─── SEND PRIVATE VOICE NOTE ───
            async function sendPrivateVoiceNote(audioBlob, otherUserId) {
                if (!otherUserId) { alert('Recipient not specified.'); return; }
                const fileName = `${currentUser.id}/${Date.now()}.webm`;
                const { error: uploadError } = await supabase.storage
                    .from('voice_notes')
                    .upload(fileName, audioBlob, { contentType: 'audio/webm' });
                if (uploadError) {
                    console.error('Upload error:', uploadError);
                    alert('Failed to upload voice note: ' + uploadError.message);
                    return;
                }

                const { data: urlData } = supabase.storage.from('voice_notes').getPublicUrl(fileName);
                const audioUrl = urlData.publicUrl;

                // For voice notes, we don't support quoting (just send as is)
                try {
                    const payload = {
                        sender_id: currentUser.id,
                        recipient_id: otherUserId,
                        content: '',
                        audio_url: audioUrl
                    };
                    const { data, error } = await supabase
                        .from('private_messages')
                        .insert(payload)
                        .select()
                        .single();
                    if (error) throw error;
                    const messagesDiv = document.getElementById('dmChatMessages');
                    data.sender = { id: currentUser.id, full_name: currentUserFullName, job_role: currentRole,
                        avatar_url: null };
                    appendRenderedMessage(messagesDiv, data, { isSent: true });
                    clearReplyTo();
                } catch (err) {
                    console.error('Insert private voice note error:', err);
                    alert('Failed to send voice note: ' + err.message);
                }
            }

            // ─── DELETE PRIVATE MESSAGE ───
            async function deletePrivateMessage(messageId) {
                try {
                    let query = supabase.from('private_messages').delete().eq('id', messageId);
                    if (!isCEO) query = query.eq('sender_id', currentUser.id);
                    const { error } = await query;
                    if (error) throw error;
                    removePrivateMessageFromUI(messageId);
                } catch (err) {
                    console.error('Delete DM error:', err);
                    alert('Failed to delete message: ' + err.message);
                }
            }

            function removePrivateMessageFromUI(messageId) {
                const msgRow = document.querySelector(`.dm-msg-row[data-message-id="${messageId}"]`);
                if (!msgRow) return;
                if (msgRow.classList.contains('received') && msgRow.classList.contains('unread')) {
                    const senderId = msgRow.dataset.senderId;
                    if (senderId && dmUnreadBySender[senderId] > 0) {
                        dmUnreadBySender[senderId]--;
                        if (dmUnreadBySender[senderId] === 0) delete dmUnreadBySender[senderId];
                    }
                    updateDMBadge();
                    const targetItem = document.querySelector(`.dm-conversation-item[data-user-id="${senderId}"]`);
                    if (targetItem) {
                        const badge = targetItem.querySelector('.dm-unread-badge');
                        const newCount = dmUnreadBySender[senderId] || 0;
                        if (newCount > 0) badge.textContent = newCount;
                        else if (badge) badge.remove();
                    }
                }
                if (dmObserver) dmObserver.unobserve(msgRow);
                msgRow.remove();
                const messagesDiv = document.getElementById('dmChatMessages');
                if (messagesDiv && messagesDiv.children.length === 0) {
                    messagesDiv.innerHTML =
                        '<div style="color:#9aa4bf;text-align:center;padding:2rem;">No messages yet. Say hello!</div>';
                }
            }

            // ─── RIGHT-CLICK READ RECEIPTS ───
            async function onRightClick(e) {
                e.preventDefault();
                const row = e.currentTarget;
                const messageId = row.dataset.messageId;
                modal.style.display = 'none';

                const { data: msg, error } = await supabase
                    .from('private_messages')
                    .select(
                        'sender_id, recipient_id, read_at, profiles!sender_id(full_name), profiles!recipient_id(full_name)'
                        )
                    .eq('id', messageId)
                    .single();
                if (error || !msg) { console.error('fetch DM readers error:', error); return; }

                const readerName = (msg.sender_id === currentUser.id) ? msg.profiles_recipient_id?.full_name : msg
                    .profiles_sender_id?.full_name;
                const readTime = msg.read_at ? new Date(msg.read_at).toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : null;
                if (msg.read_at) {
                    modal.innerHTML =
                        `<h4>Read receipt</h4><p style="padding:0.5rem 0;">Seen by ${escapeHtml(readerName)} at ${readTime}</p>`;
                } else {
                    modal.innerHTML = '<h4>Read receipt</h4><p style="padding:0.5rem 0;">Not seen yet.</p>';
                }
                modal.style.left = e.pageX + 10 + 'px';
                modal.style.top = e.pageY + 10 + 'px';
                modal.style.display = 'block';
                const hideModal = (ev) => {
                    if (!modal.contains(ev.target)) {
                        modal.style.display = 'none';
                        document.removeEventListener('click', hideModal);
                    }
                };
                setTimeout(() => document.addEventListener('click', hideModal), 0);
            }
