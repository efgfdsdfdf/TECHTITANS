<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/titans_logo2.png">
    <title>TECH TITANS - Direct Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html,
        body {
            background: #0b0f17;
            display: flex;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        body.sidebar-collapsed .sidebar {
            transform: translateX(-100%);
            width: 0;
            padding: 0;
            overflow: hidden;
            border-right: none;
        }

        body.iframe-mode .sidebar,
        body.iframe-mode .main,
        body.iframe-mode .gn-toast {
            display: none !important;
        }

        body.iframe-mode {
            background: transparent !important;
        }

        body.sidebar-collapsed .main {
            padding-left: 0;
        }

        .sidebar {
            width: 260px;
            background: rgba(10, 16, 28, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid #1f2a44;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex-shrink: 0;
            transition: transform 0.25s ease, width 0.25s ease, padding 0.25s ease;
            overflow: hidden;
        }

        .logo {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            padding-left: 1rem;
            white-space: nowrap;
        }

        .logo span {
            color: #428cff;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav a {
            color: #9aa4bf;
            text-decoration: none;
            padding: 0.9rem 1rem;
            border-radius: 1.2rem;
            transition: 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            position: relative;
            white-space: nowrap;
        }

        .nav a:hover,
        .nav a.active {
            background: #1f2a44;
            color: #fff;
        }

        .nav a.active {
            background: #428cff;
            color: #fff;
            box-shadow: 0 8px 16px -8px #428cff;
        }

        .sidebar-unread {
            background: #ff4d4d;
            color: #fff;
            border-radius: 2rem;
            padding: 0.15rem 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: auto;
            line-height: 1.3;
            box-shadow: 0 0 0 1px #0b0f17;
        }

        .logout-btn {
            margin-top: auto;
            background: transparent;
            border: 1px solid #2f3a5a;
            color: #ff9f9f;
            padding: 0.9rem;
            border-radius: 1.2rem;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .logout-btn:hover {
            background: #ff4d4d20;
            border-color: #ff4d4d;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            min-width: 0;
            height: 100%;
            overflow: hidden;
            transition: padding 0.25s ease;
        }

        .chat-panel {
            flex: 1;
            background: #131c30;
            border-radius: 2rem;
            border: 1px solid #263154;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            min-height: 0;
        }

        .chat-header {
            padding: 1.2rem 1.8rem;
            border-bottom: 1px solid #263154;
            color: #fff;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            flex-shrink: 0;
            background: #131c30;
            z-index: 5;
        }

        .chat-header .hamburger-toggle {
            background: none;
            border: none;
            color: #9aa4bf;
            font-size: 1.4rem;
            cursor: pointer;
            display: none;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            transition: 0.2s;
        }

        .chat-header .hamburger-toggle:hover {
            background: #1f2a44;
            color: #fff;
        }

        .messages-area {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
        }

        .dm-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            gap: 0;
        }

        .dm-conversations-list {
            width: min(360px, 34vw);
            border-right: 1px solid #263154;
            overflow-y: auto;
            min-height: 0;
            background: #0d1426;
            flex-shrink: 0;
        }

        .dm-list-header {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 1rem;
            font-weight: 600;
            color: #d7def5;
            border-bottom: 1px solid #263154;
            font-size: 0.9rem;
            background: #0d1426;
        }

        .dm-list-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .dm-list-hamburger {
            display: none;
        }

        @media (max-width: 768px) {
            .dm-list-hamburger {
                display: inline-flex;
                width: 2.4rem;
                height: 2.4rem;
                font-size: 1.1rem;
                padding: 0;
            }
        }

        .dm-conversation-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #1f2a44;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .dm-conversation-item:hover {
            background: #18233b;
        }

        .dm-conversation-item.active {
            background: #203257;
            border-left: 3px solid #428cff;
        }

        .dm-conv-avatar-wrap {
            position: relative;
            flex-shrink: 0;
            width: 42px;
            height: 42px;
        }

        .dm-conv-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2a44;
        }

        .dm-conv-avatar-initials {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .dm-conv-avatar-wrap .status-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 0.6rem;
            height: 0.6rem;
            border: 2px solid #0d1426;
        }

        .dm-conv-content {
            flex: 1;
            min-width: 0;
        }

        .dm-conv-top-row {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
        }

        .dm-conv-name {
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .dm-conv-time {
            color: #6b7fb1;
            font-size: 0.68rem;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .dm-conv-preview {
            color: #6b7fb1;
            font-size: 0.78rem;
            margin-top: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dm-conv-role {
            color: #9aa4bf;
            font-size: 0.75rem;
            margin-top: 0.2rem;
        }

        .status-dot {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            background: #444;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #2ecc71;
        }

        .dm-unread-badge {
            background: #428cff;
            color: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
            margin-left: auto;
        }

        .dm-chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background:
                radial-gradient(circle at 18px 18px, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 36px 36px,
                linear-gradient(180deg, #111a2c 0%, #0d1525 100%);
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .dm-chat-header {
            min-height: 72px;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid #263154;
            color: #fff;
            font-weight: 500;
            background: rgba(17, 26, 44, 0.94);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-shrink: 0;
        }

        .dm-chat-header .dm-back-btn {
            display: none;
        }

        .dm-chat-peer {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            min-width: 0;
        }

        .dm-peer-copy {
            min-width: 0;
        }

        .dm-chat-title {
            display: block;
            color: #f8fbff;
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dm-chat-subtitle {
            display: block;
            color: #91a0c7;
            font-size: 0.78rem;
            margin-top: 0.15rem;
        }

        .dm-chat-actions {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .dm-icon-btn {
            min-width: 2.55rem;
            height: 2.55rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            background: #18233b;
            color: #eaf0ff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .dm-chat-actions .dm-icon-btn {
            width: auto;
            min-width: 4rem;
            padding: 0 0.8rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .dm-icon-btn:hover {
            background: #203257;
            transform: translateY(-1px);
        }

        .dm-icon-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .dm-chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            scroll-behavior: smooth;
            touch-action: pan-y;
        }

        .dm-chat-input {
            display: flex;
            padding: 0.85rem 1rem;
            padding-bottom: calc(max(env(safe-area-inset-bottom), 1.2rem));
            background: rgba(17, 26, 44, 0.96);
            backdrop-filter: blur(14px);
            border-top: 1px solid #263154;
            gap: 0.5rem;
            align-items: center;
            flex-shrink: 0;
            z-index: 50;
        }

        .dm-composer-tools {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .dm-input-wrap {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        #dmChatInput {
            width: 100%;
            background: #0b1221;
            border: 1px solid #263154;
            border-radius: 999px;
            padding: 0.8rem 1.2rem;
            color: #fff;
            outline: none;
            min-width: 0;
        }

        #dmChatInput:focus {
            border-color: #428cff;
        }

        #dmChatSendBtn {
            background: #428cff;
            border: none;
            color: #fff;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .voice-btn {
            background: #2f3a5a;
            border: none;
            color: #fff;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .recording-ui {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b1221;
            border-radius: 999px;
            padding: 0.4rem 1rem;
            animation: fadeIn 0.2s ease;
        }

        .recording-ui .recording-timer {
            color: #ff4d4d;
            font-weight: 500;
            animation: pulse 1.5s infinite;
        }

        .recording-ui button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .recording-ui .cancel-record-btn {
            color: #ff6b6b;
        }
        .recording-ui .cancel-record-btn:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .recording-ui .send-record-btn {
            color: #428cff;
            background: rgba(66, 140, 255, 0.1);
        }
        .recording-ui .send-record-btn:hover {
            background: rgba(66, 140, 255, 0.2);
        }

        .dm-msg-row {
            display: flex;
            margin-bottom: 0.5rem;
            cursor: pointer;
            align-items: flex-end;
            gap: 0.5rem;
            transition: transform 0.15s ease;
            position: relative;
            touch-action: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        .dm-msg-row.sent {
            justify-content: flex-end;
        }

        .dm-msg-row.unread .dm-msg {
            border-left: 4px solid #428cff;
        }

        .dm-msg-row .swipe-reply-indicator {
            position: absolute;
            left: -60px;
            top: 50%;
            transform: translateY(-50%);
            background: #2ecc71;
            color: #fff;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .dm-msg-row.show-reply-indicator .swipe-reply-indicator {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .dm-msg-row .swipe-reply-bg {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
            background: rgba(46, 204, 113, 0.15);
            border-radius: 1rem;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .dm-msg-row.show-reply-indicator .swipe-reply-bg {
            opacity: 1;
        }

        /* Reply bar above input */
        .dm-reply-bar {
            display: none;
            padding: 0.6rem 1rem;
            background: rgba(17, 26, 44, 0.98);
            border-top: 1px solid #263154;
            border-bottom: 1px solid #263154;
            align-items: center;
            gap: 0.8rem;
            flex-shrink: 0;
            font-size: 0.85rem;
            color: #e0e7ff;
            position: relative;
        }

        .dm-reply-bar.visible {
            display: flex;
        }

        .dm-reply-bar .reply-close {
            background: none;
            border: none;
            color: #9aa4bf;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            flex-shrink: 0;
        }

        .dm-reply-bar .reply-close:hover {
            color: #fff;
        }

        .dm-reply-bar .reply-line {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .dm-reply-bar .reply-sender {
            font-weight: 600;
            color: #2ecc71;
            font-size: 0.78rem;
        }

        .dm-reply-bar .reply-preview {
            color: #9aa4bf;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dm-reply-bar .reply-preview i {
            margin-right: 0.3rem;
            color: #6b7fb1;
        }

        .dm-msg {
            max-width: min(68%, 720px);
            padding: 0.72rem 0.82rem 0.42rem;
            border-radius: 1rem;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
            transition: transform 0.15s ease;
            transform: translateX(0);
            touch-action: auto;
        }

        /* Quote block inside message (WhatsApp style) */
        .dm-msg .reply-quote {
            background: rgba(255, 255, 255, 0.06);
            border-left: 3px solid #2ecc71;
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.82rem;
            color: #b0c8ff;
        }

        .dm-msg .reply-quote .quote-sender {
            font-weight: 600;
            color: #2ecc71;
            font-size: 0.75rem;
            display: block;
            margin-bottom: 0.1rem;
        }

        .dm-msg .reply-quote .quote-text {
            word-break: break-word;
            white-space: pre-wrap;
        }

        .dm-msg-text {
            white-space: pre-wrap;
        }

        .dm-msg-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.35rem;
            margin-top: 0.32rem;
            font-size: 0.68rem;
            line-height: 1;
            opacity: 0.76;
        }

        .dm-msg-status {
            color: #bde7ff;
            font-weight: 800;
            letter-spacing: 0;
        }

        .dm-msg.sent {
            background: linear-gradient(135deg, #2979ff, #1f9f7a);
            color: #fff;
            border-bottom-right-radius: 0.25rem;
        }

        .dm-msg.sent .reply-quote {
            background: rgba(255, 255, 255, 0.12);
            border-left-color: #aaffaa;
        }

        .dm-msg.sent .reply-quote .quote-sender {
            color: #aaffaa;
        }

        .dm-msg.sent .reply-quote .quote-text {
            color: #d0e8ff;
        }

        .dm-msg.received {
            background: #202b43;
            color: #e0e7ff;
            border-bottom-left-radius: 0.25rem;
        }

        .dm-msg.received .reply-quote {
            background: rgba(255, 255, 255, 0.04);
            border-left-color: #2ecc71;
        }

        .dm-seen-indicator {
            font-size: 0.68rem;
            color: #8fa0c5;
            margin-top: 0.25rem;
            text-align: right;
        }

        .dm-date-separator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0.3rem 0;
        }

        .dm-date-separator span {
            background: #1f2a44;
            color: #9aa4bf;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border: 1px solid #2f3a5a;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .dm-voice-note {
            display: grid;
            grid-template-columns: auto minmax(130px, 1fr) auto;
            align-items: center;
            gap: 0.65rem;
            min-width: min(300px, 62vw);
        }

        .dm-audio-btn {
            min-width: 3.2rem;
            padding: 0 0.6rem;
            height: 2.35rem;
            border: none;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .dm-wave {
            height: 1.8rem;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .dm-wave span {
            width: 3px;
            height: var(--h);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.48);
        }

        .dm-audio-duration {
            font-size: 0.76rem;
            opacity: 0.82;
            min-width: 2.6rem;
            text-align: right;
        }

        .dm-audio-progress {
            grid-column: 2 / 4;
            height: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        .dm-audio-progress span {
            display: block;
            width: 0%;
            height: 100%;
            background: #fff;
        }

        .dm-msg.received .dm-audio-btn {
            background: rgba(66, 140, 255, 0.22);
        }

        .dm-msg.received .dm-wave span {
            background: rgba(190, 210, 255, 0.58);
        }

        .dm-empty-state {
            margin: auto;
            max-width: 360px;
            color: #9aa4bf;
            text-align: center;
            padding: 2rem;
            line-height: 1.5;
        }

        .dm-delete-btn {
            position: absolute;
            top: 0.35rem;
            right: 0.4rem;
            border: 0;
            background: rgba(0, 0, 0, 0.18);
            color: inherit;
            border-radius: 999px;
            padding: 0.2rem 0.45rem;
            font-size: 0.66rem;
            opacity: 0;
            cursor: pointer;
        }

        .dm-msg:hover .dm-delete-btn {
            opacity: 0.85;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #428cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #fff;
            text-transform: uppercase;
            flex-shrink: 0;

        .typing-indicator span {
            width: 0.5rem;
            height: 0.5rem;
            background: #9aa4bf;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-0.5rem);
            }

            color: #9aa4bf;

            100% {
                transform: scale(1);

            .dm-reply-bar {

            // ─── HELPERS ───
            function formatDateHeader(date) {
                const now = new Date();
                const msgDate = new Date(date);
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                const msgDay = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
                if (msgDay.getTime() === today.getTime()) return 'Today';
                else if (msgDay.getTime() === yesterday.getTime()) return 'Yesterday';
                else return msgDate.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            function formatTimeOnly(date) {
                return new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function formatAudioTime(seconds) {
                if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
                const rounded = Math.floor(seconds);
                const minutes = Math.floor(rounded / 60);
                const secs = rounded % 60;
                return `${minutes}:${secs.toString().padStart(2, '0')}`;
            }

            function getInitials(name) {
                if (!name) return '?';
                const parts = name.trim().split(/\s+/);
                if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
                return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
            }

            function escapeHtml(unsafe) {
                if (unsafe === null || unsafe === undefined) return '';
                return String(unsafe).replace(/[&<>"']/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    if (m === "'") return '&#039;';
                    return m;
                });
            }

            function renderVoiceNote(audioUrl, messageId) {
                const bars = [12, 20, 15, 26, 18, 30, 14, 24, 17, 28, 13, 22, 16, 25]
                    .map(h => `<span style="--h:${h}px"></span>`)
                    .join('');
                return `
                <div class="dm-voice-note" data-audio-url="${escapeHtml(audioUrl)}" data-message-id="${escapeHtml(messageId)}">
                  <button type="button" class="dm-audio-btn" aria-label="Play voice note">Play</button>
                  <div class="dm-wave">${bars}</div>
                  <span class="dm-audio-duration">0:00</span>
                  <div class="dm-audio-progress"><span></span></div>
                </div>
              `;
            }

            // Parse reply quote from content: if content starts with "> Replying to [sender]:\n" then extract quote and rest
            function parseReplyQuote(content) {
                const lines = content.split('\n');
                const firstLine = lines[0] || '';
                const match = firstLine.match(/^> Replying to (.*?):/);
                if (match) {
                    // The quote is the first line after the "> Replying to ..." line, until an empty line or end
                    // But we have a specific format: we added two newlines after the quote.
                    // Actually we prepend: `> Replying to ${senderName}: ${preview}\n\n`
                    // So the quote is the first line, then an empty line, then the reply.
                    // We'll treat the quote as the first line (without the "> Replying to" prefix)
                    const quoteLine = firstLine.replace(/^> Replying to .*?: /, '').trim();
                    const rest = lines.slice(1).filter(l => l.trim() !== '').join('\n');
                    return { quote: quoteLine, reply: rest, sender: match[1] };
                }
                return null;
            }

            function renderMessageBubble(msg, options = {}) {
                const isSent = options.isSent ?? msg.sender_id === currentUser.id;
                const sender = msg.sender || options.sender || {};
                const senderName = sender.full_name || options.senderName || 'Unknown';
                const isUnread = !isSent && !msg.read_at;
                const timeStr = formatTimeOnly(msg.created_at || new Date());
                let contentHtml = '';
                let replyQuoteHtml = '';

                // Check if message is a reply (starts with "> Replying to")
                const parsed = parseReplyQuote(msg.content || '');
                if (parsed) {
                    // It's a reply: show quote block
                    replyQuoteHtml = `
                    <div class="reply-quote">
                      <span class="quote-sender">Replying to ${escapeHtml(parsed.sender)}</span>
                      <span class="quote-text">${escapeHtml(parsed.quote)}</span>

                    contentHtml = `<div class="dm-msg-text">${escapeHtml(parsed.reply)}</div>`;
                } else {

                        `<div class="dm-msg-text">${escapeHtml(msg.content)}</div>`;

                    '';
                const seenHtml = isSent && msg.read_at ?

            // ─── SWIPE TO REPLY (works on both mobile & desktop) ───
            function setupSwipeToReply(row) {
                let startX = 0;
                let startY = 0;
                let isSwiping = false;
                let currentX = 0;
                let isHorizontal = false;
                let pointerId = null;

                function onPointerDown(e) {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    const pointer = e;
                    startX = pointer.clientX;
                    startY = pointer.clientY;
                    isSwiping = false;
                    currentX = 0;
                    isHorizontal = false;
                    pointerId = pointer.pointerId;
                    row.setPointerCapture(pointerId);
                    row.addEventListener('pointermove', onPointerMove);
                    row.addEventListener('pointerup', onPointerUp);
                    row.addEventListener('pointercancel', onPointerUp);
                }

                function onPointerMove(e) {
                    const pointer = e;
                    const deltaX = pointer.clientX - startX;
                    const deltaY = pointer.clientY - startY;

                    if (!isSwiping && Math.abs(deltaX) > 10) {
                        isSwiping = true;
                        isHorizontal = Math.abs(deltaX) > Math.abs(deltaY);
                    }

                    if (isSwiping && isHorizontal && deltaX > 0) {
                        e.preventDefault();
                        currentX = Math.min(deltaX, 80);
                        const msgEl = row.querySelector('.dm-msg');
                        if (msgEl) {
                            msgEl.style.transform = `translateX(${currentX}px)`;
                        }
                        if (currentX > 40) {
                            row.classList.add('show-reply-indicator');
                        } else {
                            row.classList.remove('show-reply-indicator');
                        }
                    }
                }

                function onPointerUp(e) {
                    const msgEl = row.querySelector('.dm-msg');
                    if (msgEl) {
                        msgEl.style.transform = '';
                    }
                    row.classList.remove('show-reply-indicator');

                    if (isSwiping && isHorizontal && currentX > 50) {
                        const msgId = row.dataset.messageId;
                        const senderName = row.dataset.senderName || 'Someone';
                        const msgTextEl = row.querySelector('.dm-msg-text');
                        let preview = msgTextEl ? msgTextEl.textContent.trim() : 'Message';
                        if (!preview) {
                            const voiceNote = row.querySelector('.dm-voice-note');
                            if (voiceNote) preview = '🎤 Voice note';
                        }
                        if (preview.length > 60) preview = preview.substring(0, 60) + '...';
                        setReplyTo(msgId, senderName, preview);
                        const input = document.getElementById('dmChatInput');
                        if (input) {
                            setTimeout(() => input.focus(), 100);
                        }
                        showToast(`Replying to ${senderName}`);
                    }

                    isSwiping = false;
                    currentX = 0;
                    isHorizontal = false;
                    row.removeEventListener('pointermove', onPointerMove);
                    row.removeEventListener('pointerup', onPointerUp);
                    row.removeEventListener('pointercancel', onPointerUp);
                }

                row.addEventListener('pointerdown', onPointerDown);
            }

            function setReplyTo(messageId, senderName, preview) {

            function setupVoiceNoteControl(note) {
                if (note.dataset.ready === 'true') return;
                note.dataset.ready = 'true';
                const audio = new Audio(note.dataset.audioUrl);
                const button = note.querySelector('.dm-audio-btn');
                const duration = note.querySelector('.dm-audio-duration');
                const progress = note.querySelector('.dm-audio-progress span');

                audio.addEventListener('loadedmetadata', () => {
                    duration.textContent = formatAudioTime(audio.duration);
                });
                audio.addEventListener('timeupdate', () => {
                    const percent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
                    progress.style.width = `${percent}%`;
                    duration.textContent = formatAudioTime(audio.duration ? audio.duration - audio.currentTime :
                        audio.currentTime);
                });
                audio.addEventListener('ended', () => {
                    button.textContent = 'Play';
                    progress.style.width = '0%';
                    duration.textContent = formatAudioTime(audio.duration);
                });
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    document.querySelectorAll('.dm-voice-note').forEach(other => {
                        if (other !== note && other._audio) {
                            other._audio.pause();
                            other.querySelector('.dm-audio-btn').textContent = 'Play';
                        }
                    });
                    if (audio.paused) {
                        audio.play();
                        button.textContent = 'Pause';
                    } else {
                        audio.pause();
                        button.textContent = 'Play';
                    }
                });
                note._audio = audio;
            }

            // ─── PRESENCE ───
            async function setupPresence() {
                if (!currentUser) return;
                presenceChannel = supabase.channel('online-users', { config: { presence: { key: currentUser.id } } });
                presenceChannel
                    .on('presence', { event: 'sync' }, () => {
                        const state = presenceChannel.presenceState();
                        onlineUsers.clear();
                        Object.values(state).forEach(presences => {
                            presences.forEach(p => {
                                if (p.userId !== currentUser.id) onlineUsers.set(p.userId, {
                                    name: p.name,
                                    role: p.role
                                });
                            });
                        });
                        document.querySelectorAll('.dm-conversation-item').forEach(item => {
                            const uid = item.dataset.userId;
                            const dot = item.querySelector('.status-dot');
                            if (dot) {
                                if (onlineUsers.has(uid)) dot.classList.add('online');
                                else dot.classList.remove('online');
                            }
                        });
                    })
                    .on('presence', { event: 'join' }, ({ key, newPresences }) => {
                        newPresences.forEach(p => {
                            if (p.userId !== currentUser.id) onlineUsers.set(p.userId, {
                                name: p.name,
                                role: p.role
                            });
                        });
                        document.querySelectorAll('.dm-conversation-item').forEach(item => {
                            const uid = item.dataset.userId;
                            const dot = item.querySelector('.status-dot');
                            if (dot) {
                                if (onlineUsers.has(uid)) dot.classList.add('online');
                                else dot.classList.remove('online');
                            }
                        });
                    })
                    .on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
                        leftPresences.forEach(p => onlineUsers.delete(p.userId));
                        document.querySelectorAll('.dm-conversation-item').forEach(item => {
                            const uid = item.dataset.userId;
                            const dot = item.querySelector('.status-dot');
                            if (dot) {
                                if (onlineUsers.has(uid)) dot.classList.add('online');
                                else dot.classList.remove('online');
                            }
                        });
                    })
                    .subscribe(async (status) => {
                        if (status === 'SUBSCRIBED') {
                            await presenceChannel.track({
                                userId: currentUser.id,
                                name: currentUserFullName,
                                role: currentRole,
                                online_at: new Date().toISOString()
                            });
                        }
                    });
            }

            // ─── UNREAD BADGE ───
            function updateDMBadge() {

            // ─── MARK DM AS READ ───
            async function markDirectMessageAsRead(messageId, senderId) {
                try {
                    await supabase
                        .from('private_messages')
                        .update({ read_at: new Date().toISOString() })
                        .eq('id', messageId)
                        .eq('recipient_id', currentUser.id);
                } catch (err) { console.error('Mark DM read error:', err); }

                if (senderId && dmUnreadBySender[senderId]) {
                    dmUnreadBySender[senderId] = Math.max(0, dmUnreadBySender[senderId] - 1);
                    if (dmUnreadBySender[senderId] === 0) delete dmUnreadBySender[senderId];
                    updateDMBadge();
                    const targetItem = document.querySelector(`.dm-conversation-item[data-user-id="${senderId}"]`);
                    if (targetItem) {
                        const badge = targetItem.querySelector('.dm-unread-badge');
                        const newCount = dmUnreadBySender[senderId] || 0;
                        if (newCount > 0) badge.textContent = newCount;
                        else if (badge) {
                            badge.remove();
                            if (!targetItem.querySelector('.dm-conv-seen')) {
                                targetItem.insertAdjacentHTML('beforeend',
                                    '<span class="dm-conv-seen"><i class="fas fa-check-double"></i></span>');
                            }
                        }
                    }
                }
                const msgRow = document.querySelector(`.dm-msg-row[data-message-id="${messageId}"]`);
                if (msgRow) {
                    msgRow.classList.remove('unread');
                    const statusEl = msgRow.querySelector('.dm-msg-status');
                    if (statusEl) statusEl.textContent = 'Seen';
                    if (!msgRow.querySelector('.dm-seen-indicator')) {
                        const seenDiv = document.createElement('div');
                        seenDiv.className = 'dm-seen-indicator';
                        seenDiv.textContent = `Seen ${formatTimeOnly(new Date())}`;
                        msgRow.querySelector('.dm-msg').appendChild(seenDiv);
                    }
                }
            }

            // ─── OBSERVER FOR AUTO-MARK READ ───
            function setupDmObserver() {
                if (dmObserver) dmObserver.disconnect();
                dmObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const row = entry.target;
                            const messageId = row.dataset.messageId;
                            const senderId = row.dataset.senderId;
                            if (messageId && senderId && row.classList.contains('received') && row.classList
                                .contains('unread')) {
                                markDirectMessageAsRead(messageId, senderId);
                            }
                        }
                    });
                }, { threshold: 0.5 });
                document.querySelectorAll('.dm-msg-row.received.unread').forEach(row => dmObserver.observe(row));
            }
