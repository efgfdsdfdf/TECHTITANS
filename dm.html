            // ─── DM SUBSCRIPTIONS ───
            function subscribeToAllDirectMessages() {
                if (globalDmSubscription) globalDmSubscription.unsubscribe();
                if (!currentUser) return;
                globalDmSubscription = supabase
                    .channel(`dm-global-${currentUser.id}`)
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'private_messages',
                        filter: `recipient_id=eq.${currentUser.id}`
                    }, async (payload) => {
                        const newMsg = payload.new;
                        // Skip if already rendered or sender is current user
                        if (document.querySelector(`.dm-msg-row[data-message-id="${newMsg.id}"]`)) return;
                        if (String(newMsg.sender_id).toLowerCase() === String(currentUser.id).toLowerCase()) return;

                        if (currentRecipientId === newMsg.sender_id) {
                            const messagesDiv = document.getElementById('dmChatMessages');
                            const { data: senderProfile } = await supabase
                                .from('profiles')
                                .select('id, full_name, job_role, avatar_url')
                                .eq('id', newMsg.sender_id)
                                .single();
                            const sender = senderProfile || { full_name: 'Unknown', avatar_url: null };
                            const newRow = appendRenderedMessage(messagesDiv, { ...newMsg, sender }, {
                                isSent: false,
                                sender
                            });
                            if (dmObserver) dmObserver.observe(newRow);
                            return;
                        }

                        dmUnreadBySender[newMsg.sender_id] = (dmUnreadBySender[newMsg.sender_id] || 0) + 1;
                        updateDMBadge();

                        const targetItem = document.querySelector(
                            `.dm-conversation-item[data-user-id="${newMsg.sender_id}"]`);
                        if (targetItem) {
                            let badge = targetItem.querySelector('.dm-unread-badge');
                            const currentCount = dmUnreadBySender[newMsg.sender_id];
                            if (badge) badge.textContent = currentCount;
                            else {
                                badge = document.createElement('span');
                                badge.className = 'dm-unread-badge';
                                badge.textContent = currentCount;
                                targetItem.appendChild(badge);
                            }
                        }

                        let senderName = 'Someone';
                        try {
                            const { data: prof } = await supabase.from('profiles').select('full_name').eq('id',
                                newMsg.sender_id).single();
                            if (prof) senderName = prof.full_name;
                        } catch (e) {}
                        showToast(`New DM from ${senderName}`);

                        if (window.TechTitansNotifications && document.hidden) {
                            window.TechTitansNotifications.display(`New DM from ${senderName}`, {
                                body: newMsg.content ? newMsg.content.substring(0, 50) + (newMsg.content
                                    .length > 50 ? '...' : '') : 'Sent a voice note',
                                url: 'dm.html'
                            });
                        }
                    })
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'private_messages',
                        filter: `recipient_id=eq.${currentUser.id}`
                    }, (payload) => {
                        const updated = payload.new;
                        if (updated.read_at && dmUnreadBySender[updated.sender_id]) {
                            dmUnreadBySender[updated.sender_id]--;
                            if (dmUnreadBySender[updated.sender_id] <= 0) delete dmUnreadBySender[updated
                            .sender_id];
                            updateDMBadge();
                            const targetItem = document.querySelector(
                                `.dm-conversation-item[data-user-id="${updated.sender_id}"]`);
                            if (targetItem) {
                                const badge = targetItem.querySelector('.dm-unread-badge');
                                const newCount = dmUnreadBySender[updated.sender_id] || 0;
                                if (newCount > 0) badge.textContent = newCount;
                                else if (badge) badge.remove();
                            }
                            if (currentRecipientId === updated.sender_id) {
                                const msgRow = document.querySelector(
                                    `.dm-msg-row[data-message-id="${updated.id}"]`);
                                if (msgRow) {
                                    msgRow.classList.remove('unread');
                                }
                            }
                        }
                    })
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'private_messages',
                        filter: `sender_id=eq.${currentUser.id}`
                    }, (payload) => {
                        const updated = payload.new;
                        if (updated.read_at && currentRecipientId === updated.recipient_id) {
                            const msgRow = document.querySelector(`.dm-msg-row[data-message-id="${updated.id}"]`);
                            if (msgRow) {
                                const statusEl = msgRow.querySelector('.dm-msg-status');
                                if (statusEl) statusEl.textContent = 'Seen';
                                if (!msgRow.querySelector('.dm-seen-indicator')) {
                                    const seenDiv = document.createElement('div');
                                    seenDiv.className = 'dm-seen-indicator';
                                    seenDiv.textContent = `Seen ${formatTimeOnly(updated.read_at)}`;
                                    msgRow.querySelector('.dm-msg').appendChild(seenDiv);
                                }
                            }
                        }
                    })
                    .subscribe();

                if (dmDeleteSubscription) dmDeleteSubscription.unsubscribe();
                dmDeleteSubscription = supabase
                    .channel('dm-deletes')
                    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'private_messages' },
                        (payload) => {
                            const deletedMsg = payload.old;
                            if (deletedMsg.sender_id === currentUser.id || deletedMsg.recipient_id === currentUser
                                .id) {
                                removePrivateMessageFromUI(deletedMsg.id);
                            }
                        })
                    .subscribe();
            }

            // ─── AGORA DM CALL FUNCTIONS ─── (unchanged, kept for brevity)
            async function getDmChannelName(userA, userB) {
                const sorted = [userA, userB].sort();
                return window.TechTitansAgora.compactChannelName('dm', sorted.join('_'));
            }

            function isValidAgoraChannelName(channelName) {
                return window.TechTitansAgora.isValidChannelName(channelName);
            }

            function normalizeCallType(mode) {
                return mode === 'video' ? 'video' : 'voice';
            }

            function getCallUserMessage(error) {
                const message = String(error?.message || error?.name || '').toLowerCase();
                if (message.includes('notallowed') || message.includes('permission') || message.includes('denied')) {
                    return 'Microphone or camera permission is blocked. Please allow access for TechTitans and try again.';
                }
                if (message.includes('notreadable') || message.includes('could not start audio source')) {
                    return 'Microphone is unavailable. Close other apps using it, check Android app permissions, and try again.';
                }
                if (message.includes('notfound') || message.includes('device not found')) {
                    return 'No microphone or camera was found on this device.';
                }
                if (message.includes('overconstrained')) {
                    return 'This device cannot start the requested microphone or camera settings.';
                }
                if (message.includes('token') || message.includes('fetch') || message.includes('network')) {
                    return 'Unable to connect to the calling service. Please check your connection and try again.';
                }
                return 'Unable to connect to the call. Please try again.';
            }

            function showCallError(error) {
                const userMessage = getCallUserMessage(error);
                if (typeof showToast === 'function') showToast(userMessage);
                else alert(userMessage);
            }

            async function getAgoraToken(channelName) {
                if (!currentUser?.id) {
                    throw new Error('You must be signed in to start a call.');
                }
                if (!isValidAgoraChannelName(channelName)) {
                    throw new Error('Invalid call channel name.');
                }

                const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
                if (sessionError || !sessionData?.session?.access_token) {
                    throw new Error('Authentication expired. Please log in again.');
                }

                let response;
                try {
                    console.info('Agora token request started');
                    response = await fetch(`${SUPABASE_URL}/functions/v1/agora-token`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${sessionData.session.access_token}`
                        },
                        body: JSON.stringify({
                            channelName,
                            uid: currentUser.id
                        })
                    });
                } catch (error) {
                    console.error('Agora token request failed:', error);
                    throw new Error(
                        'Unable to connect to the calling service. Please check your connection and try again.'
                        );
                }

                let data = {};
                try {
                    data = await response.json();
                } catch (error) {
                    throw new Error('Token server returned an invalid response.');
                }

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to get Agora token.');
                }
                if (!data.token) {
                    throw new Error('Token server did not return an Agora token.');
                }

                console.info('Agora token received');
                return data.token;
            }

            function setupAgoraTokenRefresh(client, getChannelName) {
                if (!client?.on) return;
                const renewToken = async () => {
                    try {
                        const freshToken = await getAgoraToken(getChannelName());
                        if (typeof client.renewToken === 'function') {
                            await client.renewToken(freshToken);
                        }
                    } catch (error) {
                        console.error('Unable to renew Agora token:', error);
                    }
                };
                client.on('token-privilege-will-expire', renewToken);
                client.on('token-privilege-did-expire', renewToken);
            }

            async function sendUserBroadcast(userId, event, payload) {
                const channel = supabase.channel(`user-${userId}`);
                await new Promise((resolve) => {
                    channel.subscribe((status) => {
                        if (status === 'SUBSCRIBED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT')
                            resolve();
                    });
                });
                try {
                    await channel.send({ type: 'broadcast', event, payload });
                } finally {
                    try { channel.unsubscribe(); } catch (err) {}
                }
            }

            async function sendCallPushNotification(callId, recipientId, action = 'incoming') {
                if (!callId || !recipientId) return;
                try {
                    const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
                    if (sessionError || !sessionData?.session?.access_token) return;

                    const response = await fetch(`${SUPABASE_URL}/functions/v1/send-call-notification`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${sessionData.session.access_token}`
                        },
                        body: JSON.stringify({ callId, recipientId, action })
                    });

                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        console.warn('Call push notification failed:', result.error || response.status);
                        return;
                    }
                    console.info('Call push notification processed', {
                        action,
                        sent: result.sent || 0,
                        failed: result.failed || 0
                    });
                } catch (error) {
                    console.warn('Unable to send call push notification:', error);
                }
            }

            function startRingPushLoop(callId, recipientId) {
                stopRingPushLoop();
                if (!callId || !recipientId) return;
                let resends = 0;
                ringPushInterval = setInterval(() => {
                    resends += 1;
                    if (resends > 4 || currentDMCallId !== callId) {
                        stopRingPushLoop();
                        return;
                    }
                    // The edge function rejects 'incoming' once the call is no longer ringing
                    sendCallPushNotification(callId, recipientId, 'incoming');
                }, 8000);
            }

            function stopRingPushLoop() {
                if (ringPushInterval) {
                    clearInterval(ringPushInterval);
                    ringPushInterval = null;
                }
            }

            async function cleanupLocalCallMedia() {
                if (localAudioTrack) {
                    localAudioTrack.stop();
                    localAudioTrack.close();
                    localAudioTrack = null;
                }
                if (localVideoTrack) {
                    localVideoTrack.stop();
                    localVideoTrack.close();
                    localVideoTrack = null;
                }
                localVideo.innerHTML = '';
                remoteVideo.innerHTML = '';
            }

            async function publishLocalTracks(client, mode) {
                if (!window.AgoraRTC) {
                    throw new Error('Calling service did not load. Check your internet connection and refresh.');
                }
                if (!client) {
                    throw new Error('Call client is not available.');
                }

                console.info('Agora media initialization started', { mode });
                localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                const tracks = [localAudioTrack];

                if (mode === 'video') {
                    localVideoTrack = await AgoraRTC.createCameraVideoTrack();
                    tracks.push(localVideoTrack);
                    localVideoTrack.play('localVideo');
                }

                console.info('Agora publish started');
                await client.publish(tracks);
                console.info('Agora publish succeeded');
            }

            function formatCallDuration(totalSeconds) {
                const seconds = Math.max(0, Math.floor(totalSeconds || 0));
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${String(secs).padStart(2, '0')}`;
            }

            function stopCallTimer(label = 'Waiting for answer') {
                if (callTimerInterval) clearInterval(callTimerInterval);
                callTimerInterval = null;
                callStartedAt = null;
                if (callTimer) callTimer.textContent = label;
            }

            function startCallTimer(startedAt = new Date()) {
                callStartedAt = startedAt instanceof Date ? startedAt : new Date(startedAt);
                if (Number.isNaN(callStartedAt.getTime())) callStartedAt = new Date();
                if (callTimerInterval) clearInterval(callTimerInterval);
                const render = () => {
                    if (!callTimer || !callStartedAt) return;
                    callTimer.textContent = formatCallDuration((Date.now() - callStartedAt.getTime()) / 1000);
                };
                render();
                callTimerInterval = setInterval(render, 1000);
            }

            async function subscribeToCurrentCall(callId) {
                if (!callId) return;
                if (callStatusChannel) {
                    try { await callStatusChannel.unsubscribe(); } catch (err) {}
                    callStatusChannel = null;
                }

                callStatusChannel = supabase
                    .channel(`dm-call-status-${callId}`)
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'calls',
                        filter: `id=eq.${callId}`
                    }, async ({ new: callRow }) => {
                        const trackedCallId = currentDMCallId || pendingCall?.callId;
                        if (!callRow || callRow.id !== trackedCallId) return;
                        if (callRow.status === 'active' && callRow.started_at && !callStartedAt) {
                            startCallTimer(new Date(callRow.started_at));
                        }
                        if (['ended', 'declined', 'missed', 'cancelled', 'failed'].includes(callRow.status)) {
                            showToast(callRow.status === 'ended' ? 'Call ended' : 'Call closed');
                            await hangUpCall(false);
                        }
                    })
                    .subscribe();
            }

            async function markParticipantJoined(callId, userId, joinedAt = new Date()) {
                if (!callId || !userId) return;
                try {
                    await supabase.from('call_participants')
                        .update({ status: 'joined', joined_at: joinedAt.toISOString() })
                        .eq('call_id', callId)
                        .eq('user_id', userId);
                } catch (error) {
                    console.warn('Unable to mark call participant joined:', error);
                }
            }

            async function markParticipantLeft(callId, userId, endedAt = new Date()) {
                if (!callId || !userId) return;
                try {
                    const durationSeconds = callStartedAt ?
                        Math.max(0, Math.floor((endedAt.getTime() - callStartedAt.getTime()) / 1000)) :
                        0;
                    await supabase.from('call_participants')
                        .update({
                            status: 'left',
                            left_at: endedAt.toISOString(),
                            duration_seconds: durationSeconds
                        })
                        .eq('call_id', callId)
                        .eq('user_id', userId);
                } catch (error) {
                    console.warn('Unable to mark call participant left:', error);
                }
            }

            async function activateAcceptedCall(callId, acceptedBy, metadata = {}) {
                if (!callId) return new Date();
                const startedAt = new Date();
                try {
                    await supabase.from('call_participants')
                        .update({ status: 'joined', joined_at: startedAt.toISOString() })
                        .eq('call_id', callId)
                        .eq('user_id', acceptedBy);
                    await supabase.from('call_events').insert({
                        call_id: callId,
                        event_type: 'call_accepted',
                        user_id: acceptedBy,
                        metadata
                    });
                    await supabase.from('calls')
                        .update({ status: 'active', started_at: startedAt.toISOString() })
                        .eq('id', callId)
                        .neq('status', 'ended');
                } catch (eventError) {
                    console.warn('Unable to activate accepted call:', eventError);
                }
                return startedAt;
            }

            async function startDMCall(targetUserId, targetUserName, mode) {
                if (callActive || callStarting) { alert('You are already joining or in a call.'); return; }
                callStarting = true;
                callType = normalizeCallType(mode);
                callTarget = targetUserId;
                audioEnabled = true;
                videoEnabled = true;

                const client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
                agoraClient = client;

                client.on('user-published', async (user, mediaType) => {
                    await client.subscribe(user, mediaType);
                    if (mediaType === 'video') {
                        const remoteVideoTrack = user.videoTrack;
                        remoteVideoTrack.play('remoteVideo');
                    }
                    if (mediaType === 'audio') user.audioTrack.play();
                    remoteVideoLabel.textContent = targetUserName;
                });

                // Show modal immediately while connecting
                callOptionsModal.style.display = 'none';
                callModalTitle.textContent = `Calling ${targetUserName}...`;
                callModal.style.display = 'flex';

                let channelName = null;
                try {
                    channelName = await getDmChannelName(currentUser.id, targetUserId);
                    setupAgoraTokenRefresh(client, () => channelName);
                    const token = await getAgoraToken(channelName);
                    console.info('Agora DM join started');
                    await client.join(AGORA_APP_ID, channelName, token, currentUser.id);
                    console.info('Agora DM join succeeded');
                    joinedAgoraChannelName = channelName;
                    await publishLocalTracks(client, callType);
                    callActive = true;
                    callStarting = false;
                    stopCallTimer('Waiting for answer');
                } catch (err) {
                    console.error('Failed to start call:', err);
                    await hangUpCall(false);
                    showCallError(err);
                    return;
                }

                const { data: callData, error: callError } = await supabase.from('calls')
                    .insert({
                        initiated_by: currentUser.id,
                        type: callType,
                        status: 'ringing',
                        room_id: channelName
                    })
                    .select()
                    .single();
                if (callError || !callData) {
                    console.error('Unable to create call record:', callError);
                } else {
                    currentDMCallId = callData.id;
                    await subscribeToCurrentCall(currentDMCallId);
                    try {
                        await supabase.from('call_participants').insert([
                            { call_id: callData.id, user_id: currentUser.id, status: 'joined' },
                            { call_id: callData.id, user_id: targetUserId, status: 'invited' }
                        ]);
                    } catch (participantError) {
                        console.warn('Unable to insert call participants:', participantError);
                    }
                    await sendCallPushNotification(callData.id, targetUserId, 'incoming');
                    startRingPushLoop(callData.id, targetUserId);
                }

                await sendUserBroadcast(targetUserId, 'call-offer', {
                    callerId: currentUser.id,
                    callerName: currentUserFullName,
                    callChannelName: channelName,
                    callType,
                    callId: currentDMCallId
                });

                callActive = true;
                callStarting = false;
            }

            async function acceptDMCall() {
                if (!pendingCall) return;
                if (callActive || callStarting) { alert('You are already joining or in a call.'); return; }
                callStarting = true;
                incomingCallModal.style.display = 'none';
                if (window.TechTitansRingtone) window.TechTitansRingtone.stop();

                const { callerId, callerName, callChannelName, callType: incomingType, callId } = pendingCall;
                callType = normalizeCallType(incomingType);
                callTarget = callerId;
                currentDMCallId = callId || null;
                audioEnabled = true;
                videoEnabled = true;

                if (callId) await subscribeToCurrentCall(callId);

                const client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
                agoraClient = client;

                client.on('user-published', async (user, mediaType) => {
                    await client.subscribe(user, mediaType);
                    if (mediaType === 'video') {
                        const remoteVideoTrack = user.videoTrack;
                        remoteVideoTrack.play('remoteVideo');
                    }
                    if (mediaType === 'audio') user.audioTrack.play();
                    remoteVideoLabel.textContent = callerName;
                });

                // Show modal immediately while connecting
                callModalTitle.textContent = `Connecting to ${callerName}...`;
                callModal.style.display = 'flex';

                try {
                    setupAgoraTokenRefresh(client, () => callChannelName);
                    const token = await getAgoraToken(callChannelName);
                    console.info('Agora DM accept join started');
                    await client.join(AGORA_APP_ID, callChannelName, token, currentUser.id);
                    console.info('Agora DM accept join succeeded');
                    joinedAgoraChannelName = callChannelName;
                    await publishLocalTracks(client, callType);
                    const startedAt = await activateAcceptedCall(callId, currentUser.id, {
                        callType,
                        room_id: callChannelName,
                        accepted_via: 'web'
                    });
                    if (callId) await sendCallPushNotification(callId, currentUser.id, 'cancelled');
                    startCallTimer(startedAt);
                    if (callTarget) {
                        await sendUserBroadcast(callTarget, 'call-accepted', {
                            callId: currentDMCallId,
                            acceptedBy: currentUser.id,
                            calleeName: currentUserFullName,
                            callType,
                            startedAt: startedAt.toISOString()
                        });
                    }
                } catch (err) {
                    console.error('Failed to accept call:', err);
                    await hangUpCall(false);
                    showCallError(err);
                    return;
                }

                callModalTitle.textContent = `Call with ${callerName}`;
                callActive = true;
                callStarting = false;
            }

            async function acceptNativeCallFromUrl() {
                const params = new URLSearchParams(window.location.search);
                const callId = params.get('callId');
                const nativeAccepted = params.get('nativeAccepted') === '1';
                const nativeDeclined = params.get('nativeDeclined') === '1';
                if (!callId || callActive || callStarting) return;

                try {
                    const { data: call, error: callError } = await supabase
                        .from('calls')
                        .select('id, initiated_by, type, status, room_id')
                        .eq('id', callId)
                        .single();
                    if (callError || !call || ['ended', 'declined', 'missed', 'cancelled', 'failed'].includes(call
                            .status)) {
                        showToast('This call is no longer available');
                        return;
                    }

                    if (nativeDeclined) {
                        await declineCallById(call.id, call.initiated_by, call.type);
                        showToast('Call declined');
                        return;
                    }

                    const { data: callerProfile } = await supabase
                        .from('profiles')
                        .select('full_name')
                        .eq('id', call.initiated_by)
                        .maybeSingle();

                    pendingCall = {
                        callerId: call.initiated_by,
                        callerName: callerProfile?.full_name || 'TechTitans',
                        callChannelName: call.room_id,
                        callType: call.type,
                        callId: call.id
                    };
                    if (nativeAccepted) {
                        await acceptDMCall();
                    } else {
                        await subscribeToCurrentCall(call.id);
                        incomingCallerName.textContent = pendingCall.callerName;
                        incomingCallType.textContent = call.type === 'video' ? 'Video call' : 'Voice call';
                        incomingCallModal.style.display = 'flex';
                    }
                } catch (error) {
                    console.warn('Unable to accept native call from URL:', error);
                    showToast('Unable to open this call');
                } finally {
                    if (window.history?.replaceState) {
                        window.history.replaceState({}, document.title, 'dm.html');
                    }
                }
            }

            window.acceptDMCallFromNotification = async (data) => {
                if (callActive || callStarting) return;
                pendingCall = {
                    callerId: data.callerId,
                    callerName: data.callerName || 'TechTitans',
                    callChannelName: data.roomId,
                    callType: data.callType,
                    callId: data.callId
                };
                await acceptDMCall();
            };

            async function declineCallById(callId, callerId, declinedCallType) {
                if (!callId) return;
                try {
                    await supabase.from('call_participants')
                        .update({ status: 'declined' })
                        .eq('call_id', callId)
                        .eq('user_id', currentUser.id);
                    await supabase.from('call_events').insert({
                        call_id: callId,
                        event_type: 'call_declined',
                        user_id: currentUser.id,
                        metadata: {
                            callerId,
                            missed: true,
                            callType: declinedCallType,
                            callerName: currentUserFullName
                        }
                    });
                    if (callerId) {
                        await sendUserBroadcast(callerId, 'call-missed', {
                            callId,
                            missedBy: currentUser.id,
                            callType: declinedCallType,
                            calleeName: currentUserFullName
                        });
                    }
                } catch (declineError) {
                    console.warn('Unable to record call decline event:', declineError);
                }
            }

            window.declineDMCallFromNotification = async (data) => {
                if (window.TechTitansRingtone) window.TechTitansRingtone.stop();
                const callId = data.callId || pendingCall?.callId;
                const callerId = data.callerId || pendingCall?.callerId;
                const declinedType = data.callType || pendingCall?.callType;
                if (pendingCall && (!callId || pendingCall.callId === callId)) {
                    incomingCallModal.style.display = 'none';
                    pendingCall = null;
                }
                await declineCallById(callId, callerId, declinedType);
            };

            async function hangUpCall(shouldNotifyPeer = true) {
                if (endingCall) return;
                endingCall = true;
                stopRingPushLoop();
                if (window.TechTitansRingtone) window.TechTitansRingtone.stop();
                const endedCallId = currentDMCallId;
                const endedCallTarget = callTarget;
                const endedCallType = callType;
                const endedAt = new Date();

                if (endedCallId) {
                    try {
                        await markParticipantLeft(endedCallId, currentUser.id, endedAt);
                        await supabase.from('call_events').insert({
                            call_id: endedCallId,
                            event_type: 'call_ended',
                            user_id: currentUser.id,
                            metadata: {
                                ended_by: currentUser.id,
                                callType: endedCallType,
                                callerName: currentUserFullName,
                                duration_seconds: callStartedAt ?
                                    Math.max(0, Math.floor((endedAt.getTime() - callStartedAt.getTime()) /
                                        1000)) :
                                    0
                            }
                        });
                        const durationSeconds = callStartedAt ?
                            Math.max(0, Math.floor((endedAt.getTime() - callStartedAt.getTime()) / 1000)) :
                            0;
                        const endUpdate = await supabase.from('calls')
                            .update({
                                status: 'ended',
                                ended_at: endedAt.toISOString(),
                                ended_by: currentUser.id,
                                duration_seconds: durationSeconds
                            })
                            .eq('id', endedCallId);
                        if (endUpdate.error) {
                            await supabase.from('calls')
                                .update({ status: 'ended', ended_at: endedAt.toISOString() })
                                .eq('id', endedCallId);
                        }
                        if (endedCallTarget) {
                            const isCaller = !pendingCall;
                            if (isCaller) {
                                const isVideo = endedCallType === 'video';
                                let msgContent = `📞 ${isVideo ? 'Video' : 'Voice'} call ended`;
                                if (durationSeconds > 0) {
                                    msgContent =
                                        `📞 ${isVideo ? 'Video' : 'Voice'} call - ${formatCallDuration(durationSeconds)}`;
                                } else {
                                    msgContent = `📞 Missed ${isVideo ? 'Video' : 'Voice'} call`;
                                }
                                await supabase.from('private_messages').insert({
                                    sender_id: currentUser.id,
                                    recipient_id: endedCallTarget,
                                    content: msgContent,
                                    read_at: new Date().toISOString()
                                });
                            }
                        }
                        if (endedCallTarget && shouldNotifyPeer) {
                            await sendCallPushNotification(endedCallId, endedCallTarget, 'cancelled');
                            await sendUserBroadcast(endedCallTarget, 'call-ended', {
                                callId: endedCallId,
                                endedBy: currentUser.id,
                                callType: endedCallType,
                                callerName: currentUserFullName
                            });
                        }
                    } catch (endError) {
                        console.warn('Unable to record DM call end event:', endError);
                    }
                }

                const client = agoraClient;
                agoraClient = null;
                if (client) {
                    try { await client.leave(); } catch (leaveError) {
                        console.warn('Agora DM leave skipped:',
                            leaveError);
                    }
                }
                await cleanupLocalCallMedia();
                if (callStatusChannel) {
                    try { await callStatusChannel.unsubscribe(); } catch (err) {}
                    callStatusChannel = null;
                }
                stopCallTimer('Call ended');
                callModal.style.display = 'none';
                incomingCallModal.style.display = 'none';
                callActive = false;
                callStarting = false;
                joinedAgoraChannelName = null;
                currentDMCallId = null;
                callTarget = null;
                pendingCall = null;
                endingCall = false;
                if (window.TechTitansNotifications) {
                    window.TechTitansNotifications.display('Call ended', {
                        body: 'Your direct call has ended.',
                        url: 'dm.html'
                    });
                }
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'call-ended' }, '*');
                }
            }

            function setupUserChannel() {
                const channel = supabase.channel(`user-${currentUser.id}`);
                channel
                    .on('broadcast', { event: 'call-offer' }, ({ payload }) => {
                        const { callerId, callerName, callChannelName, callType, callId } = payload;
                        if (callActive) {
                            sendUserBroadcast(callerId, 'call-missed', {
                                callId,
                                missedBy: currentUser.id,
                                callType,
                                calleeName: currentUserFullName,
                                reason: 'busy'
                            });
                            return;
                        }

                        pendingCall = { callerId, callerName, callChannelName, callType, callId };
                        if (callId) subscribeToCurrentCall(callId);
                        incomingCallerName.textContent = callerName;
                        incomingCallType.textContent = callType === 'video' ? 'Video call' : 'Voice call';
                        incomingCallModal.style.display = 'flex';

                        if (window.TechTitansNotifications) {
                            window.TechTitansNotifications.display(`Incoming ${callType} call from ${callerName}`, {
                                body: `${callerName} is calling you. Answer in DM to join.`,
                                url: 'dm.html'
                            });
                        }
                        if (window.TechTitansRingtone) {
                            window.TechTitansRingtone.start();
                        }
                    })
                    .on('broadcast', { event: 'call-accepted' }, ({ payload }) => {
                        if (!currentDMCallId || payload.callId !== currentDMCallId) return;
                        stopRingPushLoop();
                        callModalTitle.textContent = `Call with ${payload.calleeName || 'teammate'}`;
                        const startedAt = payload.startedAt ? new Date(payload.startedAt) : new Date();
                        startCallTimer(startedAt);
                        markParticipantJoined(currentDMCallId, currentUser.id, startedAt);
                        showToast(`${payload.calleeName || 'Your teammate'} joined the call`);
                    })
                    .on('broadcast', { event: 'call-ended' }, async ({ payload }) => {
                        if (currentDMCallId && payload.callId && payload.callId !== currentDMCallId) return;
                        showToast('Call ended');
                        await hangUpCall(false);
                    })
                    .on('broadcast', { event: 'call-missed' }, async ({ payload }) => {
                        if (currentDMCallId && payload.callId && payload.callId !== currentDMCallId) return;
                        showToast(payload.reason === 'busy' ? 'User is busy on another call' :
                            'Call declined or missed');
                        await hangUpCall(false);
                    })
                    .subscribe();
                return channel;
            }

            // ─── MUTE CONTROLS ───
            let audioEnabled = true,
                videoEnabled = true;
            document.getElementById('muteAudioBtn').addEventListener('click', async () => {
                if (localAudioTrack) {
                    audioEnabled = !audioEnabled;
                    await localAudioTrack.setEnabled(audioEnabled);
                    document.getElementById('muteAudioBtn').textContent = audioEnabled ? 'Mic' : 'Muted';
                }
            });
            document.getElementById('muteVideoBtn').addEventListener('click', async () => {
                if (localVideoTrack) {
                    videoEnabled = !videoEnabled;
                    await localVideoTrack.setEnabled(videoEnabled);
                    document.getElementById('muteVideoBtn').textContent = videoEnabled ? 'Video' : 'Video off';
                }
            });

            // ─── NAVIGATION & EVENT LISTENERS ───
            document.getElementById('logout').addEventListener('click', async () => {
                if (globalDmSubscription) globalDmSubscription.unsubscribe();
                if (dmDeleteSubscription) dmDeleteSubscription.unsubscribe();
                if (userChannel) userChannel.unsubscribe();
                if (presenceChannel) await presenceChannel.untrack();
                if (callActive) hangUpCall();
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            });

            document.getElementById('closeProfileModal').addEventListener('click', () => {
                profileModal.style.display =
                    'none';
            });
            modalSendDM.addEventListener('click', () => {
                const userId = modalSendDM.dataset.userId;
                profileModal.style.display = 'none';
                const targetItem = document.querySelector(`.dm-conversation-item[data-user-id="${userId}"]`);
                if (targetItem) targetItem.click();
            });

            document.getElementById('startVideoCallBtn').addEventListener('click', () => {
                if (!currentRecipientId) return;
                const activeItem = document.querySelector('.dm-conversation-item.active');
                const userName = activeItem ? activeItem.dataset.userName : 'User';
                startDMCall(currentRecipientId, userName, 'video');
            });
            document.getElementById('startVoiceCallBtn').addEventListener('click', () => {
                if (!currentRecipientId) return;
                const activeItem = document.querySelector('.dm-conversation-item.active');
                const userName = activeItem ? activeItem.dataset.userName : 'User';
                startDMCall(currentRecipientId, userName, 'voice');
            });
            document.getElementById('cancelCallOptionsBtn').addEventListener('click', () => {
                callOptionsModal.style
                    .display = 'none';
            });
            document.getElementById('acceptCallBtn').addEventListener('click', acceptDMCall);
            document.getElementById('declineCallBtn').addEventListener('click', async () => {
                if (window.TechTitansRingtone) window.TechTitansRingtone.stop();
                if (pendingCall && pendingCall.callId) {
                    try {
                        await supabase.from('call_participants')
                            .update({ status: 'declined' })
                            .eq('call_id', pendingCall.callId)
                            .eq('user_id', currentUser.id);
                        await supabase.from('call_events').insert({
                            call_id: pendingCall.callId,
                            event_type: 'call_declined',
                            user_id: currentUser.id,
                            metadata: {
                                callerId: pendingCall.callerId,
                                missed: true,
                                callType: pendingCall.callType,
                                callerName: currentUserFullName
                            }
                        });
                        await sendUserBroadcast(pendingCall.callerId, 'call-missed', {
                            callId: pendingCall.callId,
                            missedBy: currentUser.id,
                            callType: pendingCall.callType,
                            calleeName: currentUserFullName
                        });
                    } catch (declineError) {
                        console.warn('Unable to record call decline event:', declineError);
                    }
                }
                incomingCallModal.style.display = 'none';
                pendingCall = null;
                if (window.TechTitansNotifications) {
                    window.TechTitansNotifications.display('Missed call', {
                        body: 'You missed an incoming call.',
                        url: 'dm.html'
                    });
                }
            });
            document.getElementById('closeCallModalBtn').addEventListener('click', hangUpCall);
            document.getElementById('hangupCallBtn').addEventListener('click', hangUpCall);

            window.addEventListener('scroll', () => modal.style.display = 'none', true);
            document.addEventListener('click', (e) => { if (!modal.contains(e.target)) modal.style.display = 'none'; });

            // ─── INIT ───
            async function init() {
                if (new URLSearchParams(window.location.search).get('iframeMode') === '1') {
                    document.body.classList.add('iframe-mode');
                }
                
                try {
                    const { data: { user }, error: userError } = await supabase.auth.getUser();
                    if (userError || !user) { window.location.href = 'index.html'; return; }
                    currentUser = user;
                    const metadata = user.user_metadata || {};
                    currentUserFullName = metadata.full_name || 'User';
                    currentRole = metadata.job_role;
                    isCEO = (currentRole === 'CEO');

                    await setupPresence();
                    subscribeToAllDirectMessages();
                    userChannel = setupUserChannel();

                    await loadPrivateMessagesView();
                    await acceptNativeCallFromUrl();
                } catch (err) {
                    console.error('Init error:', err);
                    document.getElementById('messagesArea').innerHTML =
                        '<div style="color:#ff628c;text-align:center;padding:2rem;">Failed to load DMs. Please refresh.</div>';
                }
            }

            init();
        })();
    </script>
</body>
