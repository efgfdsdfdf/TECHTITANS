<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/titans_logo2.png">
  <title>TECH TITANS - Direct Messages</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    html, body {
      background: #0b0f17;
      display: flex;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    body.sidebar-collapsed .sidebar {
      transform: translateX(-100%);
      width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }
    body.sidebar-collapsed .main {
      padding-left: 0;
    }
    .sidebar {
      width: 260px;
      background: rgba(10, 16, 28, 0.95);
      backdrop-filter: blur(10px);
      border-right: 1px solid #1f2a44;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex-shrink: 0;
      transition: transform 0.25s ease, width 0.25s ease, padding 0.25s ease;
      overflow: hidden;
    }
    .logo {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      padding-left: 1rem;
      white-space: nowrap;
    }
    .logo span { color: #428cff; }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .nav a {
      color: #9aa4bf;
      text-decoration: none;
      padding: 0.9rem 1rem;
      border-radius: 1.2rem;
      transition: 0.2s;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      position: relative;
      white-space: nowrap;
    }
    .nav a:hover, .nav a.active {
      background: #1f2a44;
      color: #fff;
    }
    .nav a.active {
      background: #428cff;
      color: #fff;
      box-shadow: 0 8px 16px -8px #428cff;
    }
    .sidebar-unread {
      background: #ff4d4d;
      color: #fff;
      border-radius: 2rem;
      padding: 0.15rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: auto;
      line-height: 1.3;
      box-shadow: 0 0 0 1px #0b0f17;
    }
    .logout-btn {
      margin-top: auto;
      background: transparent;
      border: 1px solid #2f3a5a;
      color: #ff9f9f;
      padding: 0.9rem;
      border-radius: 1.2rem;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .logout-btn:hover {
      background: #ff4d4d20;
      border-color: #ff4d4d;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      transition: padding 0.25s ease;
    }
    .chat-panel {
      flex: 1;
      background: #131c30;
      border-radius: 2rem;
      border: 1px solid #263154;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
      min-height: 0;
    }
    .chat-header {
      padding: 1.2rem 1.8rem;
      border-bottom: 1px solid #263154;
      color: #fff;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      flex-shrink: 0;
      background: #131c30;
      z-index: 5;
    }
    .chat-header .hamburger-toggle {
      background: none;
      border: none;
      color: #9aa4bf;
      font-size: 1.4rem;
      cursor: pointer;
      display: none;
      padding: 0.2rem 0.5rem;
      border-radius: 0.5rem;
      transition: 0.2s;
    }
    .chat-header .hamburger-toggle:hover {
      background: #1f2a44;
      color: #fff;
    }
    .online-count {
      background: #1f2a44;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      color: #8affb8;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-left: auto;
    }
    .online-count::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      display: inline-block;
    }
    .messages-area {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
    }

    .dm-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      gap: 0;
    }
    .dm-conversations-list {
      width: min(360px, 34vw);
      border-right: 1px solid #263154;
      overflow-y: auto;
      min-height: 0;
      background: #0d1426;
      flex-shrink: 0;
    }
    .dm-list-header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 1rem;
      font-weight: 600;
      color: #d7def5;
      border-bottom: 1px solid #263154;
      font-size: 0.9rem;
      background: #0d1426;
    }
    .dm-list-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.dm-list-hamburger {
  display: none;
}
@media (max-width: 768px) {
  .dm-list-hamburger {
    display: inline-flex;
    width: 2.4rem;
    height: 2.4rem;
    font-size: 1.1rem;
    padding: 0;
  }
}
    .dm-conversation-item {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #1f2a44;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .dm-conversation-item:hover {
      background: #18233b;
    }
    .dm-conversation-item.active {
      background: #203257;
      border-left: 3px solid #428cff;
    }
    .dm-conv-content {
      flex: 1;
      min-width: 0;
    }
    .dm-conv-name {
      color: #fff;
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dm-conv-role {
      color: #9aa4bf;
      font-size: 0.75rem;
      margin-top: 0.2rem;
    }
    .status-dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }
    .status-dot.online {
      background: #2ecc71;
    }
    .dm-unread-badge {
      background: #428cff;
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      min-width: 20px;
      text-align: center;
      margin-left: auto;
    }

    .dm-chat-area {
      flex: 1;
      display: none;
      flex-direction: column;
      background:
        radial-gradient(circle at 18px 18px, rgba(255,255,255,0.035) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(180deg, #111a2c 0%, #0d1525 100%);
      min-width: 0;
      min-height: 0;
    }
    .dm-chat-header {
      min-height: 72px;
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid #263154;
      color: #fff;
      font-weight: 500;
      background: rgba(17, 26, 44, 0.94);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }
    .dm-chat-header .dm-back-btn {
      display: none;
    }
    .dm-chat-peer {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
    }
    .dm-peer-copy {
      min-width: 0;
    }
    .dm-chat-title {
      display: block;
      color: #f8fbff;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dm-chat-subtitle {
      display: block;
      color: #91a0c7;
      font-size: 0.78rem;
      margin-top: 0.15rem;
    }
    .dm-chat-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }
    .dm-icon-btn {
      min-width: 2.55rem;
      height: 2.55rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      background: #18233b;
      color: #eaf0ff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .dm-chat-actions .dm-icon-btn {
      width: auto;
      min-width: 4rem;
      padding: 0 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .dm-icon-btn:hover {
      background: #203257;
      transform: translateY(-1px);
    }
    .dm-icon-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .dm-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      scroll-behavior: smooth;
      min-height: 0;
    }
    .dm-chat-input {
      display: flex;
      padding: 0.85rem 1rem;
      background: rgba(17, 26, 44, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid #263154;
      gap: 0.5rem;
      align-items: center;
      flex-shrink: 0;
    }
    .dm-composer-tools {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }
    .dm-input-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
    }
    #dmChatInput {
      width: 100%;
      background: #0b1221;
      border: 1px solid #263154;
      border-radius: 999px;
      padding: 0.8rem 1.2rem;
      color: #fff;
      outline: none;
      min-width: 0;
    }
    #dmChatInput:focus {
      border-color: #428cff;
    }
    #dmChatSendBtn {
      background: #428cff;
      border: none;
      color: #fff;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.2s;
      flex-shrink: 0;
    }
    .voice-btn {
      background: #2f3a5a;
      border: none;
      color: #fff;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.2s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dm-msg-row {
      display: flex;
      margin-bottom: 0.5rem;
      cursor: pointer;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .dm-msg-row.sent {
      justify-content: flex-end;
    }
    .dm-msg-row.unread .dm-msg {
      border-left: 4px solid #428cff;
    }
    .dm-msg {
      max-width: min(68%, 720px);
      padding: 0.72rem 0.82rem 0.42rem;
      border-radius: 1rem;
      word-wrap: break-word;
      font-size: 0.9rem;
      line-height: 1.4;
      position: relative;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }
    .dm-msg-text {
      white-space: pre-wrap;
    }
    .dm-msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
      margin-top: 0.32rem;
      font-size: 0.68rem;
      line-height: 1;
      opacity: 0.76;
    }
    .dm-msg-status {
      color: #bde7ff;
      font-weight: 800;
      letter-spacing: 0;
    }
    .dm-msg.sent {
      background: linear-gradient(135deg, #2979ff, #1f9f7a);
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }
    .dm-msg.received {
      background: #202b43;
      color: #e0e7ff;
      border-bottom-left-radius: 0.25rem;
    }
    .dm-seen-indicator {
      font-size: 0.68rem;
      color: #8fa0c5;
      margin-top: 0.25rem;
      text-align: right;
    }

    .dm-date-separator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.8rem 0;
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 0.3rem 0;
    }
    .dm-date-separator span {
      background: #1f2a44;
      color: #9aa4bf;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border: 1px solid #2f3a5a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .dm-voice-note {
      display: grid;
      grid-template-columns: auto minmax(130px, 1fr) auto;
      align-items: center;
      gap: 0.65rem;
      min-width: min(300px, 62vw);
    }
    .dm-audio-btn {
      min-width: 3.2rem;
      padding: 0 0.6rem;
      height: 2.35rem;
      border: none;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .dm-wave {
      height: 1.8rem;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .dm-wave span {
      width: 3px;
      height: var(--h);
      border-radius: 999px;
      background: rgba(255,255,255,0.48);
    }
    .dm-audio-duration {
      font-size: 0.76rem;
      opacity: 0.82;
      min-width: 2.6rem;
      text-align: right;
    }
    .dm-audio-progress {
      grid-column: 2 / 4;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }
    .dm-audio-progress span {
      display: block;
      width: 0%;
      height: 100%;
      background: #fff;
    }
    .dm-msg.received .dm-audio-btn {
      background: rgba(66,140,255,0.22);
    }
    .dm-msg.received .dm-wave span {
      background: rgba(190,210,255,0.58);
    }
    .dm-empty-state {
      margin: auto;
      max-width: 360px;
      color: #9aa4bf;
      text-align: center;
      padding: 2rem;
      line-height: 1.5;
    }
    .dm-delete-btn {
      position: absolute;
      top: 0.35rem;
      right: 0.4rem;
      border: 0;
      background: rgba(0,0,0,0.18);
      color: inherit;
      border-radius: 999px;
      padding: 0.2rem 0.45rem;
      font-size: 0.66rem;
      opacity: 0;
      cursor: pointer;
    }
    .dm-msg:hover .dm-delete-btn {
      opacity: 0.85;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #428cff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.1s;
      object-fit: cover;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .avatar:hover {
      transform: scale(1.05);
    }

    .typing-container {
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      padding: 0 1.5rem;
    }
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 1rem;
      background: #1f2a44;
      border-radius: 2rem;
      width: fit-content;
      margin-bottom: 0.5rem;
    }
    .typing-indicator span {
      width: 0.5rem;
      height: 0.5rem;
      background: #9aa4bf;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-0.5rem); }
    }
    .typing-text {
      color: #9aa4bf;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }
    .recording-timer {
      color: #ff4d4d;
      font-size: 1rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }
    .voice-btn.recording {
      background: #ff4d4d;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .call-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .call-modal-content {
      background: #1f2a44;
      border-radius: 1.5rem;
      padding: 1.5rem;
      max-width: 800px;
      width: 90%;
      color: #fff;
    }
    .call-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .call-modal-header h3 { font-size: 1.2rem; }
    .call-timer {
      color: #9aa4bf;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      margin: -0.35rem 0 1rem;
    }
    .call-modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .call-videos {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .video-container {
      background: #0b0f17;
      border-radius: 1rem;
      overflow: hidden;
      width: 300px;
      height: 200px;
      position: relative;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .rtc-video-slot {
      width: 100%;
      height: 100%;
      background: #090d15;
    }
    .rtc-video-slot > * {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }
    .video-label {
      position: absolute;
      bottom: 0.5rem;
      left: 0.5rem;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
    }
    .call-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .call-controls button {
      background: #428cff;
      border: none;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .call-controls button.hangup { background: #ff4d4d; }
    .call-controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    .call-options-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1500;
    }
    .call-options-content {
      background: #1f2a44;
      border-radius: 1.5rem;
      padding: 1.5rem;
      width: 300px;
      color: #fff;
      text-align: center;
    }
    .call-options-content h3 { margin-bottom: 1rem; }
    .call-option-btn {
      background: #2f3a5a;
      border: none;
      color: #fff;
      padding: 1rem;
      margin: 0.5rem 0;
      width: 100%;
      border-radius: 2rem;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }
    .call-option-btn:hover { background: #428cff; }
    .call-option-btn.video { background: #428cff; }
    .call-option-btn.video:hover { background: #5f9eff; }

    #incomingCallModal .call-modal-content {
      max-width: 400px;
      text-align: center;
    }
    #incomingCallModal .call-controls { margin-top: 1.5rem; }
    #acceptCallBtn { background: #2ecc71; }
    #declineCallBtn { background: #ff4d4d; }

    .read-receipts-modal {
      position: absolute;
      background: #1f2a44;
      border: 1px solid #428cff;
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      color: #fff;
      font-size: 0.9rem;
      z-index: 1000;
      box-shadow: 0 12px 28px rgba(0,0,0,0.7);
      min-width: 260px;
      max-width: 320px;
      backdrop-filter: blur(4px);
    }

      // ─── HELPERS ───
      function formatDateHeader(date) {
        const now = new Date();
        const msgDate = new Date(date);
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const msgDay = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
        if (msgDay.getTime() === today.getTime()) return 'Today';
        else if (msgDay.getTime() === yesterday.getTime()) return 'Yesterday';
        else return msgDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long',
            day: 'numeric' });
      }

      function formatTimeOnly(date) {
        return new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function formatAudioTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const rounded = Math.floor(seconds);
        const minutes = Math.floor(rounded / 60);
        const secs = rounded % 60;
        return `${minutes}:${secs.toString().padStart(2, '0')}`;
      }

      function stringToColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash % 360);
        return `hsl(${hue}, 70%, 50%)`;
      }

      function getInitials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
        return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
      }

      function escapeHtml(unsafe) {
        if (unsafe === null || unsafe === undefined) return '';
        return String(unsafe).replace(/[&<>"']/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          if (m === "'") return '&#039;';
          return m;
        });
      }

      function renderVoiceNote(audioUrl, messageId) {
        const bars = [12, 20, 15, 26, 18, 30, 14, 24, 17, 28, 13, 22, 16, 25]
          .map(h => `<span style="--h:${h}px"></span>`)
          .join('');
        return `
          <div class="dm-voice-note" data-audio-url="${escapeHtml(audioUrl)}" data-message-id="${escapeHtml(messageId)}">
            <button type="button" class="dm-audio-btn" aria-label="Play voice note">Play</button>
            <div class="dm-wave">${bars}</div>
            <span class="dm-audio-duration">0:00</span>
            <div class="dm-audio-progress"><span></span></div>
          </div>
        `;
      }

      function renderMessageBubble(msg, options = {}) {
        const isSent = options.isSent ?? msg.sender_id === currentUser.id;
        const sender = msg.sender || options.sender || {};
        const senderName = sender.full_name || options.senderName || 'Unknown';
        const senderRole = sender.job_role || options.senderRole || '';
        const isUnread = !isSent && !msg.read_at;
        const timeStr = formatTimeOnly(msg.created_at || new Date());
        const contentHtml = msg.audio_url ?
          renderVoiceNote(msg.audio_url, msg.id) :
          `<div class="dm-msg-text">${escapeHtml(msg.content)}</div>`;
        const deleteBtn = (isSent || isCEO) ?
          `<button class="dm-delete-btn" title="Delete message" data-id="${msg.id}">Delete</button>` :
          '';
        const seenHtml = isSent && msg.read_at ?
          `<div class="dm-seen-indicator">Seen ${formatTimeOnly(msg.read_at)}</div>` :
          '';
        const statusHtml = isSent ?
          `<span class="dm-msg-status">${msg.read_at ? 'Seen' : 'Sent'}</span>` :
          '';

        let avatarHtml = '';
        if (!isSent) {
          if (sender.avatar_url) {
            avatarHtml =
              `<img src="${escapeHtml(sender.avatar_url)}" class="avatar" alt="${escapeHtml(senderName)}" data-user-id="${sender.id || msg.sender_id}" data-user-name="${escapeHtml(senderName)}" data-user-role="${escapeHtml(senderRole)}">`;
          } else {
            avatarHtml =
              `<div class="avatar" style="background-color:${stringToColor(senderName)};" data-user-id="${sender.id || msg.sender_id}" data-user-name="${escapeHtml(senderName)}" data-user-role="${escapeHtml(senderRole)}">${getInitials(senderName)}</div>`;
          }
        }

        return `
          <div class="dm-msg-row ${isSent ? 'sent' : 'received'} ${isUnread ? 'unread' : ''}" data-message-id="${msg.id}" data-created-at="${msg.created_at}" data-sender-id="${msg.sender_id}">
            ${avatarHtml}
            <div class="dm-msg ${isSent ? 'sent' : 'received'}">
              ${contentHtml}
              <div class="dm-msg-meta">
                <span>${timeStr}</span>
                ${statusHtml}
              </div>
              ${seenHtml}
              ${deleteBtn}
            </div>
          </div>
        `;
      }

      function attachMessageInteractions(root) {
        if (!root) root = document;
        root.querySelectorAll('.dm-msg-row').forEach(row => row.addEventListener('contextmenu', onRightClick));
        root.querySelectorAll('.dm-delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const messageId = btn.dataset.id;
            if (confirm('Delete this message?')) await deletePrivateMessage(messageId);
          });
        });
        root.querySelectorAll('.dm-msg-row .avatar, .dm-msg-row .avatar img').forEach(el => el.addEventListener(
          'click', onAvatarClick));
        root.querySelectorAll('.dm-voice-note').forEach(setupVoiceNoteControl);
      }

      function appendRenderedMessage(messagesDiv, msg, options = {}) {
        const emptyState = messagesDiv.querySelector('.dm-empty-state');
        if (emptyState) emptyState.remove();
        messagesDiv.insertAdjacentHTML('beforeend', renderMessageBubble(msg, options));
        const newRow = messagesDiv.lastElementChild;
        attachMessageInteractions(newRow);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return newRow;
      }

      function setupVoiceNoteControl(note) {
        if (note.dataset.ready === 'true') return;
        note.dataset.ready = 'true';
        const audio = new Audio(note.dataset.audioUrl);
        const button = note.querySelector('.dm-audio-btn');
        const duration = note.querySelector('.dm-audio-duration');
        const progress = note.querySelector('.dm-audio-progress span');

        audio.addEventListener('loadedmetadata', () => {
          duration.textContent = formatAudioTime(audio.duration);
        });
        audio.addEventListener('timeupdate', () => {
          const percent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
          progress.style.width = `${percent}%`;
          duration.textContent = formatAudioTime(audio.duration ? audio.duration - audio.currentTime :
            audio.currentTime);
        });
        audio.addEventListener('ended', () => {
          button.textContent = 'Play';
          progress.style.width = '0%';
          duration.textContent = formatAudioTime(audio.duration);
        });
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          document.querySelectorAll('.dm-voice-note').forEach(other => {
            if (other !== note && other._audio) {
              other._audio.pause();
              other.querySelector('.dm-audio-btn').textContent = 'Play';
            }
          });
          if (audio.paused) {
            audio.play();
            button.textContent = 'Pause';
          } else {
            audio.pause();
            button.textContent = 'Play';
          }
        });
        note._audio = audio;
      }

      function showToast(text) {
        toast.textContent = text;
        toast.style.display = 'block';
        toast.classList.remove('hide');
        setTimeout(() => {
          toast.classList.add('hide');
          setTimeout(() => toast.style.display = 'none', 300);
        }, 3000);
      }

      function maybeAppendDateSeparator(prevDate, currentDate) {
        const currDay = new Date(currentDate).toDateString();
        if (!prevDate) {
          return `<div class="dm-date-separator"><span>${formatDateHeader(currentDate)}</span></div>`;
        }
        const prevDay = new Date(prevDate).toDateString();
        if (prevDay !== currDay) {
          return `<div class="dm-date-separator"><span>${formatDateHeader(currentDate)}</span></div>`;
        }
        return '';
      }

      // ─── PRESENCE ───
      async function setupPresence() {
        if (!currentUser) return;
        presenceChannel = supabase.channel('online-users', { config: { presence: { key: currentUser.id } } });
        presenceChannel
          .on('presence', { event: 'sync' }, () => {
            const state = presenceChannel.presenceState();
            onlineUsers.clear();
            Object.values(state).forEach(presences => {
              presences.forEach(p => {
                if (p.userId !== currentUser.id) onlineUsers.set(p.userId, { name: p.name,
                  role: p.role });
              });
            });
            document.getElementById('onlineCount').innerHTML = `${onlineUsers.size + 1} online`;
            document.querySelectorAll('.dm-conversation-item').forEach(item => {
              const uid = item.dataset.userId;
              const dot = item.querySelector('.status-dot');
              if (dot) {
                if (onlineUsers.has(uid)) dot.classList.add('online');
                else dot.classList.remove('online');
              }
            });
          })
          .on('presence', { event: 'join' }, ({ key, newPresences }) => {
            newPresences.forEach(p => {
              if (p.userId !== currentUser.id) onlineUsers.set(p.userId, { name: p.name,
                role: p.role });
            });
            document.getElementById('onlineCount').innerHTML = `${onlineUsers.size + 1} online`;
          })
          .on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
            leftPresences.forEach(p => onlineUsers.delete(p.userId));
            document.getElementById('onlineCount').innerHTML = `${onlineUsers.size + 1} online`;
          })
          .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
              await presenceChannel.track({ userId: currentUser.id, name: currentUserFullName,
                role: currentRole, online_at: new Date().toISOString() });
            }
          });
      }

      // ─── UNREAD BADGE ───
      function updateDMBadge() {
        const total = Object.values(dmUnreadBySender).reduce((a, b) => a + b, 0);
        const dmBadge = document.getElementById('dmUnreadBadge');
        if (total > 0) { dmBadge.style.display = 'inline-block';
          dmBadge.textContent = total; } else { dmBadge.style.display = 'none'; }
      }

      // ─── MARK DM AS READ ───
      async function markDirectMessageAsRead(messageId, senderId) {
        try {
          await supabase
            .from('private_messages')
            .update({ read_at: new Date().toISOString() })
            .eq('id', messageId)
            .eq('recipient_id', currentUser.id);
        } catch (err) { console.error('Mark DM read error:', err); }

        if (senderId && dmUnreadBySender[senderId]) {
          dmUnreadBySender[senderId] = Math.max(0, dmUnreadBySender[senderId] - 1);
          if (dmUnreadBySender[senderId] === 0) delete dmUnreadBySender[senderId];
          updateDMBadge();
          const targetItem = document.querySelector(`.dm-conversation-item[data-user-id="${senderId}"]`);
          if (targetItem) {
            const badge = targetItem.querySelector('.dm-unread-badge');
            const newCount = dmUnreadBySender[senderId] || 0;
            if (newCount > 0) badge.textContent = newCount;
            else if (badge) {
              badge.remove();
              // Add seen indicator when all messages from this sender are read
              if (!targetItem.querySelector('.dm-conv-seen')) {
                targetItem.insertAdjacentHTML('beforeend', '<span class="dm-conv-seen"><i class="fas fa-check-double"></i></span>');
              }
            }
          }
        }
        const msgRow = document.querySelector(`.dm-msg-row[data-message-id="${messageId}"]`);
        if (msgRow) {
          msgRow.classList.remove('unread');
          const statusEl = msgRow.querySelector('.dm-msg-status');
          if (statusEl) statusEl.textContent = 'Seen';
          if (!msgRow.querySelector('.dm-seen-indicator')) {
            const seenDiv = document.createElement('div');
            seenDiv.className = 'dm-seen-indicator';
            seenDiv.textContent = `Seen ${formatTimeOnly(new Date())}`;
            msgRow.querySelector('.dm-msg').appendChild(seenDiv);
          }
        }
      }

      // ─── OBSERVER FOR AUTO-MARK READ ───
      function setupDmObserver() {
        if (dmObserver) dmObserver.disconnect();
        dmObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const row = entry.target;
              const messageId = row.dataset.messageId;
              const senderId = row.dataset.senderId;
              if (messageId && senderId && row.classList.contains('received') && row.classList
                .contains('unread')) {
                markDirectMessageAsRead(messageId, senderId);
              }
            }
          });
        }, { threshold: 0.5 });
        document.querySelectorAll('.dm-msg-row.received.unread').forEach(row => dmObserver.observe(row));
      }

      // ─── MOBILE CHAT TOGGLE ───
      function setDmMobileChatOpen(isOpen) {
        if (window.innerWidth > 768) return;
        const layout = document.querySelector('.dm-layout');
        const list = document.querySelector('.dm-conversations-list');
        const chatArea = document.querySelector('.dm-chat-area');
        const backBtn = document.querySelector('.dm-back-btn');

        if (isOpen) {
          layout.classList.add('chat-open');
          list.style.display = 'none'; // Force layout to only show chatArea
          layout.style.transform = 'translateX(0)'; // Don't slide if list is hidden
          chatArea.style.display = 'flex';
          chatArea.style.visibility = 'visible';
          backBtn.style.display = 'block';
          if (outerHeader && window.innerWidth <= 768) outerHeader.style.display = 'none';
        } else {
          layout.classList.remove('chat-open');
          list.style.display = 'flex';
          chatArea.style.display = 'none';
          backBtn.style.display = 'none';
          if (outerHeader && window.innerWidth <= 768) outerHeader.style.display = 'flex';
        }
      }

          const { data: allProfiles, error: profilesError } = await supabase
            .from('profiles')
            .select('id, full_name, job_role')
            .neq('id', currentUser.id);
          if (profilesError) throw profilesError;

          const { data: allMessages } = await supabase
            .from('private_messages')
            .select('sender_id, recipient_id, created_at')
            .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`);

          const lastInteraction = {};
          if (allMessages) {
             for (const msg of allMessages) {
                const otherId = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
                const time = new Date(msg.created_at).getTime();
                if (!lastInteraction[otherId] || time > lastInteraction[otherId]) {
                   lastInteraction[otherId] = time;
                }
             }
          }

          allProfiles.sort((a, b) => {
             const timeA = lastInteraction[a.id] || 0;
             const timeB = lastInteraction[b.id] || 0;
             return timeB - timeA;
          });

          const unreadCounts = {};
          const { data: unreadRows, error: unreadError } = await supabase
            .from('private_messages')
            .select('sender_id')
            .eq('recipient_id', currentUser.id)
            .is('read_at', null);
          if (unreadError) console.warn('Unable to load unread counts:', unreadError);
          for (const row of unreadRows || []) {
            unreadCounts[row.sender_id] = (unreadCounts[row.sender_id] || 0) + 1;
          }
          dmUnreadBySender = unreadCounts;
          updateDMBadge();

          const conversationsHtml = allProfiles.map(profile => {
            const unread = unreadCounts[profile.id] || 0;
            const unreadBadge = unread > 0 ? `<span class="dm-unread-badge">${unread}</span>` : '';
            const seenIndicator = unread === 0 ? `<span class="dm-conv-seen"><i class="fas fa-check-double"></i></span>` : '';
            const onlineClass = onlineUsers.has(profile.id) ? 'online' : '';
            return `
              <div class="dm-conversation-item" data-user-id="${profile.id}" data-user-name="${escapeHtml(profile.full_name)}" data-user-role="${escapeHtml(profile.job_role)}">
                <span class="status-dot ${onlineClass}"></span>
                <div class="dm-conv-content">
                  <div class="dm-conv-name">${escapeHtml(profile.full_name)}</div>
                  <div class="dm-conv-role">${escapeHtml(profile.job_role)}</div>
                </div>

                ${seenIndicator}
              </div>

          area.innerHTML = `
            <div class="dm-layout">
              <div class="dm-conversations-list" id="dmConversationsList">
<div class="dm-list-header">
  <button class="dm-icon-btn dm-list-hamburger" id="mobileNavToggleList" title="Menu">☰</button>
  <span>All Members</span>
</div>
                ${conversationsHtml}
              </div>
              <div class="dm-chat-area" id="dmChatArea" style="display:none;">
                <div class="dm-chat-header">
                  <div class="dm-chat-peer">
                    <button class="dm-back-btn dm-icon-btn" id="dmBackBtn" title="Back">&lt;</button>
                    <div id="dmPeerAvatar" class="avatar" style="display:none;"></div>
                    <div class="dm-peer-copy">
                      <span class="dm-chat-title">Select a conversation</span>
                      <span class="dm-chat-subtitle">Messages and calls stay private here</span>
                    </div>
                  </div>
                  <div class="dm-chat-actions">
                    <button class="dm-icon-btn" id="dmHeaderVoiceCallBtn" title="Voice call" disabled>Call</button>
                    <button class="dm-icon-btn" id="dmHeaderVideoCallBtn" title="Video call" disabled>Video</button>
                  </div>
                </div>
                <div id="dmChatMessages" class="dm-chat-messages"><div class="dm-empty-state">Pick a member to start a direct conversation.</div></div>
                <div id="dmTypingContainer" class="typing-container" style="display:none;">
                  <div class="typing-indicator">
                    <span></span><span></span><span></span>
                    <span class="typing-text" id="dmTypingText">Someone is typing...</span>
                  </div>
                </div>
                <div class="dm-chat-input">
                  <div class="dm-composer-tools">
                    <button class="voice-btn" id="dmVoiceNoteBtn" title="Record voice note">Mic</button>
                  </div>
                  <div class="dm-input-wrap">
                    <input type="text" id="dmChatInput" placeholder="Message">
                  </div>
                  <button id="dmChatSendBtn">Send</button>
                  <span id="dmRecordingTimer" class="recording-timer" style="display:none;">0:00</span>
                </div>
              </div>
            </div>
          `;

          // ── conversation clicks ──
          document.querySelectorAll('.dm-conversation-item').forEach(item => {
            item.addEventListener('click', async () => {
              const userId = item.dataset.userId;
              const userName = item.dataset.userName;
              const userRole = item.dataset.userRole;
              await openPrivateChat(userId, { full_name: userName, job_role: userRole });
              document.querySelectorAll('.dm-conversation-item').forEach(i => i.classList.remove(
                'active'));
              item.classList.add('active');
              const badge = item.querySelector('.dm-unread-badge');
              if (badge) {
                badge.remove();
                delete dmUnreadBySender[userId];
                updateDMBadge();
                // Add seen indicator when unread badge is removed
                if (!item.querySelector('.dm-conv-seen')) {
                  item.insertAdjacentHTML('beforeend', '<span class="dm-conv-seen"><i class="fas fa-check-double"></i></span>');
                }
                // Mark messages from this user as read in the DB immediately
                try {
                  await supabase
                    .from('private_messages')
                    .update({ read_at: new Date().toISOString() })
                    .eq('sender_id', userId)
                    .eq('recipient_id', currentUser.id)
                    .is('read_at', null);
                } catch (err) { console.error('Error marking as read on click', err); }
              }
              if (window.innerWidth <= 768) {
                setDmMobileChatOpen(true);
              }

          document.getElementById('dmBackBtn').addEventListener('click', () => {
            setDmMobileChatOpen(false);

          // ── mobile nav ──
          const mobileNavToggle = document.getElementById('mobileNavToggle');

              mobileNavOverlay.setAttribute('aria-hidden', 'false');

          }
          const mobileNavToggleList = document.getElementById('mobileNavToggleList');
if (mobileNavToggleList && mobileNavOverlay) {
  mobileNavToggleList.addEventListener('click', () => {
    mobileNavOverlay.style.display = 'flex';
    mobileNavOverlay.setAttribute('aria-hidden', 'false');
  });
}
          if (mobileNavClose && mobileNavOverlay) {
            mobileNavClose.addEventListener('click', () => {
              mobileNavOverlay.style.display = 'none';
              mobileNavOverlay.setAttribute('aria-hidden', 'true');
            });
          }
          if (mobileNavOverlay) {
            mobileNavOverlay.addEventListener('click', event => {
              if (event.target === mobileNavOverlay) {
                mobileNavOverlay.style.display = 'none';
                mobileNavOverlay.setAttribute('aria-hidden', 'true');
              }
            });
          }
          if (mobileLogout) {
            mobileLogout.addEventListener('click', () => {

            });

          // ── call buttons ──
          document.getElementById('dmHeaderVoiceCallBtn').addEventListener('click', () => {
            if (!currentRecipientId) return;
            const activeItem = document.querySelector('.dm-conversation-item.active');
            const userName = activeItem ? activeItem.dataset.userName : 'User';
            startDMCall(currentRecipientId, userName, 'voice');
          });
          document.getElementById('dmHeaderVideoCallBtn').addEventListener('click', () => {
            if (!currentRecipientId) return;
            const activeItem = document.querySelector('.dm-conversation-item.active');
            const userName = activeItem ? activeItem.dataset.userName : 'User';
            startDMCall(currentRecipientId, userName, 'video');
          });

          // ── voice recording ──
          const dmVoiceBtn = document.getElementById('dmVoiceNoteBtn');
          const dmRecordingTimer = document.getElementById('dmRecordingTimer');
          dmVoiceBtn.addEventListener('click', async () => {
            if (dmIsRecording) {
              if (dmMediaRecorder) {
                dmMediaRecorder.stop();
                dmIsRecording = false;
                dmVoiceBtn.textContent = 'Mic';
                dmVoiceBtn.classList.remove('recording');
                dmRecordingTimer.style.display = 'none';
                if (dmRecordingTimerInterval) { clearInterval(dmRecordingTimerInterval);
                  dmRecordingTimerInterval = null; }
              }
            } else {
              try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                dmMediaRecorder = new MediaRecorder(stream);
                dmAudioChunks = [];
                dmMediaRecorder.ondataavailable = event => { dmAudioChunks.push(event.data); };
                dmMediaRecorder.onstop = async () => {
                  const audioBlob = new Blob(dmAudioChunks, { type: 'audio/webm' });
                  if (!currentRecipientId) { alert(
                      'No chat selected. Please open a conversation first.');
                    return; }
                  await sendPrivateVoiceNote(audioBlob, currentRecipientId);
                  stream.getTracks().forEach(track => track.stop());
                };
                dmMediaRecorder.start();
                dmIsRecording = true;
                dmVoiceBtn.classList.add('recording');
                dmVoiceBtn.textContent = 'Stop';
                dmRecordingStartTime = Date.now();

                  const elapsed = Math.floor((Date.now() -
                    dmRecordingStartTime) / 1000);

                  const seconds = elapsed % 60;
                  dmRecordingTimer.textContent =
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
              } catch (err) { console.error('DM mic error:', err);

      // ─── TYPING INDICATOR ───
      function updateDmTypingIndicator() {
        const container = document.getElementById('dmTypingContainer');
        const textEl = document.getElementById('dmTypingText');
        if (!container || !textEl) return;
        if (dmActiveTypers.size === 0) { container.style.display = 'none'; return; }
        const names = Array.from(dmActiveTypers);
        let text = '';
        if (names.length === 1) text = `${names[0]} is typing...`;
        else if (names.length === 2) text = `${names[0]} and ${names[1]} are typing...`;
        else text = `${names.length} people are typing...`;
        textEl.textContent = text;
        container.style.display = 'block';
      }

      // ─── OPEN PRIVATE CHAT ───
      async function openPrivateChat(otherUserId, otherProfile) {
        currentRecipientId = otherUserId;
        if (dmTypingSubscription) dmTypingSubscription.unsubscribe();
        dmActiveTypers.clear();

        const chatArea = document.getElementById('dmChatArea');
        const headerTitle = document.querySelector('.dm-chat-title');
        const headerSubtitle = document.querySelector('.dm-chat-subtitle');
        const peerAvatar = document.getElementById('dmPeerAvatar');
        const messagesDiv = document.getElementById('dmChatMessages');
        const input = document.getElementById('dmChatInput');
        const sendBtn = document.getElementById('dmChatSendBtn');
        const voiceCallBtn = document.getElementById('dmHeaderVoiceCallBtn');
        const videoCallBtn = document.getElementById('dmHeaderVideoCallBtn');

        if (!chatArea || !headerTitle || !headerSubtitle || !peerAvatar || !messagesDiv || !input || !sendBtn) {
          console.error('DM chat DOM elements missing');
          return;
        }

        const safeName = otherProfile.full_name || 'Unknown';
        const safeRole = otherProfile.job_role || 'Member';
        headerTitle.textContent = safeName;
        headerSubtitle.textContent = `${safeRole} • ${onlineUsers.has(otherUserId) ? 'online' : 'offline'}`;
        peerAvatar.style.display = 'flex';
        peerAvatar.style.backgroundColor = stringToColor(safeName);
        peerAvatar.textContent = getInitials(safeName);
        voiceCallBtn.disabled = false;
        videoCallBtn.disabled = false;
        chatArea.style.display = 'flex'; // ensure visible
        input.focus();
        messagesDiv.innerHTML = '<div class="dm-empty-state">Loading conversation...</div>';

        try {
          let { data, error } = await supabase
            .from('private_messages')
            .select(`*, sender:profiles!sender_id (id, full_name, job_role, avatar_url)`)
            .or(
              `and(sender_id.eq.${currentUser.id},recipient_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},recipient_id.eq.${currentUser.id})`
              )
            .order('created_at', { ascending: true });

          if (error && error.message && error.message.includes('Could not find a relationship')) {
            console.warn('Join failed, falling back to selected profile data:', error.message);
            const { data: msgs, error: msgsError } = await supabase
              .from('private_messages')
              .select('*')
              .or(
                `and(sender_id.eq.${currentUser.id},recipient_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},recipient_id.eq.${currentUser.id})`
                )
              .order('created_at', { ascending: true });
            if (msgsError) throw msgsError;
            data = (msgs || []).map((msg) => ({
              ...msg,
              sender: msg.sender_id === currentUser.id ?
                { id: currentUser.id, full_name: currentUserFullName, job_role: currentRole } :
                { id: otherUserId, full_name: safeName, job_role: safeRole }
            }));
          } else if (error) { throw error; }

          let html = '';
          let lastDate = null;
          for (const msg of data || []) {
            const dateHeader = maybeAppendDateSeparator(lastDate, msg.created_at);
            if (dateHeader) html += dateHeader;
            lastDate = msg.created_at;
            html += renderMessageBubble(msg, {
              isSent: msg.sender_id === currentUser.id,
              sender: msg.sender || { id: otherUserId, full_name: safeName, job_role: safeRole }
            });
          }
          messagesDiv.innerHTML = html ||
            '<div class="dm-empty-state">No messages yet. Send the first one.</div>';
          attachMessageInteractions(messagesDiv);
          setupDmObserver();

          sendBtn.onclick = () => sendPrivateMessage(otherUserId);
          input.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              sendPrivateMessage(otherUserId);
            }
          };

          const typingChannel =
            `typing-dm-${Math.min(currentUser.id, otherUserId)}-${Math.max(currentUser.id, otherUserId)}`;
          dmTypingSubscription = supabase
            .channel(typingChannel)
            .on('broadcast', { event: 'typing' }, (payload) => {
              const { userId, userName } = payload.payload;
              if (userId === currentUser.id) return;
              if (dmTypingTimeouts[userId]) clearTimeout(dmTypingTimeouts[userId]);
              dmActiveTypers.add(userName);
              updateDmTypingIndicator();
              dmTypingTimeouts[userId] = setTimeout(() => {
                dmActiveTypers.delete(userName);
                updateDmTypingIndicator();
                delete dmTypingTimeouts[userId];
              }, 3000);
            })
            .subscribe();

          let dmTypingTimeout;
          input.oninput = () => {
            if (dmTypingTimeout) clearTimeout(dmTypingTimeout);
            supabase.channel(typingChannel).send({
              type: 'broadcast',
              event: 'typing',
              payload: { userId: currentUser.id, userName: currentUserFullName,
                timestamp: Date.now() }
            });
            dmTypingTimeout = setTimeout(() => {}, 2000);
          };

          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          input.value = '';
        } catch (err) {
          console.error('Load private chat error:', err);
          messagesDiv.innerHTML = '<div style="color:#ff628c;padding:1rem;">Failed to load messages.</div>';
        }
      }

      // ─── SEND PRIVATE MESSAGE ───
      async function sendPrivateMessage(otherUserId) {
        const input = document.getElementById('dmChatInput');
        const content = input.value.trim();
        if (!content) return;
        input.value = '';

        try {
          const { data, error } = await supabase
            .from('private_messages')
            .insert({ sender_id: currentUser.id, recipient_id: otherUserId, content: content })
            .select()
            .single();
          if (error) throw error;
          const messagesDiv = document.getElementById('dmChatMessages');
          appendRenderedMessage(messagesDiv, data, { isSent: true });
        } catch (err) { console.error('Send private message error:', err);
          alert('Failed to send: ' + err.message); }
      }

      // ─── SEND PRIVATE VOICE NOTE ───
      async function sendPrivateVoiceNote(audioBlob, otherUserId) {
        if (!otherUserId) { alert('Recipient not specified.'); return; }
        const fileName = `${currentUser.id}/${Date.now()}.webm`;
        const { error: uploadError } = await supabase.storage
          .from('voice_notes')
          .upload(fileName, audioBlob, { contentType: 'audio/webm' });
        if (uploadError) { console.error('Upload error:', uploadError);
          alert('Failed to upload voice note: ' + uploadError.message); return; }

        const { data: urlData } = supabase.storage.from('voice_notes').getPublicUrl(fileName);
        const audioUrl = urlData.publicUrl;

        try {
          const { data, error } = await supabase
            .from('private_messages')
            .insert({ sender_id: currentUser.id, recipient_id: otherUserId, content: '',
              audio_url: audioUrl })
            .select()
            .single();
          if (error) throw error;
          const messagesDiv = document.getElementById('dmChatMessages');
          appendRenderedMessage(messagesDiv, data, { isSent: true });
        } catch (err) { console.error('Insert private voice note error:', err);
          alert('Failed to send voice note: ' + err.message); }
      }

      // ─── DELETE PRIVATE MESSAGE ───
      async function deletePrivateMessage(messageId) {
        try {
          let query = supabase.from('private_messages').delete().eq('id', messageId);
          if (!isCEO) query = query.eq('sender_id', currentUser.id);
          const { error } = await query;
          if (error) throw error;
          removePrivateMessageFromUI(messageId);
        } catch (err) { console.error('Delete DM error:', err);
          alert('Failed to delete message: ' + err.message); }
      }

      function removePrivateMessageFromUI(messageId) {
        const msgRow = document.querySelector(`.dm-msg-row[data-message-id="${messageId}"]`);
        if (!msgRow) return;
        if (msgRow.classList.contains('received') && msgRow.classList.contains('unread')) {
          const senderId = msgRow.dataset.senderId;
          if (senderId && dmUnreadBySender[senderId] > 0) {
            dmUnreadBySender[senderId]--;
            if (dmUnreadBySender[senderId] === 0) delete dmUnreadBySender[senderId];
          }
          updateDMBadge();
          const targetItem = document.querySelector(`.dm-conversation-item[data-user-id="${senderId}"]`);
          if (targetItem) {
            const badge = targetItem.querySelector('.dm-unread-badge');
            const newCount = dmUnreadBySender[senderId] || 0;
            if (newCount > 0) badge.textContent = newCount;
            else if (badge) badge.remove();
          }
        }
        if (dmObserver) dmObserver.unobserve(msgRow);
        msgRow.remove();
        const messagesDiv = document.getElementById('dmChatMessages');
        if (messagesDiv && messagesDiv.children.length === 0) {
          messagesDiv.innerHTML =
            '<div style="color:#9aa4bf;text-align:center;padding:2rem;">No messages yet. Say hello!</div>';
        }
      }

      // ─── RIGHT-CLICK READ RECEIPTS ───
      async function onRightClick(e) {
        e.preventDefault();
        const row = e.currentTarget;
        const messageId = row.dataset.messageId;
        modal.style.display = 'none';

        const { data: msg, error } = await supabase
          .from('private_messages')
          .select('sender_id, recipient_id, read_at, profiles!sender_id(full_name), profiles!recipient_id(full_name)')
          .eq('id', messageId)
          .single();
        if (error || !msg) { console.error('fetch DM readers error:', error); return; }

        const readerName = (msg.sender_id === currentUser.id) ? msg.profiles_recipient_id?.full_name : msg
          .profiles_sender_id?.full_name;
        const readTime = msg.read_at ? new Date(msg.read_at).toLocaleString('en-US', { month: 'short',
          day: 'numeric', hour: '2-digit', minute: '2-digit' }) : null;
        if (msg.read_at) {
          modal.innerHTML =
            `<h4>Read receipt</h4><p style="padding:0.5rem 0;">Seen by ${escapeHtml(readerName)} at ${readTime}</p>`;
        } else {
          modal.innerHTML = '<h4>Read receipt</h4><p style="padding:0.5rem 0;">Not seen yet.</p>';
        }
        modal.style.left = e.pageX + 10 + 'px';
        modal.style.top = e.pageY + 10 + 'px';
        modal.style.display = 'block';
        const hideModal = (ev) => { if (!modal.contains(ev.target)) { modal.style.display = 'none';
            document.removeEventListener('click', hideModal); } };
        setTimeout(() => document.addEventListener('click', hideModal), 0);
      }

      // ─── AVATAR CLICK (PROFILE MODAL) ───
      async function onAvatarClick(e) {
        e.stopPropagation();
        const avatar = e.currentTarget;
        const userId = avatar.dataset.userId;
        const userName = avatar.dataset.userName;
        const userRole = avatar.dataset.userRole;

        const { data: profile, error } = await supabase

        modalRole.textContent = profile.job_role || userRole || '-';
        modalJoined.textContent = profile.created_at ? `Joined ${new Date(profile.created_at).toLocaleDateString()}` :
          '-';

          modalAvatar.src = profile.avatar_url;

          modalAvatarPlaceholder.style.display = 'flex';

        modalSendDM.dataset.userName = profile.full_name || userName;
