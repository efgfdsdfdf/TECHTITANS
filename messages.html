<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/titans_logo2.png">
  <title>TECH TITANS · Group Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    /* ... (same CSS as before, unchanged) ... */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: #0b0f17;
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    /* === SIDEBAR === */
    .sidebar {
      width: 260px;
      background: rgba(10, 16, 28, 0.95);
      backdrop-filter: blur(10px);
      border-right: 1px solid #1f2a44;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex-shrink: 0;
    }
    .logo {
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      padding-left: 1rem;
    }
    .logo span { color: #428cff; }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .nav a {
      color: #9aa4bf;
      text-decoration: none;
      padding: 0.9rem 1rem;
      border-radius: 1.2rem;
      transition: 0.2s;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      position: relative;
    }
    .nav a:hover,
    .nav a.active {
      background: #1f2a44;
      color: white;
    }
    .nav a.active {
      background: #428cff;
      color: white;
      box-shadow: 0 8px 16px -8px #428cff;
    }
    .sidebar-unread {
      background: #ff4d4d;
      color: white;
      border-radius: 2rem;
      padding: 0.15rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: auto;
      line-height: 1.3;
      box-shadow: 0 0 0 1px #0b0f17;
    }
    .logout-btn {
      margin-top: auto;
      background: transparent;
      border: 1px solid #2f3a5a;
      color: #ff9f9f;
      padding: 0.9rem;
      border-radius: 1.2rem;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }
    .logout-btn:hover {
      background: #ff4d4d20;
      border-color: #ff4d4d;
    }

    /* === MAIN CHAT AREA === */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }
    .chat-panel {
      flex: 1;
      background: #131c30;
      border-radius: 2rem;
      border: 1px solid #263154;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    /* === CHAT HEADER (topbar) === */
    .chat-header {
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid #263154;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
      background: #131c30;
      z-index: 5;
      min-height: 3.5rem;
      overflow: visible;
    }
    .chat-header .group-name-wrapper {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      flex: 0 0 auto;
    }
    .chat-header .group-name-wrapper .group-icon {
      font-size: 1.1rem;
      line-height: 1;
    }
    .chat-header .group-name-wrapper #groupTitle {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .chat-header .role-tag,
    .chat-header .online-count {
      display: none !important;
    }

    /* Group switcher button – visible to everyone */
    .group-switcher-btn {
      background: #1f2a44;
      color: #fff;
      border: 1px solid #2f3a5a;
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1 1 auto;
      min-width: 0;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }
    .group-switcher-btn .unread-badge-tab {
      margin-left: auto;
      background: #ff4d4d;
      color: white;
      border-radius: 2rem;
      padding: 0.05rem 0.4rem;
      font-size: 0.6rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Group switcher sheet – bottom sheet */
    .group-switcher-sheet {
      position: fixed;
      inset: auto 0 0 0;
      background: #131c30;
      border-top: 1px solid #263154;
      border-radius: 1.2rem 1.2rem 0 0;
      padding: 1rem 1rem 2rem;
      z-index: 1500;
      max-height: 60vh;
      overflow-y: auto;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
      transform: translateY(100%);
      transition: transform 0.25s ease;
      display: none;
    }
    .group-switcher-sheet.open {
      display: block;
      transform: translateY(0);
    }
    .group-switcher-sheet .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.5rem 1rem 0.5rem;
      color: #9aa4bf;
      font-weight: 500;
      border-bottom: 1px solid #263154;
      margin-bottom: 0.5rem;
    }
    .group-switcher-sheet .close-sheet {
      background: none;
      border: none;
      color: #9aa4bf;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 0.5rem;
    }
    .group-switcher-sheet .option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      color: #e0e7ff;
      cursor: pointer;
      transition: background 0.15s;
    }
    .group-switcher-sheet .option:hover {
      background: #1f2a44;
    }
    .group-switcher-sheet .option.active {
      background: #428cff;
      color: #fff;
    }
    .group-switcher-sheet .option .badge {
      background: #ff4d4d;
      color: white;
      border-radius: 2rem;
      padding: 0.05rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 600;
    }

    /* Ongoing call banner */
    .ongoing-call-banner {
      background: #1f2a44;
      border: 1px solid #428cff;
      border-radius: 2rem;
      padding: 0.15rem 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: #cfe1ff;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .ongoing-call-banner .caller-name { font-weight: 600; color: white; }
    .ongoing-call-banner button {
      background: #2ecc71;
      border: none;
      color: white;
      padding: 0.1rem 0.6rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.6rem;
      font-weight: 600;
    }
    .ongoing-call-banner button:hover { background: #27ae60; }
    .ongoing-call-banner .call-status {
      color: #8affb8;
      font-size: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .ongoing-call-banner .call-status::before {
      content: '●';
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .chat-header .call-btn {
      background: #2f3a5a;
      border: none;
      color: white;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .chat-header .call-btn:hover { background: #428cff; }

    /* === MESSAGES AREA === */
    .messages-area {
      flex: 1;
      padding: 1rem 1.5rem 0.5rem 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      scroll-behavior: smooth;
      min-height: 0;
    }

    /* Date separator – sticky at top */
    .date-separator {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 0.3rem 0;
      margin: 0.1rem 0;
      background: transparent;
      pointer-events: none;
    }
    .date-separator span {
      background: rgba(19, 28, 48, 0.85);
      backdrop-filter: blur(4px);
      padding: 0.1rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: #b0c8ff;
      border: 1px solid #2a3a60;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    /* === GROUPS LIST VIEW (CEO "All") === */
    .groups-list-container {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding: 0.5rem 0 1rem 0;
      width: 100%;
    }
    .groups-list-container .section-title {
      color: #9aa4bf;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.5rem 0.2rem;
      border-bottom: 1px solid #1f2a44;
      margin-bottom: 0.5rem;
    }
    .group-card {
      background: #19233a;
      color: #cfe1ff;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid #263154;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .group-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border-color: #428cff;
    }
    .group-card .group-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
      flex: 1;
    }
    .group-card .group-info .group-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #428cff, #6a4cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: white;
      flex-shrink: 0;
    }
    .group-card .group-info .group-name {
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group-card .group-info .group-preview {
      font-size: 0.8rem;
      color: #9aa4bf;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .group-card .group-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-shrink: 0;
    }
    .group-card .group-meta .unread-count {
      background: #ff4d4d;
      color: white;
      border-radius: 2rem;
      padding: 0.1rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .group-card .group-meta .last-time {
      font-size: 0.65rem;
      color: #6a7a9a;
      white-space: nowrap;
    }
    .group-card .group-meta .arrow {
      color: #428cff;
      font-size: 0.9rem;
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.2s;
    }
    .group-card:hover .group-meta .arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    /* === MESSAGE ROWS === */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      cursor: pointer;
    }
    .message-row.sent { justify-content: flex-end; }
    .message-row.unread .message { border-left: 4px solid #428cff; }
    .message-row.sent.unread .message {
      border-left: 4px solid #428cff;
      border-radius: 1.5rem 1.5rem 0.2rem 1.5rem;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #428cff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.1s;
      object-fit: cover;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .avatar:hover { transform: scale(1.05); }

    .message-bubble {
      max-width: 70%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .sender-name {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.1rem;
      color: #9aa4bf;
      padding-left: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .role-badge {
      background: #2a3a60;
      color: #b0c8ff;
      font-size: 0.6rem;
      padding: 0.05rem 0.4rem;
      border-radius: 1rem;
      font-weight: 400;
    }
    .message {
      padding: 0.6rem 1rem;
      border-radius: 1.5rem;
      word-break: break-word;
      line-height: 1.4;
      position: relative;
      transition: border-color 0.2s;
    }
    .message.sent {
      background: #428cff;
      color: white;
      border-bottom-right-radius: 0.2rem;
    }
    .message.received {
      background: #1f2a44;
      color: #e0e7ff;
      border-bottom-left-radius: 0.2rem;
    }
    .message small {
      display: block;
      font-size: 0.6rem;
      opacity: 0.7;
      margin-top: 0.15rem;
      text-align: right;
      white-space: nowrap;
    }
    .message audio {
      max-width: 180px;
      height: 30px;
      margin-top: 0.2rem;
      border-radius: 1rem;
    }
    .message.sent audio { filter: invert(0.1); }

    .seen-indicator {
      font-size: 0.6rem;
      color: #9aa4bf;
      margin-top: 0.1rem;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.2rem;
    }
    .seen-indicator .double-tick { font-size: 0.8rem; line-height: 1; }

    /* Message actions – always visible, faded */
    .message-actions {
      display: flex !important;
      opacity: 0.3;
      transition: opacity 0.15s;
      gap: 0.4rem;
      justify-content: flex-end;
      margin-top: 0.1rem;
    }
    .message-actions:hover,
    .message-row:active .message-actions,
    .message-row.selected .message-actions {
      opacity: 1;
    }
    .message-actions button {
      background: transparent;
      border: none;
      color: white;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0.7;
      transition: 0.2s;
      padding: 0.1rem 0.3rem;
    }
    .message-actions button:hover { opacity: 1; transform: scale(1.1); }

    .message-row.sent .message-bubble { align-items: flex-end; }
    .message-row.sent .avatar { display: none; }

    .edit-input {
      width: 100%;
      background: #0f172f;
      border: 1px solid #428cff;
      border-radius: 1.5rem;
      padding: 0.4rem 0.9rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .edit-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.2rem;
      justify-content: flex-end;
    }
    .edit-actions button {
      background: #1f2a44;
      border: none;
      color: white;
      padding: 0.15rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .edit-actions button.save-btn { background: #428cff; }

    /* Read receipts modal */
    .read-receipts-modal {
      position: absolute;
      background: #1f2a44;
      border: 1px solid #428cff;
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      color: white;
      font-size: 0.9rem;
      z-index: 1000;
      box-shadow: 0 12px 28px rgba(0,0,0,0.7);
      min-width: 260px;
      max-width: 320px;
      backdrop-filter: blur(4px);
    }
    .read-receipts-modal h4 {
      margin-bottom: 0.5rem;
      color: #b0c8ff;
      font-weight: 500;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.3rem;
    }
    .read-receipts-modal ul {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }
    .read-receipts-modal li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      border-bottom: 1px solid #263154;
      font-size: 0.8rem;
    }
    .read-receipts-modal li:last-child { border-bottom: none; }
    .reader-name { color: white; font-weight: 500; }
    .reader-time { color: #9aa4bf; font-size: 0.65rem; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.7rem;
      background: #1f2a44;
      border-radius: 2rem;
      width: fit-content;
      margin-bottom: 0.2rem;
    }
    .typing-indicator span {
      width: 0.4rem;
      height: 0.4rem;
      background: #9aa4bf;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-0.5rem); }
    }
    .typing-container {
      margin-top: 0.2rem;
      margin-bottom: 0.2rem;
      padding: 0 1.5rem;
    }
    .typing-text {
      color: #9aa4bf;
      font-size: 0.75rem;
      margin-left: 0.5rem;
    }

    /* === CHAT INPUT AREA – FIXED AT BOTTOM === */
    .chat-input-area {
      display: flex;
      padding: 0.8rem 1.2rem;
      border-top: 1px solid #263154;
      gap: 0.5rem;
      flex-shrink: 0;
      background: #131c30;
      z-index: 5;
      position: relative;
      bottom: 0;
      align-items: center;
      margin-top: auto;
    }
    .chat-input-area input {
      flex: 1;
      background: #0f172f;
      border: 1px solid #263154;
      border-radius: 2rem;
      padding: 0.6rem 1rem;
      color: white;
      outline: none;
      transition: border 0.2s;
      font-size: 0.9rem;
      min-width: 0;
    }
    .chat-input-area input:focus { border-color: #428cff; }
    .chat-input-area input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .chat-input-area button {
      background: #428cff;
      border: none;
      color: white;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .chat-input-area button:hover { background: #5f9eff; }
    .chat-input-area button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .voice-btn {
      background: #2f3a5a;
      border: none;
      color: white;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .voice-btn.recording {
      background: #ff4d4d;
      animation: pulse 1s infinite;
    }
    .voice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .recording-timer {
      color: #ff4d4d;
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 0.2rem;
      flex-shrink: 0;
    }

    /* === CALL MODAL === */
    .call-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(6px);
    }
    .call-modal-content {
      width: 100%;
      height: 100%;
      background: #131c30;
      border-radius: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .call-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      padding: 0 0.5rem;
      flex-shrink: 0;
    }
    .call-modal-header h3 { font-size: 1.2rem; color: white; }
    .call-modal-close {
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      padding: 0 0.5rem;
    }
    .call-videos {
      flex: 1;
      display: grid;

    function formatDateHeader(date) {
      const now = new Date();
      const msgDate = new Date(date);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const msgDay = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
      if (msgDay.getTime() === today.getTime()) return 'Today';
      else if (msgDay.getTime() === yesterday.getTime()) return 'Yesterday';
      else return msgDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function formatTimeOnly(date) {
      return new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    function stringToColor(str) {
      let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash % 360); return `hsl(${hue}, 70%, 50%)`;
    }

    function getInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length-1].charAt(0)).toUpperCase();
    }

      }
    }

    function scheduleUnreadBorderRemoval(messageId) {
      if (unreadBorderTimeouts.has(messageId)) clearTimeout(unreadBorderTimeouts.get(messageId));
      const timeoutId = setTimeout(() => {
        const row = document.querySelector(`.message-row[data-message-id="${messageId}"]`);
        if (row) row.classList.remove('unread');
        unreadBorderTimeouts.delete(messageId);
      }, 30000);
      unreadBorderTimeouts.set(messageId, timeoutId);
    }

    async function markMessageAsRead(messageId) {
      if (readMessageIds.has(messageId)) return;
      try {
        const { error } = await supabase
          .from('message_reads')
          .insert({ message_id: messageId, user_id: currentUser.id })
          .single();
        if (error && error.code !== '23505') { console.error('mark read error:', error); return; }
        readMessageIds.add(messageId);
        const msgRow = document.querySelector(`.message-row[data-message-id="${messageId}"]`);
        if (msgRow) {
          if (currentUnreadCount > 0) currentUnreadCount--;
          await updateGlobalUnreadCount();
          updateUnreadBadges();
          updateSeenIndicator(messageId);
          scheduleUnreadBorderRemoval(messageId);
        }
      } catch (err) { console.error('markMessageAsRead error:', err); }
    }

    async function updateSeenIndicator(messageId) {
      const msgRow = document.querySelector(`.message-row.sent[data-message-id="${messageId}"]`);
      if (!msgRow) return;
      const { data } = await supabase
        .from('message_reads')
        .select('user_id, read_at, profiles!inner(full_name)')
        .eq('message_id', messageId);
      const count = data ? data.length : 0;
      let seenHtml = '';
      if (count > 0) {
        const firstReader = data[0]?.profiles?.full_name || 'Someone';
        seenHtml = `<div class="seen-indicator"><span class="double-tick">✓✓</span> ${firstReader}${count > 1 ? ` +${count-1}` : ''}</div>`;
      }
      const existing = msgRow.querySelector('.seen-indicator');
      if (existing) existing.remove();
      if (seenHtml) {
        const bubble = msgRow.querySelector('.message-bubble');
        if (bubble) bubble.insertAdjacentHTML('beforeend', seenHtml);
      }
    }

    function setupObserver() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const row = entry.target;
            const messageId = row.dataset.messageId;
            if (messageId && !readMessageIds.has(messageId) && row.classList.contains('unread')) {
              markMessageAsRead(messageId);
            }
          }
        });
      }, { threshold: 0.5 });
      document.querySelectorAll('.message-row.unread').forEach(row => observer.observe(row));
    }

    function renderMessageActions(messageId, currentContent, createdAt, senderId, hasAudio) {
      if (hasAudio) return '';
      const msgTime = new Date(createdAt).getTime();
      const now = Date.now();
      const age = now - msgTime;
      const canEdit = (isCEO || senderId === currentUser.id) && age < 60000;
      const canDelete = isCEO || senderId === currentUser.id;
      if (canEdit && age < 60000) {
        const timeLeft = 60000 - age;
        if (timeLeft > 0) {
          const timeoutId = setTimeout(() => {
            const editBtn = document.querySelector(`.edit-btn[data-id="${messageId}"]`);
            if (editBtn) editBtn.remove();
          }, timeLeft);
          editTimeouts.set(messageId, timeoutId);
        }
      }
      return `
        <div class="message-actions">
          ${canEdit ? `<button class="edit-btn" data-id="${messageId}" data-content="${escapeHtml(currentContent)}">✏️</button>` : ''}
          ${canDelete ? `<button class="delete-btn" data-id="${messageId}">🗑️</button>` : ''}
        </div>
      `;
    }

    function renderMessage(message, isSent, sender, messageRole, isUnread = false, seenCount = 0) {
      const senderName = sender?.full_name || 'Unknown';
      const avatarUrl = sender?.avatar_url;
      const avatarColor = stringToColor(senderName);
      const timeStr = formatTimeOnly(message.created_at);
      const unreadClass = isUnread ? 'unread' : '';
      let roleBadge = '';
      if (messageRole && (messageRole === 'CEO' || isCEO)) {
        roleBadge = `<span class="role-badge">${escapeHtml(messageRole)}</span>`;
      }
      let seenHtml = '';
      if (isSent && seenCount > 0) {
        seenHtml = `<div class="seen-indicator"><span class="double-tick">✓✓</span> Seen</div>`;
      }

      let contentHtml = '';
      if (message.audio_url) {
        contentHtml = `<audio controls src="${escapeHtml(message.audio_url)}"></audio>`;
      } else {
        contentHtml = escapeHtml(message.content);
      }

      let avatarHtml = '';
      if (!isSent) {
        if (avatarUrl) {
          avatarHtml = `<img src="${escapeHtml(avatarUrl)}" class="avatar" alt="${escapeHtml(senderName)}" data-user-id="${sender.id}" data-user-name="${escapeHtml(senderName)}" data-user-role="${escapeHtml(messageRole)}">`;
        } else {
          avatarHtml = `<div class="avatar" style="background-color: ${avatarColor};" data-user-id="${sender.id}" data-user-name="${escapeHtml(senderName)}" data-user-role="${escapeHtml(messageRole)}">${getInitials(senderName)}</div>`;
        }
      }

      if (isSent) {
        return `
          <div class="message-row sent ${unreadClass}" data-message-id="${message.id}" data-created-at="${message.created_at}" data-sender-id="${sender.id}">
            <div class="message-bubble">
              <div class="message sent">
                ${contentHtml}
                <small>${timeStr}</small>
              </div>
              ${renderMessageActions(message.id, message.content, message.created_at, sender.id, !!message.audio_url)}
              ${seenHtml}
            </div>
          </div>
        `;
      } else {
        return `
          <div class="message-row ${unreadClass}" data-message-id="${message.id}" data-created-at="${message.created_at}" data-sender-id="${sender.id}">
            ${avatarHtml}
            <div class="message-bubble">
              <div class="sender-name">
                ${escapeHtml(senderName)} ${roleBadge}
              </div>
              <div class="message received">
                ${contentHtml}
                <small>${timeStr}</small>
              </div>
            </div>
          </div>
        `;
      }
    }

    function maybeAppendDateSeparator(prevDate, currentDate) {
      if (!prevDate) return '';
      const prevDay = new Date(prevDate).toDateString();
      const currDay = new Date(currentDate).toDateString();
      if (prevDay !== currDay) {
        return `<div class="date-separator"><span>${formatDateHeader(currentDate)}</span></div>`;
      }
      return '';
    }

    // --- Load messages ---
    async function loadMessages() {
      try {
        // If "All" view, show group cards (for both CEO and regular)
        if (selectedGroupRole === null) {
          let roles;
          if (isCEO) {
            roles = availableRoles.length > 0 ? availableRoles : ['General'];
          } else {
            roles = ['General', currentRole];
          }
          // Ensure General is present
          if (!roles.includes('General')) roles.push('General');
          roles = [...new Set(roles)].sort();
          await renderGroupsList(roles);
          return;
        }

        // Specific group: load messages
        let query = supabase
          .from('group_messages')
          .select(`*, sender:profiles!sender_id (id, full_name, avatar_url)`)
          .eq('role', selectedGroupRole)
          .order('created_at', { ascending: true });

        const { data, error } = await query;
        if (error) throw error;

        const messageIds = data.map(m => m.id);
        let readSet = new Set();
        if (messageIds.length > 0) {
          const { data: reads, error: readError } = await supabase
            .from('message_reads')
            .select('message_id')
            .eq('user_id', currentUser.id)
            .in('message_id', messageIds);
          if (!readError) {
            readSet = new Set(reads.map(r => r.message_id));
          }
        }
        readMessageIds = readSet;

        const seenCounts = {};
        if (messageIds.length > 0) {
          const { data: readsAll } = await supabase
            .from('message_reads')
            .select('message_id')
            .in('message_id', messageIds);
          if (readsAll) {
            readsAll.forEach(r => { seenCounts[r.message_id] = (seenCounts[r.message_id] || 0) + 1; });
          }
        }

        let html = '';
        let lastDate = null;
        let firstUnreadMessageId = null;
        for (const msg of data) {
          const isSent = msg.sender_id === currentUser.id;
          const isUnread = !isSent && !readMessageIds.has(msg.id);
          if (isSent) readMessageIds.add(msg.id);

          html += maybeAppendDateSeparator(lastDate, msg.created_at);
          lastDate = msg.created_at;

          const seenCount = seenCounts[msg.id] || 0;
          html += renderMessage(msg, isSent, msg.sender, msg.role, isUnread, seenCount);

          if (isUnread && !firstUnreadMessageId) {
            firstUnreadMessageId = msg.id;
          }
        }

        const area = document.getElementById('messagesArea');
        area.innerHTML = html;

        currentUnreadCount = data.filter(msg => !readMessageIds.has(msg.id) && msg.sender_id !== currentUser.id).length;
        await updateGlobalUnreadCount();
        updateUnreadBadges();

        attachMessageHandlers();
        setupObserver();

        if (firstUnreadMessageId) {
          const targetRow = document.querySelector(`.message-row[data-message-id="${firstUnreadMessageId}"]`);
          if (targetRow) targetRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
          else area.scrollTop = area.scrollHeight;
        } else {
          area.scrollTop = area.scrollHeight;
        }
        removeNotificationButtons();
      } catch (err) {
        console.error('Load messages error:', err);
        document.getElementById('messagesArea').innerHTML = '<div style="color:#ff628c;text-align:center;padding:2rem;">Could not load messages.</div>';
      }
    }

    // --- Update Global Unread Count ---
    async function updateGlobalUnreadCount() {
      if (!currentUser) return;
      try {
        const { data: reads } = await supabase
          .from('message_reads')
          .select('message_id')
          .eq('user_id', currentUser.id);
        const readIds = new Set(reads.map(r => r.message_id));

        // Get all messages the user has access to: General + their role (or all for CEO)
        let query = supabase.from('group_messages').select('id, sender_id, role');
        if (!isCEO) {
          query = query.in('role', ['General', currentRole]);
        }

        const { data: msgs, error } = await query;
        if (error) throw error;

        let count = 0;
        msgs.forEach(m => {
          if (m.sender_id !== currentUser.id && !readIds.has(m.id)) {
            count++;
          }
        });
        totalUnreadCount = count;
        updateUnreadBadges();
      } catch (err) { console.error('updateGlobalUnreadCount error:', err); }
    }

    // --- RENDER GROUPS LIST (CEO "All" view) ---
    async function renderGroupsList(roles) {
      const area = document.getElementById('messagesArea');
      if (!area) return;

      // Ensure 'General' is in the list
      if (!roles.includes('General')) roles.push('General');
      roles = [...new Set(roles)].sort();

      if (!roles || roles.length === 0) {
        area.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;color:#6a7a9a;text-align:center;">
            <i class="fas fa-users" style="font-size:2.5rem;margin-bottom:1rem;opacity:0.3;"></i>
            <p style="font-size:0.95rem;">No groups available yet</p>
            <p style="font-size:0.75rem;margin-top:0.3rem;">Messages will appear here when groups are created</p>
          </div>
        `;
        return;
      }

      const { data: reads } = await supabase
        .from('message_reads')
        .select('message_id')
        .eq('user_id', currentUser.id);
      const readIds = new Set(reads.map(r => r.message_id));

      const { data: msgs } = await supabase
        .from('group_messages')
        .select('id, role, sender_id, content, audio_url, created_at')
        .order('created_at', { ascending: false });

      const roleData = {};
      roles.forEach(r => {
        roleData[r] = { unread: 0, lastMsg: null, lastTime: null };
      });

      if (msgs) {
        const seenRoles = new Set();
        msgs.forEach(m => {
          if (m.role && roleData[m.role]) {
            if (m.sender_id !== currentUser.id && !readIds.has(m.id)) {
              roleData[m.role].unread++;
            }
            if (!seenRoles.has(m.role)) {
              roleData[m.role].lastMsg = m.content || (m.audio_url ? '🎤 Voice note' : '');
              roleData[m.role].lastTime = m.created_at;
              seenRoles.add(m.role);
            }
          }
        });
      }

      let html = `<div class="groups-list-container">`;
      html += `<div class="section-title"><i class="fas fa-layer-group" style="margin-right:0.5rem;"></i>Your Groups (${roles.length})</div>`;

      roles.forEach(role => {
        const data = roleData[role] || { unread: 0, lastMsg: null, lastTime: null };
        const unreadBadge = data.unread > 0 ? `<span class="unread-count">${data.unread}</span>` : '';
        const timeStr = data.lastTime ? formatTimeOnly(data.lastTime) : '';
        const preview = data.lastMsg ? data.lastMsg.substring(0, 50) : 'No messages yet';
        const initial = role.charAt(0).toUpperCase();

        html += `
          <div class="group-card" data-role="${escapeHtml(role)}">
            <div class="group-info">
              <div class="group-avatar">${initial}</div>
              <div>
                <div class="group-name">${escapeHtml(role)}</div>
                <div class="group-preview">${escapeHtml(preview)}</div>
              </div>
            </div>
            <div class="group-meta">
              ${unreadBadge}
              ${timeStr ? `<span class="last-time">${timeStr}</span>` : ''}
              <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      area.innerHTML = html;

      document.querySelectorAll('.group-card').forEach(card => {
        card.addEventListener('click', async (e) => {
          const role = e.currentTarget.dataset.role;
          if (role) await switchGroup(role);
        });
      });

      // Input disabled in "All" view
      document.getElementById('messageInput').disabled = true;
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('voiceNoteBtn').disabled = true;
    }

    // --- Build group switcher (bottom sheet) – works for everyone ---
    async function buildGroupSwitcher() {
      let roles = [];

      if (isCEO) {
        // CEO: show all roles + General
        try {
          const { data: profiles, error } = await supabase
            .from('profiles')
            .select('job_role')
            .not('job_role', 'is', null);
          if (!error && profiles && profiles.length > 0) {
            roles = [...new Set(profiles.map(p => p.job_role))].sort();
          }
        } catch (e) {}

        if (roles.length === 0) {
          try {
            const { data: messages, error } = await supabase
              .from('group_messages')
              .select('role')
              .not('role', 'is', null);
            if (!error && messages) {
              roles = [...new Set(messages.map(m => m.role))].sort();
            }
          } catch (e) {}
        }

        if (!roles.includes('General')) roles.push('General');
        roles.sort();
        availableRoles = roles;

      } else {
        // Regular user: "All", General, and their role
        roles = ['General', currentRole];
        roles = [...new Set(roles)].sort();
      }

      if (roles.length === 0) {
        groupSwitcherBtn.style.display = 'none';
        return;
      }

      // Fetch unread counts for badges
      const { data: reads } = await supabase
        .from('message_reads')
        .select('message_id')
        .eq('user_id', currentUser.id);
      const readIds = new Set(reads.map(r => r.message_id));

      // For regular users, only count unreads in groups they have access to
      let query = supabase.from('group_messages').select('id, role, sender_id');
      if (!isCEO) {
        query = query.in('role', ['General', currentRole]);
      }
      const { data: msgs } = await query;

      const unreadCounts = {};
      let allUnread = 0;
      msgs.forEach(m => {
        if (m.sender_id !== currentUser.id && !readIds.has(m.id)) {
          unreadCounts[m.role] = (unreadCounts[m.role] || 0) + 1;
          allUnread++;
        }
      });

      switcherOptions.innerHTML = '';

      // "All" option (for both CEO and regular)
      const allOpt = document.createElement('div');
      const isAllActive = selectedGroupRole === null;
      allOpt.className = `option ${isAllActive ? 'active' : ''}`;
      allOpt.innerHTML = `All ${allUnread > 0 ? `<span class="badge">${allUnread}</span>` : ''}`;
      allOpt.dataset.role = '';
      allOpt.addEventListener('click', () => switchGroup(''));
      switcherOptions.appendChild(allOpt);

      // Individual groups
      roles.forEach(role => {
        const opt = document.createElement('div');
        const isActive = selectedGroupRole === role;
        opt.className = `option ${isActive ? 'active' : ''}`;
        const unread = unreadCounts[role] || 0;
        opt.innerHTML = `${role} ${unread > 0 ? `<span class="badge">${unread}</span>` : ''}`;
        opt.dataset.role = role;
        opt.addEventListener('click', () => switchGroup(role));
        switcherOptions.appendChild(opt);
      });

      updateSwitcherButton();
      groupSwitcherBtn.style.display = 'flex';

      // If no group selected, default to "All"
      if (selectedGroupRole === undefined || selectedGroupRole === null) {
        selectedGroupRole = null;
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('voiceNoteBtn').disabled = true;
        await loadMessages();
      } else {
        // Enable input for specific group
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('voiceNoteBtn').disabled = false;
      }

      updateSwitcherButton();
      updateGroupTitle();
    }

    // --- Switch group ---
    async function switchGroup(role) {
      const normalized = role === '' ? null : role;
      if (selectedGroupRole === normalized) return;
      selectedGroupRole = normalized;

      // Update active class in sheet
      document.querySelectorAll('.option').forEach(opt => {
        const r = opt.dataset.role === '' ? null : opt.dataset.role;
        opt.classList.toggle('active', r === selectedGroupRole);
      });

      // Enable/disable input
      if (selectedGroupRole === null) {
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('voiceNoteBtn').disabled = true;
      } else {
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('voiceNoteBtn').disabled = false;
      }

      updateGroupTitle();
      updateSwitcherButton();

      if (typingSubscription) typingSubscription.unsubscribe();
      setupTypingSubscription();
      await loadMessages();
      checkOngoingCall();
      setupGroupCallSubscription();

      switcherSheet.classList.remove('open');
      switcherSheet.style.display = 'none';
    }

    // --- Message handlers ---
    function attachMessageHandlers() {
      document.querySelectorAll('.message-row').forEach(row => {
        row.removeEventListener('click', onMessageRowClick);
        row.addEventListener('click', onMessageRowClick);
        row.removeEventListener('contextmenu', onRightClick);
        row.addEventListener('contextmenu', onRightClick);
      });
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.removeEventListener('click', handleEditClick);
        btn.addEventListener('click', handleEditClick);
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.removeEventListener('click', handleDeleteClick);
        btn.addEventListener('click', handleDeleteClick);
      });
      document.querySelectorAll('.avatar, .avatar img').forEach(avatar => {
        avatar.removeEventListener('click', onAvatarClick);
        avatar.addEventListener('click', onAvatarClick);
      });
      removeNotificationButtons();
    }

    function onMessageRowClick(e) {
      if (e.target.closest('.edit-btn') || e.target.closest('.delete-btn') || e.target.closest('.edit-actions') || e.target.closest('.avatar')) return;
      const row = e.currentTarget;
      if (row.classList.contains('selected')) row.classList.remove('selected');
      else {
        document.querySelectorAll('.message-row').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
      }
    }

    async function onAvatarClick(e) {
      e.stopPropagation();
      const avatar = e.currentTarget;
      const userId = avatar.dataset.userId;
      const userName = avatar.dataset.userName;
      const userRole = avatar.dataset.userRole;

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('full_name, job_role, avatar_url, created_at')
        .eq('id', userId)
        .single();

      if (error || !profile) { console.error('Failed to load profile', error); return; }

      modalName.textContent = profile.full_name || userName;
      modalRole.textContent = profile.job_role || userRole || '—';
      modalJoined.textContent = profile.created_at ? `Joined ${new Date(profile.created_at).toLocaleDateString()}` : '—';

      if (profile.avatar_url) {
        modalAvatar.src = profile.avatar_url;
        modalAvatar.style.display = 'block';
        modalAvatarPlaceholder.style.display = 'none';
      } else {
        modalAvatar.style.display = 'none';
        modalAvatarPlaceholder.style.display = 'flex';
        modalAvatarPlaceholder.textContent = getInitials(profile.full_name || userName);
      }

      modalSendDM.dataset.userId = userId;
      modalSendDM.dataset.userName = profile.full_name || userName;

      profileModal.style.display = 'flex';
    }

    async function handleEditClick(e) {
      e.stopPropagation();
      const btn = e.currentTarget;
      const messageId = btn.dataset.id;
      const currentContent = btn.dataset.content;
      const row = btn.closest('.message-row');
      const createdAt = row.dataset.createdAt;

      if (Date.now() - new Date(createdAt).getTime() > 60000) {
        alert('Cannot edit: message is older than 1 minute.');
        return;
      }

      const messageBubble = row.querySelector('.message-bubble');
      const messageDiv = row.querySelector('.message');

      const editHtml = `
        <div class="message sent" style="padding:0;">
          <input type="text" class="edit-input" value="${escapeHtml(currentContent)}" data-original="${escapeHtml(currentContent)}">
          <div class="edit-actions">
            <button class="save-btn" data-id="${messageId}">Save</button>
            <button class="cancel-btn">Cancel</button>
          </div>
        </div>
      `;
      messageDiv.style.display = 'none';
      btn.closest('.message-actions').style.display = 'flex';

      const editContainer = document.createElement('div');
      editContainer.innerHTML = editHtml;
      messageBubble.appendChild(editContainer.firstChild);

      const input = messageBubble.querySelector('.edit-input');
      input.focus();

      const saveBtn = messageBubble.querySelector('.save-btn');
      saveBtn.addEventListener('click', async () => {
        const newContent = input.value.trim();
        if (!newContent) return;
        await editMessage(messageId, newContent);
      });

      const cancelBtn = messageBubble.querySelector('.cancel-btn');
      cancelBtn.addEventListener('click', () => {
        messageDiv.style.display = 'block';
        btn.closest('.message-actions').style.display = 'flex';
        editContainer.remove();
      });

      input.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
          const newContent = input.value.trim();
          if (!newContent) return;
          await editMessage(messageId, newContent);
        }
      });
    }

    async function editMessage(messageId, newContent) {
      try {
        const { error } = await supabase
          .from('group_messages')
          .update({ content: newContent })
          .eq('id', messageId)
          .eq('sender_id', currentUser.id);
        if (error) throw error;
        updateMessageInUI(messageId, newContent);
        const messageRow = document.querySelector(`.message-row[data-message-id="${messageId}"]`);
        if (messageRow) {
          const messageDiv = messageRow.querySelector('.message');
          const actions = messageRow.querySelector('.message-actions');
          if (messageDiv) messageDiv.style.display = 'block';
          if (actions) actions.style.display = 'flex';
          const editContainer = messageRow.querySelector('.message > div:not(.message):not(.message-actions)')?.closest('.message');
          if (editContainer) editContainer.remove();
        }
      } catch (err) {
        console.error('Edit error:', err);
        alert('Failed to edit message: ' + err.message);
      }
    }

    async function handleDeleteClick(e) {
      e.stopPropagation();
      if (!confirm('Delete this message?')) return;
      const btn = e.currentTarget;
      const messageId = btn.dataset.id;
      const row = btn.closest('.message-row');
      const senderId = row.dataset.senderId;
      try {

      const lastMessageRow = area.querySelector('.message-row:last-child');
      let lastDate = lastMessageRow ? lastMessageRow.dataset.createdAt : null;

      const isScrolledToBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 50;
      if (separatorHtml) area.insertAdjacentHTML('beforeend', separatorHtml);

      area.insertAdjacentHTML('beforeend', msgHtml);

    function getCallUserMessage(error) {
      const message = String(error?.message || error?.name || '').toLowerCase();
      if (message.includes('notallowed') || message.includes('permission') || message.includes('denied')) {
        return 'Microphone or camera permission is blocked. Please allow access for TechTitans and try again.';
      }
      if (message.includes('notreadable') || message.includes('could not start audio source')) {
        return 'Microphone or camera is unavailable. Close other apps using it, check app permissions, and try again.';
      }
      if (message.includes('notfound') || message.includes('device not found')) {
        return 'No microphone or camera was found on this device.';
      }
      if (message.includes('overconstrained')) {
        return 'This device cannot start the requested microphone or camera settings.';
      }
      if (message.includes('token') || message.includes('fetch') || message.includes('network')) {
        return 'Unable to connect to the calling service. Please check your connection and try again.';
      }
      return 'Unable to connect to the call. Please try again.';
    }

    function showCallError(error) {
      const userMessage = getCallUserMessage(error);
      if (typeof showToast === 'function') showToast(userMessage);
      else alert(userMessage);
    }

    async function getAgoraToken(channelName) {
      if (!currentUser?.id) {
        throw new Error('You must be signed in to start a call.');
      }
      if (!isValidAgoraChannelName(channelName)) {
        throw new Error('Invalid call channel name.');
      }

      const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
      if (sessionError || !sessionData?.session?.access_token) {
        throw new Error('Authentication expired. Please log in again.');
      }

      let response;
      try {
        console.info('Agora token request started');
        response = await fetch(`${SUPABASE_URL}/functions/v1/agora-token`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${sessionData.session.access_token}`
          },
          body: JSON.stringify({
            channelName,
            uid: currentUser.id
          })
        });
      } catch (error) {
        console.error('Agora token request failed:', error);
        throw new Error('Unable to connect to the calling service. Please check your connection and try again.');
      }

      let data = {};
      try {
        data = await response.json();
      } catch (error) {
        throw new Error('Token server returned an invalid response.');
      }

      if (!response.ok) {
        throw new Error(data.error || 'Unable to get Agora token.');
      }
      if (!data.token) {
        throw new Error('Token server did not return an Agora token.');
      }

      console.info('Agora token received');
      return data.token;
    }

    function setupAgoraTokenRefresh(client, getChannelName) {
      if (!client?.on) return;
      const renewToken = async () => {
        try {
          const freshToken = await getAgoraToken(getChannelName());
          if (typeof client.renewToken === 'function') {
            await client.renewToken(freshToken);
          }
        } catch (error) {
          console.error('Unable to renew Agora token:', error);
        }
      };
      client.on('token-privilege-will-expire', renewToken);
      client.on('token-privilege-did-expire', renewToken);
    }

    async function cleanupGroupCallMedia() {
      if (localAudioTrack) {

    function addRemoteVideoContainer(uid, name) {

    // --- Join group call ---
    async function joinGroupCall(existingCallId = null) {
      if (callActive || callStarting) { alert('You are already joining or in a group call.'); return; }
      if (!selectedGroupRole) { alert('No group selected.'); return; }
      const role = selectedGroupRole;
      if (!role) { alert('Cannot determine group role.'); return; }
      if (!window.AgoraRTC) { alert('Calling service did not load. Check your connection and refresh.'); return; }
      callStarting = true;

      const client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
      groupAgoraClient = client;

      client.on('user-published', async (user, mediaType) => {
        await client.subscribe(user, mediaType);
        let userName = remoteUsers.get(user.uid)?.name || `User ${user.uid}`;
        if (!remoteUsers.has(user.uid)) {
          try {
            const { data: profile } = await supabase
              .from('profiles')
              .select('full_name')
              .eq('id', user.uid)
              .single();
            if (profile) userName = profile.full_name;
          } catch (e) {}
        }
        let container = remoteUsers.get(user.uid)?.container;
        if (!container) {
          container = addRemoteVideoContainer(user.uid, userName);
          remoteUsers.set(user.uid, { name: userName, videoTrack: null, audioTrack: null, container });
        }
        if (mediaType === 'video') {
          user.videoTrack.play(container.querySelector('.rtc-video-slot'));
          remoteUsers.get(user.uid).videoTrack = user.videoTrack;
        }
        if (mediaType === 'audio') {
          user.audioTrack.play();
          remoteUsers.get(user.uid).audioTrack = user.audioTrack;
        }
        updateParticipantCount();
      });

      client.on('user-unpublished', (user, mediaType) => {
        const userData = remoteUsers.get(user.uid);
        if (!userData) return;
        if (mediaType === 'video' && userData.videoTrack) {
          userData.videoTrack.stop();
          userData.videoTrack = null;
        }
        if (mediaType === 'audio' && userData.audioTrack) {
          userData.audioTrack.stop();
          userData.audioTrack = null;
        }
        if (!userData.videoTrack && !userData.audioTrack) {
          if (userData.container) userData.container.remove();
          remoteUsers.delete(user.uid);
          updateParticipantCount();
        }
      });

      client.on('user-left', (user) => {
        const userData = remoteUsers.get(user.uid);
        if (userData && userData.container) {
          userData.container.remove();
          remoteUsers.delete(user.uid);
          updateParticipantCount();
        }
      });

      try {
        const channelName = await window.TechTitansAgora.compactChannelName('group', role);
        groupCallChannelName = channelName;
        setupAgoraTokenRefresh(client, () => groupCallChannelName);
        const token = await getAgoraToken(groupCallChannelName);
        console.info('Agora group join started');
        await client.join(AGORA_APP_ID, groupCallChannelName, token, currentUser.id);
        console.info('Agora group join succeeded');
        joinedAgoraChannelName = groupCallChannelName;
        console.info('Agora group media initialization started');
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        localVideoTrack = await AgoraRTC.createCameraVideoTrack();
        console.info('Agora group publish started');
        await client.publish([localAudioTrack, localVideoTrack]);
        console.info('Agora group publish succeeded');
        localVideoTrack.play('localVideo');
        callActive = true;
        callStarting = false;
      } catch (err) {
        console.error('Failed to join group call:', err);
        await hangUpCall();
        showCallError(err);
        return;
      }

      if (!existingCallId) {
        try {
          const { data: callData, error: callError } = await supabase
            .from('group_calls')
            .insert({ role: role, started_by: currentUser.id, status: 'active', started_at: new Date().toISOString() })
            .select()
            .single();
          if (callError) throw callError;
          activeGroupCallId = callData.id;
          await supabase.channel(`group-call-${role}`).send({
            type: 'broadcast',
            event: 'group-call-started',
            payload: {
              callerId: currentUser.id,
              callerName: currentUserFullName,
              role,
              callId: callData.id,
              callChannelName: groupCallChannelName
            }
          });
          callerNameDisplay.textContent = currentUserFullName;
          ongoingCallBanner.style.display = 'flex';
          if (window.TechTitansNotifications) {
            window.TechTitansNotifications.display(`Group call started for ${role}`, {
              body: `${currentUserFullName} has started a call for ${role}.`,
              url: 'messages.html'
            });
          }
        } catch (err) {
          console.warn('Failed to create group call record:', err);
        }
      } else {
        showToast('You joined the group call');
      }

      callModalTitle.textContent = `Group call: ${role}`;
      callModal.style.display = 'flex';
      callActive = true;
      callStarting = false;
      audioEnabled = true;
      videoEnabled = true;
      updateParticipantCount();
    }

    async function hangUpCall() {
      const client = groupAgoraClient;
      groupAgoraClient = null;
      if (client) {
        try { await client.leave(); } catch (leaveError) { console.warn('Agora group leave skipped:', leaveError); }
      }
      await cleanupGroupCallMedia();
      callModal.style.display = 'none';
      callActive = false;
      callStarting = false;
      joinedAgoraChannelName = null;

        try {
          await supabase
            .from('group_calls')
            .update({ status: 'ended', ended_at: new Date().toISOString() })
            .eq('id', activeGroupCallId);
          const role = selectedGroupRole || 'General';
          if (role) {
            await supabase.channel(`group-call-${role}`).send({
              type: 'broadcast',
              event: 'group-call-ended',
              payload: {
                endedBy: currentUser.id,
                callerName: currentUserFullName,

            window.TechTitansNotifications.display(`Group call ended`, {
              body: `The call for ${role} has ended.`,
              url: 'messages.html'
            });
          }
        } catch (err) {
          console.warn('Failed to end group call:', err);
        }
      } else {
        const role = selectedGroupRole || 'General';
        if (role) {
          await supabase.channel(`group-call-${role}`).send({
            type: 'broadcast',
            event: 'group-call-participant-left',

        }
      }
    }

    // --- Voice notes ---
    const voiceBtn = document.getElementById('voiceNoteBtn');
    const recordingTimer = document.getElementById('recordingTimer');
    voiceBtn.addEventListener('click', toggleRecording);

    async function toggleRecording() {
      if (isRecording) stopRecording();
      else await startRecording();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          await uploadVoiceNote(audioBlob);
          stream.getTracks().forEach(track => track.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        voiceBtn.classList.add('recording');
        voiceBtn.textContent = '🔴';
        recordingStartTime = Date.now();
        recordingTimer.style.display = 'inline';
        updateRecordingTimer();
      } catch (err) { console.error('Microphone access error:', err); alert('Could not access microphone. Please check permissions.'); }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        voiceBtn.classList.remove('recording');
        voiceBtn.textContent = '🎤';
        recordingTimer.style.display = 'none';
        if (recordingTimerInterval) { clearInterval(recordingTimerInterval); recordingTimerInterval = null; }
      }
    }

    function updateRecordingTimer() {
      recordingTimerInterval = setInterval(() => {
        if (!isRecording) return;
        const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        recordingTimer.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    async function uploadVoiceNote(audioBlob) {
      if (!selectedGroupRole) {
        alert('Please select a group first.');
        return;
      }
      const messageRole = selectedGroupRole;

      const fileName = `${currentUser.id}/${Date.now()}.webm`;
      const { error: uploadError } = await supabase.storage
        .from('voice_notes')
        .upload(fileName, audioBlob, { contentType: 'audio/webm' });

      if (uploadError) { console.error('Upload error:', uploadError); alert('Failed to upload voice note: ' + uploadError.message); return; }

      const { data: urlData } = supabase.storage.from('voice_notes').getPublicUrl(fileName);
      const audioUrl = urlData.publicUrl;

      const { data, error } = await supabase
        .from('group_messages')
        .insert({ role: messageRole, sender_id: currentUser.id, audio_url: audioUrl })
        .select()
        .single();

      if (error) { console.error('Insert error:', error); alert('Failed to send voice note: ' + error.message); return; }

      displaySentMessage(data);
      try { await supabase.from('message_reads').insert({ message_id: data.id, user_id: currentUser.id }); } catch (readErr) {}
    }

    // --- DM badge ---
    function subscribeToAllDirectMessages() {
      if (globalDmSubscription) globalDmSubscription.unsubscribe();
      if (!currentUser) return;
      globalDmSubscription = supabase
        .channel(`dm-global-${currentUser.id}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages', filter: `recipient_id=eq.${currentUser.id}` }, async (payload) => {
          const newMsg = payload.new;
          if (newMsg.sender_id === currentUser.id) return;
          dmUnreadBySender[newMsg.sender_id] = (dmUnreadBySender[newMsg.sender_id] || 0) + 1;
          updateDMBadge();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'private_messages', filter: `recipient_id=eq.${currentUser.id}` }, (payload) => {
          const updated = payload.new;
          if (updated.read_at && dmUnreadBySender[updated.sender_id]) {
            dmUnreadBySender[updated.sender_id]--;
            if (dmUnreadBySender[updated.sender_id] <= 0) delete dmUnreadBySender[updated.sender_id];
            updateDMBadge();
          }
        })
        .subscribe();
    }

    // --- Group call DB subscription ---
    let groupCallDbSubscription = null;
    function setupGroupCallDbSubscription() {
      if (groupCallDbSubscription) groupCallDbSubscription.unsubscribe();
      const role = selectedGroupRole || 'General';
      if (!role) return;
      groupCallDbSubscription = supabase
        .channel(`group-calls-db-${role}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'group_calls', filter: `role=eq.${role}` }, () => {
          checkOngoingCall();
        })
        .subscribe();
    }

    function setupGroupCallSubscription() {
      if (groupCallSubscription) groupCallSubscription.unsubscribe();
      const role = selectedGroupRole || 'General';
      if (!role) return;
      groupCallSubscription = supabase
        .channel(`group-call-${role}`)
        .on('broadcast', { event: 'group-call-started' }, async ({ payload }) => {
          if (!payload || payload.callerId === currentUser.id) return;
          callerNameDisplay.textContent = payload.callerName || 'Someone';
          activeGroupCallId = payload.callId || null;
          ongoingCallBanner.style.display = 'flex';
          showToast(`Group call started by ${payload.callerName}`);
          if (window.TechTitansNotifications) {
            window.TechTitansNotifications.display(`Group call started for ${role}`, {
              body: `${payload.callerName} has started a call.`,
              url: 'messages.html'
            });
          }
        })
        .on('broadcast', { event: 'group-call-ended' }, async ({ payload }) => {
          if (!payload || payload.endedBy === currentUser.id) return;
          ongoingCallBanner.style.display = 'none';
          activeGroupCallId = null;
          showToast(`Group call ended`);
          if (window.TechTitansNotifications) {
            window.TechTitansNotifications.display(`Group call ended`, {
              body: `The call for ${role} has ended.`,
              url: 'messages.html'
            });
          }
        })
        .on('broadcast', { event: 'group-call-participant-left' }, ({ payload }) => {})
        .subscribe();
    }

    // --- Group messages subscription ---
    function setupGroupSubscription() {
      if (messageSubscription) { messageSubscription.unsubscribe(); messageSubscription = null; }

      // For non-CEO, we need to watch General and their role
      const rolesToWatch = isCEO ? [] : ['General', currentRole];

      if (isCEO) {
        // CEO watches all messages (since they see all groups)
        messageSubscription = supabase
          .channel('all-messages')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'group_messages' }, async (payload) => {
            const newMsg = payload.new;
            if (document.querySelector(`.message-row[data-message-id="${newMsg.id}"]`)) return;
            if (newMsg.sender_id === currentUser.id) return;

            const { data: senderProfile } = await supabase
              .from('profiles')
              .select('id, full_name, avatar_url')
              .eq('id', newMsg.sender_id)
              .single();
            if (!senderProfile) return;
            const enrichedMsg = { ...newMsg, sender: senderProfile };

            // For CEO: if in "All" view, we don't append messages (they see cards)
            // If in specific group, append if matches
            if (selectedGroupRole !== null && newMsg.role === selectedGroupRole) {
              appendMessageToUI(enrichedMsg, false, senderProfile, newMsg.role, true);
              currentUnreadCount++;
            }
            await updateGlobalUnreadCount();
            updateUnreadBadges();

            if (window.TechTitansNotifications) {
              window.TechTitansNotifications.display(`New message in ${newMsg.role}`, {
                body: `${senderProfile.full_name}: ${newMsg.content || 'Sent a voice note'}`,
                url: 'messages.html'
              });
            }
            if (isCEO) buildGroupSwitcher();
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'group_messages' }, (payload) => {
            updateMessageInUI(payload.new.id, payload.new.content);
          })
          .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'group_messages' }, (payload) => {
            removeMessageFromUI(payload.old.id);
          })
          .subscribe();
      } else {
        // Non-CEO: watch messages in General and their role
        messageSubscription = supabase
          .channel(`group-${currentUser.id}`)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'group_messages', filter: `role=in.(${rolesToWatch.map(r => `"${r}"`).join(',')})` }, async (payload) => {
            const newMsg = payload.new;
            if (document.querySelector(`.message-row[data-message-id="${newMsg.id}"]`)) return;
            if (newMsg.sender_id === currentUser.id) return;

            const { data: senderProfile } = await supabase
              .from('profiles')
              .select('id, full_name, avatar_url')
              .eq('id', newMsg.sender_id)
              .single();
            if (!senderProfile) return;
            const enrichedMsg = { ...newMsg, sender: senderProfile };

            // In "All" view we don't append messages
            if (selectedGroupRole === null) {
              // Do not append, but we could update the card preview? That's more complex.
              // For simplicity, we'll just update unread counts.
            } else if (selectedGroupRole === newMsg.role) {
              appendMessageToUI(enrichedMsg, false, senderProfile, newMsg.role, true);
              currentUnreadCount++;
            }
            await updateGlobalUnreadCount();
            updateUnreadBadges();

            if (window.TechTitansNotifications) {
              window.TechTitansNotifications.display(`New message in ${newMsg.role}`, {
                body: `${senderProfile.full_name}: ${newMsg.content || 'Sent a voice note'}`,
                url: 'messages.html'
              });
            }
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'group_messages', filter: `role=in.(${rolesToWatch.map(r => `"${r}"`).join(',')})` }, (payload) => {
            updateMessageInUI(payload.new.id, payload.new.content);
          })
          .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'group_messages', filter: `role=in.(${rolesToWatch.map(r => `"${r}"`).join(',')})` }, (payload) => {
            removeMessageFromUI(payload.old.id);
          })
          .subscribe();
      }
    }

    function setupMessageReadsSubscription() {
      if (messageReadsSubscription) messageReadsSubscription.unsubscribe();
      if (!currentUser) return;
      messageReadsSubscription = supabase
        .channel('message-reads')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message_reads' }, async (payload) => {
          const { message_id, user_id } = payload.new;
          if (user_id === currentUser.id) return;
          const { data: msg } = await supabase
            .from('group_messages')
            .select('sender_id')
            .eq('id', message_id)
            .single();
          if (msg && msg.sender_id === currentUser.id) {
            await updateSeenIndicator(message_id);
          }
        })
        .subscribe();
    }

    // --- Init ---
    async function init() {
      try {
        const { data: { user }, error: userError } = await supabase.auth.getUser();
        if (userError || !user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        const metadata = user.user_metadata || {};
        currentUserFullName = metadata.full_name || 'User';
        const jobRole = metadata.job_role;
        if (!jobRole) {
          document.getElementById('messagesArea').innerHTML = '<div style="color:#ff628c;text-align:center;padding:2rem;">No job role assigned. Please contact admin.</div>';
          return;
        }

        currentRole = jobRole;
        isCEO = (currentRole === 'CEO');

        await setupPresence();
        subscribeToAllDirectMessages();
        setupMessageReadsSubscription();

        const messageInput = document.getElementById('messageInput');
        let typingTimeout;
        messageInput.addEventListener('input', () => {
          if (typingTimeout) clearTimeout(typingTimeout);
          sendTypingIndicator();
          typingTimeout = setTimeout(() => {}, 2000);
        });

        // Default to "All" view for everyone
        selectedGroupRole = null;
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('voiceNoteBtn').disabled = true;

        if (isCEO) {
          document.getElementById('roleDisplay').style.display = 'none';
        } else {
          document.getElementById('roleDisplay').textContent = currentRole;
        }

        await updateGlobalUnreadCount();
        await buildGroupSwitcher();
        updateGroupTitle();
        updateSwitcherButton();
        await loadMessages();
        setupGroupSubscription();
        setupGroupCallSubscription();
        setupGroupCallDbSubscription();
        await checkOngoingCall();
        removeNotificationButtons();
      } catch (err) {
        console.error('Init error:', err);
        document.getElementById('messagesArea').innerHTML = '<div style="color:#ff628c;text-align:center;padding:2rem;">Failed to load chat. Please refresh.</div>';
      }
    }

    init();
  })();
</script>
</body>
</html>
