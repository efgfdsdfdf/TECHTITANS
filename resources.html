<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/titans_logo2.png">
    <title>TECH TITANS · Resource Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <script src="native-bridge.js">
    </script>
    <script src="notifications.js">
    </script>
    <script src="ringtone.js">
    </script>
    <script src="global-notifications.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js">
    </script>
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0b0f17;
            color: #eef2fb;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 300px;
            background: rgba(18, 26, 40, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(66, 140, 255, 0.15);
            padding: 2rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            z-index: 1001;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(66, 140, 255, 0.2);
            border-radius: 10px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #a0c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo span {
            background: none;
            -webkit-text-fill-color: #428cff;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: #7a8bb5;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .nav a {
            color: #a5b3d1;
            text-decoration: none;
            padding: 0.85rem 1.2rem;
            border-radius: 1.5rem;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid transparent;
        }
        .nav a i {
            width: 1.5rem;
            font-size: 1.1rem;
        }
        .nav a:hover {
            background: rgba(66, 140, 255, 0.1);
            border-color: rgba(66, 140, 255, 0.3);
            color: #fff;
        }
        .nav a.active {
            background: linear-gradient(145deg, #428cff, #2a5bbf);
            color: #fff;
            box-shadow: 0 8px 20px -8px #428cff;
        }

        /* ─── SIDEBAR STATS ─── */
        .stats-box {
            background: rgba(66, 140, 255, 0.08);
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 1px solid rgba(66, 140, 255, 0.15);
        }
        .stats-box h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a8bb5;
            margin-bottom: 1rem;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #a5b3d1;
        }
        .stat-value {
            color: #fff;
            font-weight: 600;
        }

        /* ─── CATEGORY FILTER IN SIDEBAR ─── */
        .category-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .category-section h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #7a8bb5;
            letter-spacing: 0.8px;
            padding-left: 0.5rem;
        }
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding-bottom: 1rem;
        }
        .category-btn {
            background: none;
            border: 1px solid transparent;
            color: #a5b3d1;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            text-align: left;
            cursor: pointer;
            transition: 0.25s ease;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-btn:hover {
            background: rgba(66, 140, 255, 0.08);
            color: #fff;
            border-color: rgba(66, 140, 255, 0.2);
        }
        .category-btn.active {
            background: rgba(66, 140, 255, 0.15);
            color: #fff;
            border-color: rgba(66, 140, 255, 0.4);
            font-weight: 600;
        }
        .category-btn .count {
            background: #1f2a44;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            color: #7a8bb5;
            min-width: 30px;
            text-align: center;
        }
        .category-btn.active .count {
            background: #428cff;
            color: #fff;
        }

        .logout-btn {
            margin-top: 1rem;
            background: transparent;
            border: 1px solid #3e4a6b;
            color: #ffb4b4;
            padding: 0.9rem;
            border-radius: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .logout-btn:hover {
            background: rgba(255, 77, 77, 0.1);
            border-color: #ff4d4d;
            color: #fff;
        }

        /* ─── MAIN CONTENT ─── */
        .main {
            flex: 1;
            padding: 2rem 2.5rem;
            overflow-y: auto;
            min-height: 100vh;
            position: relative;
        }

        /* ─── MOBILE HEADER ─── */
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding: 0.5rem 0;
            background: #0b0f17;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .mobile-header .logo-mobile {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a0c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mobile-header .logo-mobile span {
            background: none;
            -webkit-text-fill-color: #428cff;
        }
        .mobile-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .mobile-search {
            display: flex;
            align-items: center;
            background: rgba(18, 26, 40, 0.9);
            border: 1px solid #2a3650;
            border-radius: 1.2rem;
            overflow: hidden;
            height: 2.2rem;
            width: 160px;
            transition: width 0.3s;
        }
        .mobile-search i {
            font-size: 0.8rem;
            color: #5b6b92;
            padding: 0 0 0 0.7rem;
            flex-shrink: 0;
        }
        .mobile-search input {
            height: 100%;
            width: 100%;
            padding: 0 0.7rem;
            font-size: 0.8rem;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            border-radius: 0;
            line-height: 1;
        }
        .mobile-search input::placeholder {
            color: #5b6b92;
        }

        .sidebar-toggle {
            background: rgba(66, 140, 255, 0.1);
            border: 1px solid rgba(66, 140, 255, 0.3);
            color: #fff;
            padding: 1rem 1rem;
            border-radius: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* ─── TOP BAR ─── */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .search-box {
            background: rgba(18, 26, 40, 0.7);
            border: 1px solid #2a3650;
            border-radius: 3rem;
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1 1 280px;
            max-width: 450px;
        }
        .search-box i {
            color: #5b6b92;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 1rem;
        }
        .search-box input::placeholder {
            color: #5b6b92;
        }

        /* Buttons group: Upload only (notification removed) */
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .upload-btn-main {
            background: #428cff;
            border: none;
            color: #fff;
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid #428cff;
            box-shadow: 0 8px 18px -4px rgba(66, 140, 255, 0.4);
            white-space: nowrap;
            font-size: 0.95rem;
        }
        .upload-btn-main:hover {
            background: #2a5bbf;
            transform: translateY(-2px);
        }

        /* ─── STATS ROW ─── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(18, 26, 40, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(66, 140, 255, 0.12);
            border-radius: 1.8rem;
            padding: 1.2rem;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.2rem;
        }
        .stat-card .label {
            color: #7a8bb5;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* ─── RESOURCES GRID – even cards with ellipsis ─── */
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            align-items: stretch;
        }
        .resource-card {
            background: rgba(18, 26, 40, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(66, 140, 255, 0.15);
            border-radius: 1.8rem;
            padding: 1.2rem 1rem;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 220px;
            overflow: hidden;
        }
        .resource-card:hover {
            border-color: #428cff80;
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -12px rgba(66, 140, 255, 0.25);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            margin-bottom: 0.6rem;
            flex-shrink: 0;
        }
        .file-icon-wrap {
            width: 44px;
            height: 44px;
            background: rgba(66, 140, 255, 0.15);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #428cff;
            flex-shrink: 0;
        }
        .card-meta {
            flex: 1;
            min-width: 0;
        }
        .card-title {
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }
        .card-category {
            font-size: 0.65rem;
            background: #1f2a44;
            padding: 0.15rem 0.8rem;
            border-radius: 2rem;
            color: #a5b3d1;
            display: inline-block;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            color: #9aa8cc;
            font-size: 0.85rem;
            line-height: 1.4;
            margin: 0.3rem 0 0.5rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.6rem;
            margin-top: auto;
            flex-shrink: 0;
        }
        .uploader-info {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            min-width: 0;
        }
        .uploader-avatar {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #2f3f66, #1f2a44);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.65rem;
            border: 1px solid rgba(66, 140, 255, 0.2);
            flex-shrink: 0;
        }
        .uploader-name {
            color: #d7def5;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70px;
        }
        .uploader-role {
            color: #7a8bb5;
            background: #1f2a44;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.6rem;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .card-date {
            color: #5b6b92;
            font-size: 0.65rem;
            flex-shrink: 0;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .resource-link,
        .edit-resource,
        .delete-resource {
            flex: 1;
            text-align: center;
            padding: 0.4rem 0.4rem;
            border-radius: 1.6rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.72rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .resource-link {
            background: #428cff;
            color: #fff;
        }
        .resource-link:hover {
            background: #2a5bbf;
        }
        .edit-resource {
            background: #f0b429;
            color: #1f2a44;
        }
        .edit-resource:hover {
            background: #d49a1f;
        }
        .delete-resource {
            background: transparent;
            border: 1px solid #ff4d4d;
            color: #ff9f9f;
            cursor: pointer;
        }
        .delete-resource:hover {
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #5b6b92;
            padding: 4rem 0;
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            opacity: 0.2;
        }

        /* ─── UPLOAD / EDIT MODAL ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-content {
            background: #141b2b;
            border: 1px solid rgba(66, 140, 255, 0.3);
            border-radius: 2.5rem;
            padding: 2.5rem;
            max-width: 700px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }
        .modal-header h2 {
            font-size: 1.8rem;
        }
        .modal-close {
            background: none;
            border: none;
            color: #7a8bb5;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close:hover {
            color: #fff;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
            min-height: 0;
        }

        .modal-form input,
        .modal-form select,
        .modal-form textarea {
            background: #0f172f;
            border: 1px solid #2a3650;
            border-radius: 1.5rem;
            padding: 0.9rem 1.2rem;
            color: #fff;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
            flex-shrink: 0;
        }
        .modal-form input:focus,
        .modal-form select:focus,
        .modal-form textarea:focus {
            border-color: #428cff;
            box-shadow: 0 0 0 4px rgba(66, 140, 255, 0.1);
        }

        .modal-form textarea {
            resize: vertical;
            min-height: 60px;
            max-height: 120px;
            flex-shrink: 0;
        }

        .file-upload-area {
            background: #0f172f;
            border: 2px dashed #2a3650;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.25s ease;
            position: relative;
            touch-action: manipulation;
            flex: 1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .file-upload-area:hover {
            border-color: #428cff;
            background: rgba(66, 140, 255, 0.05);
        }
        .file-upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
        }
        .file-upload-area i {
            font-size: 3rem;
            color: #428cff;
            pointer-events: none;
            opacity: 0.8;
        }
        .file-upload-area p {
            color: #a5b3d1;
            font-size: 1rem;
            pointer-events: none;
            margin: 0;
        }
        .file-upload-area .file-name-preview {
            color: #d7def5;
            font-weight: 500;
            font-size: 0.95rem;
            word-break: break-all;
            pointer-events: none;
        }
        .file-upload-area .file-replace-hint {
            color: #7a8bb5;
            font-size: 0.8rem;
            pointer-events: none;
        }

        .upload-progress {
            height: 6px;
            background: #1f2a44;
            border-radius: 1rem;
            margin-top: 0.5rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .progress-fill {
            height: 100%;
            background: #428cff;
            width: 0%;
            transition: width 0.2s;
        }

        .submit-upload {
            background: #428cff;
            border: none;
            color: #fff;
            padding: 1rem;
            border-radius: 1.8rem;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.25s;
            flex-shrink: 0;
            margin-top: 0.5rem;
        }
        .submit-upload:hover {
            background: #2a5bbf;
            transform: translateY(-2px);
        }
        .submit-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ─── RESOURCE PREVIEW MODAL – FULL SCREEN ─── */
        .preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2100;
            justify-content: center;
            align-items: center;
            padding: 0;
            animation: fadeInOverlay 0.2s ease;
        }
        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .preview-overlay.open {
            display: flex;
        }

        .preview-container {
            background: #0b0f17;
            border: none;
            border-radius: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: none;
            animation: slideUpPreview 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
            overflow: hidden;
        }
        @keyframes slideUpPreview {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .preview-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;

    <script>
        (function() {
            // ─── Supabase ───
            const SUPABASE_URL = 'https://mdqqtsdibtvymfgntstf.supabase.co';
            const SUPABASE_ANON_KEY =
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kcXF0c2RpYnR2eW1mZ250c3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTI1NjIsImV4cCI6MjA4Nzg4ODU2Mn0.hS-7kmoyFljnhkJEkw7nmgimw9ioQreidyu27_NXYyo';

            if (!window.supabase) {
                document.body.innerHTML =
                    '<p style="color:white;padding:2rem;">Failed to load Supabase. Refresh.</p>';
                return;
            }
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            if (window.TechTitansNotifications) {
                window.TechTitansNotifications.connect(supabase);
            }

            // ─── PDF.js setup ───
            if (window.pdfjsLib) {
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            }

            // ─── State ───
            let currentUser = null;
            let currentUserRole = 'member';
            let currentUserName = 'User';
            let allResources = [];
            let currentCategory = 'all';
            let searchTerm = '';

            let previewList = [];
            let previewIndex = -1;
            let pdfDoc = null;
            let currentPage = 1;
            let totalPages = 0;
            let rendering = false;

            let editingResourceId = null;

            // ─── DOM refs ───
            const grid = document.getElementById('resourcesGrid');
            const searchInput = document.getElementById('searchInput');
            const mobileSearchInput = document.getElementById('mobileSearchInput');
            const categoryBtns = document.querySelectorAll('.category-btn');
            const uploadModal = document.getElementById('uploadModal');
            const openModalBtn = document.getElementById('openUploadModal');
            const closeModalBtn = document.getElementById('closeModal');
            const modalTitleText = document.getElementById('modalTitleText');
            const modalResourceTitle = document.getElementById('modalResourceTitle');
            const modalCategory = document.getElementById('modalCategory');
            const modalDesc = document.getElementById('modalDesc');
            const modalFile = document.getElementById('modalFile');
            const fileLabel = document.getElementById('fileLabel');
            const filePreviewName = document.getElementById('filePreviewName');
            const fileReplaceHint = document.getElementById('fileReplaceHint');
            const modalUploadBtn = document.getElementById('modalUploadBtn');
            const modalSubmitText = document.getElementById('modalSubmitText');
            const modalProgress = document.getElementById('modalProgress');
            const modalProgressFill = document.getElementById('modalProgressFill');

            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const closeSidebar = document.getElementById('closeSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            const statTotal = document.getElementById('statTotal');
            const statCategories = document.getElementById('statCategories');
            const statUploaders = document.getElementById('statUploaders');
            const statTotalCard = document.getElementById('statTotalCard');
            const statRecentCard = document.getElementById('statRecentCard');
            const statCategoriesCard = document.getElementById('statCategoriesCard');

            const previewOverlay = document.getElementById('previewOverlay');
            const previewClose = document.getElementById('previewClose');
            const previewPrev = document.getElementById('previewPrev');
            const previewNext = document.getElementById('previewNext');
            const previewMedia = document.getElementById('previewMedia');
            const previewInfo = document.getElementById('previewInfo');

            // ─── Helpers ───
            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    '"': '&quot;' }[m]));
            }

            function getFileExtension(fileName) {
                if (!fileName) return '';
                return fileName.split('.').pop().toLowerCase();
            }

            function getFileIcon(fileName) {
                const ext = getFileExtension(fileName);
                const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp'];
                if (imageExts.includes(ext)) return 'fa-file-image';
                if (ext === 'pdf') return 'fa-file-pdf';
                if (['doc', 'docx'].includes(ext)) return 'fa-file-word';
                if (['xls', 'xlsx', 'csv'].includes(ext)) return 'fa-file-excel';
                if (['ppt', 'pptx'].includes(ext)) return 'fa-file-powerpoint';
                if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'fa-file-archive';
                if (['txt', 'md'].includes(ext)) return 'fa-file-alt';
                if (['mp4', 'mov', 'avi', 'mkv', 'webm'].includes(ext)) return 'fa-file-video';
                if (['mp3', 'wav', 'ogg', 'flac'].includes(ext)) return 'fa-file-audio';
                return 'fa-file';
            }

            function isImageFile(fileName) {
                const ext = getFileExtension(fileName);
                return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp'].includes(ext);
            }

            function isPdfFile(fileName) {
                return getFileExtension(fileName) === 'pdf';
            }

            function isVideoFile(fileName) {
                const ext = getFileExtension(fileName);
                return ['mp4', 'mov', 'avi', 'mkv', 'webm'].includes(ext);
            }

            function isAudioFile(fileName) {
                const ext = getFileExtension(fileName);
                return ['mp3', 'wav', 'ogg', 'flac'].includes(ext);
            }

            function getFileNameFromUrl(url) {
                if (!url) return 'unknown-file';
                try {
                    const parts = url.split('/');
                    const lastPart = parts.pop();
                    const name = lastPart.split('?')[0];
                    return decodeURIComponent(name);
                } catch (e) {
                    return 'unknown-file';
                }
            }

            function showToast(msg) {
                const t = document.getElementById('toast');
                if (!t) { alert(msg); return; }
                t.textContent = msg;
                t.classList.remove('hide');
                t.classList.add('show');
                clearTimeout(t._timeout);
                t._timeout = setTimeout(() => {
                    t.classList.remove('show');
                    t.classList.add('hide');
                }, 3000);
            }

            // ─── Auth & init ───
            async function init() {
                const { data: { user } } = await supabase.auth.getUser();

                currentUser = user;
                if (user) {
                    const metadata = user.user_metadata || {};
                    currentUserName = metadata.full_name || user.email?.split('@')[0] || 'User';
                    currentUserRole = metadata.role || 'member';

                    const { data: profile } = await supabase.from('profiles').select(
                        'full_name, role').eq('id', user.id).single();
                    if (profile) {
                        currentUserName = profile.full_name || currentUserName;
                        currentUserRole = profile.role || currentUserRole;
                    }
                }

                const toggleSidebar = () => {
                    sidebar.classList.toggle('open');
                    sidebarOverlay.classList.toggle('active');
                    document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
                };

                if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
                if (closeSidebar) closeSidebar.addEventListener('click', toggleSidebar);
                if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);

                modalFile.addEventListener('change', () => {
                    if (modalFile.files.length > 0) {
                        fileLabel.textContent = 'File selected:';
                        filePreviewName.textContent = modalFile.files[0].name;
                        filePreviewName.style.display = 'block';
                        fileReplaceHint.textContent = 'Leave empty to keep current file (if editing)';
                    } else {
                        fileLabel.textContent = 'Click or drag to choose a file';
                        filePreviewName.style.display = 'none';
                        fileReplaceHint.textContent = 'Leave empty to keep current file (if editing)';
                    }
                });

                categoryBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        categoryBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentCategory = btn.dataset.category;
                        filterAndRender();
                        if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                            toggleSidebar();
                        }
                    });
                });

                searchInput.addEventListener('input', (e) => {
                    const val = e.target.value;
                    searchTerm = val.toLowerCase();
                    if (mobileSearchInput) mobileSearchInput.value = val;
                    filterAndRender();
                });

                if (mobileSearchInput) {
                    mobileSearchInput.addEventListener('input', (e) => {
                        const val = e.target.value;
                        searchTerm = val.toLowerCase();
                        searchInput.value = val;
                        filterAndRender();
                    });
                }

                openModalBtn.addEventListener('click', () => {
                    editingResourceId = null;
                    modalTitleText.textContent = 'Upload Resource';
                    modalSubmitText.textContent = 'Upload';
                    modalResourceTitle.value = '';
                    modalDesc.value = '';
                    modalCategory.value = 'CEO Reports';
                    modalFile.value = '';
                    fileLabel.textContent = 'Click or drag to choose a file';
                    filePreviewName.style.display = 'none';
                    fileReplaceHint.textContent = 'Choose a file to upload';
                    modalProgress.style.display = 'none';
                    modalUploadBtn.disabled = false;
                    uploadModal.classList.add('open');
                });

                closeModalBtn.addEventListener('click', () => {
                    uploadModal.classList.remove('open');
                });
                uploadModal.addEventListener('click', (e) => {
                    if (e.target === uploadModal) {
                        uploadModal.classList.remove('open');
                    }
                });

                modalUploadBtn.addEventListener('click', async () => {
                    if (editingResourceId) {
                        await updateResource(editingResourceId);
                    } else {
                        await uploadResource();
                    }
                });

                previewClose.addEventListener('click', closePreviewModal);
                previewOverlay.addEventListener('click', (e) => {
                    if (e.target === previewOverlay) closePreviewModal();
                });
                previewPrev.addEventListener('click', () => navigatePreview(-1));
                previewNext.addEventListener('click', () => navigatePreview(1));

                document.addEventListener('keydown', (e) => {
                    if (!previewOverlay.classList.contains('open')) return;
                    if (e.key === 'Escape') {
                        closePreviewModal();
                    } else if (e.key === 'ArrowLeft') {
                        navigatePreview(-1);
                    } else if (e.key === 'ArrowRight') {
                        navigatePreview(1);
                    }
                });

                await loadResources();

                document.getElementById('logout').addEventListener('click', async () => {
                    await supabase.auth.signOut();
                    window.location.href = 'index.html';
                });
            }

            // ─── Load resources ───
            async function loadResources() {
                try {
                    const { data, error } = await supabase
                        .from('resources')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    allResources = data || [];
                    updateStats();
                    filterAndRender();
                } catch (error) {
                    console.error('Error loading resources:', error);
                    allResources = [];
                    grid.innerHTML =
                        `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading resources. Check console.</p></div>`;
                }
            }

            // ─── Update stats ───
            function updateStats() {
                const total = allResources.length;
                const categories = new Set(allResources.map(r => r.category).filter(Boolean));
                const uploaders = new Set(allResources.map(r => r.uploader_id).filter(Boolean));

                const now = new Date();
                const weekAgo = new Date(now);
                weekAgo.setDate(weekAgo.getDate() - 7);
                const recent = allResources.filter(r => r.created_at && new Date(r.created_at) >= weekAgo)
                    .length;

                statTotal.textContent = total;
                statCategories.textContent = categories.size;
                statUploaders.textContent = uploaders.size;
                statTotalCard.textContent = total;
                statRecentCard.textContent = recent;
                statCategoriesCard.textContent = categories.size;

                const catCounts = {};
                allResources.forEach(r => {
                    if (r.category) catCounts[r.category] = (catCounts[r.category] || 0) + 1;
                });
                categoryBtns.forEach(btn => {
                    const cat = btn.dataset.category;
                    const countEl = btn.querySelector('.count');
                    if (cat === 'all') { countEl.textContent = total;
                        return; }
                    countEl.textContent = catCounts[cat] || 0;
                });
            }

            // ─── Get filtered list ───
            function getFilteredList() {
                let filtered = allResources;
                if (currentCategory !== 'all') {
                    filtered = filtered.filter(r => r.category === currentCategory);
                }
                if (searchTerm) {
                    filtered = filtered.filter(r =>
                        (r.title && r.title.toLowerCase().includes(searchTerm)) ||
                        (r.description && r.description.toLowerCase().includes(searchTerm))
                    );
                }
                return filtered;
            }

            function filterAndRender() {
                const filtered = getFilteredList();
                renderResources(filtered);
            }

            // ─── Render cards ───
            function renderResources(resources) {
                if (!resources.length) {
                    grid.innerHTML =
                        `<div class="empty-state"><i class="fas fa-folder-open"></i><p>No resources found</p></div>`;
                    return;
                }

                grid.innerHTML = resources.map(r => {
                    const iconClass = getFileIcon(r.file_url);
                    const isOwner = currentUser && r.uploader_id === currentUser.id;
                    const isAdmin = currentUserRole === 'admin' || currentUserRole === 'CEO';
                    const canEdit = isOwner || isAdmin;
                    const canDelete = isOwner || isAdmin;

                    const uploaderInitial = (r.uploader_name || 'U').charAt(0).toUpperCase();
                    const date = r.created_at ? new Date(r.created_at).toLocaleDateString() : '';

                    let actionsHtml = `
                        <button class="resource-link open-preview-btn" data-id="${escapeHtml(r.id)}"><i class="fas fa-eye"></i> Preview</button>
                    `;
                    if (canEdit) {
                        actionsHtml += `
                            <button class="edit-resource" data-id="${escapeHtml(r.id)}"><i class="fas fa-edit"></i> Edit</button>
                        `;
                    }
                    if (canDelete) {
                        actionsHtml += `
                            <button class="delete-resource" data-id="${r.id}"><i class="fas fa-trash-alt"></i> Delete</button>
                        `;
                    }

                    return `
                <div class="resource-card" data-id="${escapeHtml(r.id)}">
                  <div class="card-top">
                    <div class="file-icon-wrap"><i class="fas ${iconClass}"></i></div>
                    <div class="card-meta">
                      <div class="card-title" title="${escapeHtml(r.title)}">${escapeHtml(r.title)}</div>
                      <span class="card-category" title="${escapeHtml(r.category || 'Uncategorized')}">${escapeHtml(r.category || 'Uncategorized')}</span>
                    </div>
                  </div>
                  <div class="card-desc">${escapeHtml(r.description || '')}</div>
                  <div class="card-footer">
                    <div class="uploader-info">
                      <div class="uploader-avatar">${uploaderInitial}</div>
                      <span class="uploader-name" title="${escapeHtml(r.uploader_name || 'Unknown')}">${escapeHtml(r.uploader_name || 'Unknown')}</span>
                      <span class="uploader-role">${escapeHtml(r.uploader_role || 'member')}</span>
                    </div>
                    <span class="card-date">${date}</span>
                  </div>
                  <div class="card-actions">
                    ${actionsHtml}
                  </div>
                </div>
              `;
                }).join('');

                grid.querySelectorAll('.open-preview-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const resourceId = btn.dataset.id;
                        openPreviewModal(resourceId);
                    });
                });

                grid.querySelectorAll('.edit-resource').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const resourceId = btn.dataset.id;
                        openEditModal(resourceId);
                    });
                });

                grid.querySelectorAll('.delete-resource').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const id = e.currentTarget.dataset.id;
                        if (!confirm('Delete this resource permanently?')) return;

                        if (previewOverlay.classList.contains('open') && previewList[
                                previewIndex]?.id === id) {
                            closePreviewModal();
                        }

                        try {
                            const resource = allResources.find(r => r.id === id);
                            if (resource && resource.file_url) {
                                const urlParts = resource.file_url.split('/');
                                const fileName = urlParts.pop();
                                await supabase.storage.from('resources').remove([
                                    `resources/${fileName}`
                                ]);
                            }
                            const { error } = await supabase.from('resources').delete().eq(
                                'id', id);
                            if (error) throw error;
                            loadResources();
                        } catch (err) {
                            alert('Delete failed: ' + err.message);
                        }
                    });
                });
            }

            // ─── Open Edit Modal ───
            function openEditModal(resourceId) {
                const resource = allResources.find(r => r.id === resourceId);
                if (!resource) {
                    alert('Resource not found.');
                    return;
                }

                editingResourceId = resourceId;
                modalTitleText.textContent = 'Edit Resource';
                modalSubmitText.textContent = 'Save Changes';

                modalResourceTitle.value = resource.title || '';
                modalDesc.value = resource.description || '';
                modalCategory.value = resource.category || 'CEO Reports';

                const fileName = getFileNameFromUrl(resource.file_url);
                if (fileName && fileName !== 'unknown-file') {
                    fileLabel.textContent = 'Current file:';
                    filePreviewName.textContent = fileName;
                    filePreviewName.style.display = 'block';
                    fileReplaceHint.textContent = 'Choose a new file to replace it (optional)';
                } else {
                    fileLabel.textContent = 'Click or drag to choose a file';
                    filePreviewName.style.display = 'none';
                    fileReplaceHint.textContent = 'Choose a file (required)';
                }

                modalFile.value = '';
                modalProgress.style.display = 'none';
                modalUploadBtn.disabled = false;
                uploadModal.classList.add('open');
            }

            // ─── Update Resource (fixed) ───
            async function updateResource(resourceId) {
                const title = modalResourceTitle.value.trim();
                const category = modalCategory.value;
                const description = modalDesc.value.trim();
                const file = modalFile.files[0];

                if (!title) {
                    alert('Title is required.');
                    return;
                }
                if (!currentUser) {
                    alert('You must be logged in.');
                    return;
                }

                const { data: serverResource, error: fetchError } = await supabase
                    .from('resources')
                    .select('*')
                    .eq('id', resourceId)
                    .single();

                if (fetchError || !serverResource) {
                    console.error('Fetch error:', fetchError);
                    alert('Resource not found on server. It may have been deleted.');
                    return;
                }

                const isOwner = serverResource.uploader_id === currentUser.id;
                const isAdmin = currentUserRole === 'admin' || currentUserRole === 'CEO';
                if (!isOwner && !isAdmin) {
                    alert('You do not have permission to edit this resource.');
                    return;
                }

                modalUploadBtn.disabled = true;
                modalUploadBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Saving...';
                modalProgress.style.display = 'block';
                modalProgressFill.style.width = '0%';

                try {
                    let fileUrl = serverResource.file_url;

                    if (file) {
                        if (serverResource.file_url) {
                            const oldFileName = getFileNameFromUrl(serverResource.file_url);
                            if (oldFileName && oldFileName !== 'unknown-file') {
                                await supabase.storage.from('resources').remove([`resources/${oldFileName}`]);
                            }
                        }

                        const fileExt = file.name.split('.').pop();
                        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
                        const filePath = `resources/${fileName}`;

                        const { error: uploadError } = await supabase.storage
                            .from('resources')
                            .upload(filePath, file, {
                                cacheControl: '3600',
                                upsert: false,
                                onUploadProgress: (progress) => {
                                    const percent = (progress.loaded / progress.total) * 100;
                                    modalProgressFill.style.width = `${percent}%`;
                                }
                            });

                        if (uploadError) throw new Error('Upload failed: ' + uploadError.message);

                        const { data: { publicUrl } } = supabase.storage.from('resources').getPublicUrl(filePath);
                        fileUrl = publicUrl;
                    }

                    const { error: dbError } = await supabase
                        .from('resources')
                        .update({
                            title,
                            description,
                            category,
                            file_url: fileUrl
                        })
                        .eq('id', resourceId);

                    if (dbError) throw new Error(dbError.message);

                    modalResourceTitle.value = '';
                    modalDesc.value = '';
                    modalFile.value = '';
                    fileLabel.textContent = 'Click or drag to choose a file';
                    filePreviewName.style.display = 'none';
                    fileReplaceHint.textContent = 'Choose a file to upload';
                    modalProgress.style.display = 'none';
                    uploadModal.classList.remove('open');
                    editingResourceId = null;

                    await loadResources();
                    showToast('✅ Resource updated successfully!');

                } catch (err) {
                    console.error('Update error:', err);
                    alert('Update failed: ' + err.message);
                } finally {
                    modalUploadBtn.disabled = false;
                    modalUploadBtn.innerHTML = '<i class="fas fa-upload"></i> Save Changes';
                }
            }

            // ─── Upload Resource ───
            async function uploadResource() {
                const title = modalResourceTitle.value.trim();
                const category = modalCategory.value;
                const description = modalDesc.value.trim();
                const file = modalFile.files[0];

                if (!title) { alert('Title is required.');
                    return; }
                if (!file) { alert('Please select a file.');
                    return; }
                if (!currentUser) { alert('You must be logged in to upload.');
                    return; }

                modalUploadBtn.disabled = true;
                modalUploadBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Uploading...';
                modalProgress.style.display = 'block';
                modalProgressFill.style.width = '0%';

                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
                    const filePath = `resources/${fileName}`;

                    const { error: uploadError } = await supabase.storage
                        .from('resources')
                        .upload(filePath, file, {
                            cacheControl: '3600',
                            upsert: false,
                            onUploadProgress: (progress) => {
                                const percent = (progress.loaded / progress.total) * 100;
                                modalProgressFill.style.width = `${percent}%`;
                            }
                        });

                    if (uploadError) throw uploadError;

                    const { data: { publicUrl } } = supabase.storage.from('resources').getPublicUrl(filePath);

                    const { error: dbError } = await supabase
                        .from('resources')
                        .insert({
                            title,
                            description,
                            category,
                            file_url: publicUrl,
                            uploader_id: currentUser.id,
                            uploader_name: currentUserName,
                            uploader_role: currentUserRole
                        });

                    if (dbError) throw dbError;

                    modalResourceTitle.value = '';
                    modalDesc.value = '';
                    modalFile.value = '';
                    fileLabel.textContent = 'Click or drag to choose a file';
                    filePreviewName.style.display = 'none';
                    fileReplaceHint.textContent = 'Choose a file to upload';
                    modalProgress.style.display = 'none';
                    uploadModal.classList.remove('open');

                    await loadResources();
                    showToast('✅ Resource uploaded successfully!');

                } catch (err) {
                    console.error(err);
                    alert('Upload failed: ' + err.message);
                } finally {
                    modalUploadBtn.disabled = false;
                    modalUploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload';
                }
            }

            // ─── Preview functions ───
            function openPreviewModal(resourceId) {
                previewList = getFilteredList();
                previewIndex = previewList.findIndex(r => r.id === resourceId);
                if (previewIndex === -1) {
                    previewList = [...allResources];
                    previewIndex = previewList.findIndex(r => r.id === resourceId);
                }
                if (previewIndex === -1) return;

                pdfDoc = null;
                currentPage = 1;
                totalPages = 0;
                rendering = false;

                updatePreviewContent();
                previewOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';

                if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active');
                }
            }

            function closePreviewModal() {
                previewOverlay.classList.remove('open');
                document.body.style.overflow = '';
                previewList = [];
                previewIndex = -1;
                pdfDoc = null;
                currentPage = 1;
                totalPages = 0;
                rendering = false;
            }

            function navigatePreview(direction) {
                if (previewList.length <= 1) return;
                const newIndex = previewIndex + direction;
                if (newIndex < 0 || newIndex >= previewList.length) return;
                previewIndex = newIndex;
                pdfDoc = null;
                currentPage = 1;
                totalPages = 0;
                rendering = false;
                updatePreviewContent();

                const container = document.getElementById('previewContainer');
                container.style.animation = 'none';
                container.offsetHeight;
                container.style.animation = 'slideUpPreview 0.25s cubic-bezier(0.22, 0.61, 0.36, 1)';
            }

            async function renderPdfPage(url, pageNum) {
                const container = previewMedia;
                container.innerHTML = '';

                const loader = document.createElement('div');
                loader.className = 'pdf-loading';
                loader.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Loading PDF…';
                container.appendChild(loader);

                try {
                    if (!pdfDoc) {
                        const loadingTask = pdfjsLib.getDocument(url);
                        pdfDoc = await loadingTask.promise;
                        totalPages = pdfDoc.numPages;
                    }

                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    await page.render(renderContext).promise;

                    container.innerHTML = '';
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-viewer-container';
                    wrapper.appendChild(canvas);

                    const controls = document.createElement('div');
                    controls.className = 'pdf-controls';
                    controls.innerHTML = `
                        <button id="pdfPrevPage" ${pageNum <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> Previous</button>
                        <span class="page-info">Page ${pageNum} / ${totalPages}</span>
                        <button id="pdfNextPage" ${pageNum >= totalPages ? 'disabled' : ''}>Next <i class="fas fa-chevron-right"></i></button>
                    `;
                    wrapper.appendChild(controls);
                    container.appendChild(wrapper);

                    const prevBtn = controls.querySelector('#pdfPrevPage');
                    const nextBtn = controls.querySelector('#pdfNextPage');
                    prevBtn.addEventListener('click', () => changePdfPage(-1));
                    nextBtn.addEventListener('click', () => changePdfPage(1));

                    const pdfKeyHandler = (e) => {
                        if (!previewOverlay.classList.contains('open')) return;
                        if (e.key === 'ArrowLeft' && !e.target.closest('input, textarea, button')) {
                            e.preventDefault();
                            changePdfPage(-1);
                        } else if (e.key === 'ArrowRight' && !e.target.closest('input, textarea, button')) {
                            e.preventDefault();
                            changePdfPage(1);
                        }
                    };
                    wrapper._pdfKeyHandler = pdfKeyHandler;
                    document.addEventListener('keydown', pdfKeyHandler);

                } catch (err) {
                    console.error('PDF rendering error:', err);
                    container.innerHTML = `
                        <div class="file-placeholder">
                            <i class="fas fa-file-pdf"></i>
                            <p style="color:#ff6b6b;">Failed to render PDF</p>
                            <p class="file-name-display">${escapeHtml(getFileNameFromUrl(url))}</p>
                            <a href="${escapeHtml(url)}" target="_blank" class="pi-download-btn" style="background:#428cff;padding:0.5rem 1.5rem;border-radius:2rem;color:#fff;text-decoration:none;">Open in browser</a>
                        </div>
                    `;
                }
            }

            async function changePdfPage(delta) {
                if (!pdfDoc) return;
                const newPage = currentPage + delta;
                if (newPage < 1 || newPage > totalPages) return;
                currentPage = newPage;
                const fileUrl = previewList[previewIndex]?.file_url;
                if (fileUrl) {
                    await renderPdfPage(fileUrl, currentPage);
                }
            }

            function updatePreviewContent() {
                const resource = previewList[previewIndex];
                if (!resource) return;

                const fileName = getFileNameFromUrl(resource.file_url);
                const fileUrl = resource.file_url;
                const iconClass = getFileIcon(fileName);
                const isImage = isImageFile(fileName);
                const isPdf = isPdfFile(fileName);
                const isVideo = isVideoFile(fileName);
                const isAudio = isAudioFile(fileName);

                if (previewList.length <= 1) {
                    previewPrev.classList.add('hidden');
                    previewNext.classList.add('hidden');
                } else {
                    previewPrev.classList.toggle('hidden', previewIndex === 0);
                    previewNext.classList.toggle('hidden', previewIndex === previewList.length - 1);
                }

                if (isPdf) {
                    renderPdfPage(fileUrl, 1);
                } else if (isImage) {
                    previewMedia.innerHTML = `
                        <img src="${escapeHtml(fileUrl)}" alt="${escapeHtml(resource.title)}" 
                             onerror="this.parentElement.innerHTML='<div class=\\'file-placeholder\\'><i class=\\'fas fa-file-image\\'></i><p>Image failed to load</p><p class=\\'file-name-display\\'>${escapeHtml(fileName)}</p></div>'"
                             loading="eager" />
                    `;
                } else if (isVideo) {
                    previewMedia.innerHTML = `
                        <video controls controlsList="nodownload" preload="metadata" playsinline
                               onerror="this.parentElement.innerHTML='<div class=\\'file-placeholder\\'><i class=\\'fas fa-file-video\\'></i><p>Video failed to load</p><p class=\\'file-name-display\\'>${escapeHtml(fileName)}</p></div>'">
                          <source src="${escapeHtml(fileUrl)}" type="video/${getFileExtension(fileName)}" />
                          Your browser does not support the video tag.
                        </video>
                    `;
                } else if (isAudio) {
                    previewMedia.innerHTML = `
                        <div class="file-placeholder" style="gap:1.5rem;">
                          <i class="fas ${iconClass}" style="font-size:4rem;"></i>
                          <p class="file-name-display">${escapeHtml(fileName)}</p>
                          <audio controls preload="metadata" style="width:100%;max-width:400px;">
                            <source src="${escapeHtml(fileUrl)}" type="audio/${getFileExtension(fileName)}" />
                            Your browser does not support the audio tag.
                          </audio>
                        </div>
                    `;
                } else {
                    const ext = getFileExtension(fileName).toUpperCase() || 'FILE';
                    previewMedia.innerHTML = `
                        <div class="file-placeholder">
                          <i class="fas ${iconClass}"></i>
                          <span class="file-type-badge">${ext}</span>
                          <p class="file-name-display">${escapeHtml(fileName)}</p>
                          <p style="color:#5b6b92;font-size:0.85rem;">Preview not available for this file type</p>
                        </div>
                    `;
                }

                const uploaderInitial = (resource.uploader_name || 'U').charAt(0).toUpperCase();
                const date = resource.created_at ? new Date(resource.created_at).toLocaleDateString(
                    'en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }) : 'Unknown date';
                const time = resource.created_at ? new Date(resource.created_at).toLocaleTimeString(
                    'en-US', {
                        hour: '2-digit',
                        minute: '2-digit'
                    }) : '';

                const displayName = fileName.length > 28 ? fileName.substring(0, 26) + '…' : fileName;

                previewInfo.innerHTML = `
                    <span class="pi-category">${escapeHtml(resource.category || 'Uncategorized')}</span>
                    <h3>${escapeHtml(resource.title)}</h3>
                    ${resource.description ? `<p class="pi-desc">${escapeHtml(resource.description)}</p>` : '<p class="pi-desc" style="color:#5b6b92;font-style:italic;">No description provided</p>'}
                    <div class="pi-meta">
                        <div class="pi-meta-row">
                            <div class="pi-avatar">${uploaderInitial}</div>
                            <span class="pi-name">${escapeHtml(resource.uploader_name || 'Unknown')}</span>
                            <span class="pi-role">${escapeHtml(resource.uploader_role || 'member')}</span>
                        </div>
                        <div class="pi-meta-row">
                            <i class="fas fa-calendar-alt"></i>
                            <span>${date} · ${time}</span>
                        </div>
                        <div class="pi-meta-row">
                            <i class="fas fa-file"></i>
                            <span class="pi-filename" title="${escapeHtml(fileName)}">${escapeHtml(displayName)}</span>
                        </div>
                    </div>
                    <a href="${escapeHtml(fileUrl)}" download="${escapeHtml(fileName)}" class="pi-download-btn" target="_blank" rel="noopener noreferrer">
                        <i class="fas fa-download"></i> Download
                    </a>
                `;
            }

            // ─── Start ───
            init();

            if (!document.getElementById('toast')) {
                const toastEl = document.createElement('div');
                toastEl.id = 'toast';
                toastEl.className = 'toast hide';
                document.body.appendChild(toastEl);
            }
        })();
    </script>

    <div id="toast" class="toast hide"></div>
</body>
</html>
